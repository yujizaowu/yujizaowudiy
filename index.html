<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif;
            background: #f7f5f2;
            color: #2e241f;
            padding: 12px;
            min-height: 100vh;
        }
        .app { 
            max-width: 1800px; 
            margin: 0 auto; 
        }
        
        /* 云端同步设置栏 */
        .cloud-sync-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            color: white;
        }
        .cloud-sync-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cloud-sync-left label {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .cloud-sync-left input {
            padding: 8px 14px;
            border: none;
            border-radius: 24px;
            font-size: 0.85rem;
            width: 260px;
            background: rgba(255,255,255,0.95);
        }
        .cloud-sync-actions {
            display: flex;
            gap: 8px;
        }
        .cloud-btn {
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .cloud-btn:hover {
            background: rgba(255,255,255,0.35);
        }
        .cloud-btn-primary {
            background: white;
            color: #667eea;
            border: none;
        }
        .sync-status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        .sync-dot.synced { background: #4ade80; }
        .sync-dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
        .sync-dot.error { background: #f87171; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .shop-name {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #3b2b24;
            border-left: 4px solid #b28b6f;
            padding-left: 14px;
        }
        .shop-name small { 
            font-size: 0.85rem; 
            color: #7f6a5c; 
            margin-left: 6px; 
        }
        .admin-actions { 
            display: flex; 
            gap: 6px; 
            flex-wrap: wrap; 
            align-items: center; 
        }
        .btn {
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            color: #2e241f;
            padding: 7px 12px;
            border-radius: 24px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { 
            background: #cdbcaf; 
        }
        .btn-primary { 
            background: #5e4b3c; 
            border-color: #3f3228; 
            color: #fdf6ef; 
        }
        .btn-success { 
            background: #4a7c59; 
            border-color: #3a6347; 
            color: #fff; 
        }
        .btn-sm { 
            padding: 5px 10px; 
            font-size: 0.75rem; 
        }
        .stats-bar { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 14px; 
            flex-wrap: wrap; 
        }
        .stat-card {
            background: #fefcf9;
            border-radius: 20px;
            padding: 8px 18px;
            border: 1px solid #e2d6cd;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .stat-card.active { 
            background: #5e4b3c; 
            color: #fdf6ef; 
        }
        .stat-number { 
            font-size: 1.4rem; 
            font-weight: 600; 
            min-width: 35px; 
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .seat-card {
            background: #fefcf9;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #e2d6cd;
        }
        .seat-card.hidden { display: none; }
        .seat-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 6px; 
        }
        .seat-name { 
            font-weight: 700; 
            font-size: 1rem; 
        }
        .seat-status {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 20px;
            background: #ede6df;
        }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-reserved { background: #d4c1f0; }
        .status-idle { background: #e5dfd9; }
        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            text-align: center;
            margin: 6px 0;
            background: #f3ede7;
            padding: 5px 0;
            border-radius: 10px;
        }
        .mode-badge {
            font-size: 0.6rem;
            background: #cfc1b6;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            margin: 0 auto 5px;
            text-align: center;
        }
        .seat-actions { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
            margin: 5px 0; 
        }
        .seat-actions .btn { 
            flex: 1 0 35px; 
            padding: 4px 2px; 
            font-size: 0.6rem; 
        }
        .notes-selector-wrapper {
            margin-top: 6px;
            border-top: 1px dashed #d6c9bf;
            padding-top: 6px;
        }
        .custom-select-wrapper {
            position: relative;
        }
        .notes-select {
            width: 100%;
            padding: 5px 20px 5px 8px;
            border: 1px solid #d6c9bf;
            border-radius: 16px;
            font-size: 0.65rem;
            background: #fffbf8;
            cursor: pointer;
            appearance: none;
        }
        .select-arrow {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #7f6a5c;
            font-size: 0.7rem;
        }
        .custom-note-input-wrapper {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }
        .custom-note-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #d6c9bf;
            border-radius: 16px;
            font-size: 0.6rem;
            background: #fffbf8;
        }
        .save-custom-btn {
            padding: 3px 6px;
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            border-radius: 16px;
            font-size: 0.55rem;
            cursor: pointer;
        }
        .current-note-display {
            margin-top: 4px;
            font-size: 0.55rem;
            color: #5e4b3c;
            padding: 2px 5px;
            background: #f4ede6;
            border-radius: 10px;
        }
        .reservation-info {
            margin-top: 5px;
            padding: 3px 6px;
            background: #f4ede6;
            border-radius: 10px;
            font-size: 0.55rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toast-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b2b24;
            color: #f0e4da;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast-message.show { opacity: 1; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.hidden { display: none !important; }
        .modal {
            background: #fefcf9;
            border-radius: 24px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { 
            margin-bottom: 16px; 
            color: #3b2b24; 
            font-size: 1.1rem;
        }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { 
            display: block; 
            margin-bottom: 5px; 
            color: #5f4e43; 
            font-size: 0.8rem;
        }
        .modal-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d6c9bf;
            border-radius: 20px;
            font-size: 0.9rem;
            background: #fffbf8;
        }
        .modal-actions { 
            display: flex; 
            gap: 8px; 
            justify-content: flex-end; 
            margin-top: 20px; 
        }
        .records-list { 
            margin: 14px 0; 
            max-height: 280px; 
            overflow-y: auto; 
        }
        .record-item {
            padding: 7px 10px;
            border-bottom: 1px solid #e2d6cd;
            font-size: 0.75rem;
        }
        .footer-note {
            margin-top: 16px;
            color: #a28d7e;
            font-size: 0.7rem;
            text-align: center;
            border-top: 1px dashed #d9ccc2;
            padding-top: 10px;
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 14px 0;
        }
        .payment-option {
            padding: 12px 8px;
            border: 2px solid #d6c9bf;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fffbf8;
        }
        .payment-option.selected {
            border-color: #5e4b3c;
            background: #5e4b3c;
            color: #fdf6ef;
        }
        .payment-option .payment-icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        .payment-option .payment-name {
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    
    <!-- 云端同步设置栏 -->
    <div id="cloudSyncBar" class="cloud-sync-bar">
        <div class="cloud-sync-left">
            <label>☁️ 云端同步</label>
            <input type="text" id="gistIdInputBar" placeholder="输入 Gist ID" maxlength="50">
        </div>
        <div class="cloud-sync-actions">
            <button class="cloud-btn" id="testSyncBarBtn">测试</button>
            <button class="cloud-btn cloud-btn-primary" id="saveSyncBarBtn">保存</button>
            <button class="cloud-btn" id="pullSyncBarBtn">⬇️ 拉取</button>
            <button class="cloud-btn" id="pushSyncBarBtn">⬆️ 上传</button>
            <div class="sync-status-badge" id="syncStatusBadge">
                <span class="sync-dot" id="syncDot"></span>
                <span id="syncTextBar">未配置</span>
            </div>
        </div>
    </div>
    
    <div id="adminView">
        <div class="header">
            <div class="shop-name">
                <span id="mainShopName">与己造物</span> 
                <small id="shopSubtitle">· 手作时光</small>
            </div>
            <div class="admin-actions">
                <button class="btn btn-sm" id="addSeatBtn">+座位</button>
                <button class="btn btn-sm" id="removeSeatBtn">-座位</button>
                <span id="seatCountDisplay" style="margin:0 4px;">36</span>
                <button class="btn btn-sm btn-primary" id="resetAllIdleBtn">全部空闲</button>
                <button class="btn btn-sm btn-success" id="viewRecordsBtn">记录</button>
                <button class="btn btn-sm btn-success" id="exportRecordsBtn">导出</button>
            </div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all">
                <span class="stat-number" id="statAll">36</span><span>全部</span>
            </div>
            <div class="stat-card" data-filter="active">
                <span class="stat-number" id="statActive">0</span><span>使用中</span>
            </div>
            <div class="stat-card" data-filter="reserved">
                <span class="stat-number" id="statReserved">0</span><span>已预约</span>
            </div>
            <div class="stat-card" data-filter="idle">
                <span class="stat-number" id="statIdle">36</span><span>空闲</span>
            </div>
        </div>
        
        <div id="seatsContainer" class="seats-grid"></div>
        
        <div class="footer-note">
            <p>点击「开台」开始计时 · 结束时可选择收款方式</p>
        </div>
    </div>

    <!-- 记录模态框 -->
    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>每日使用记录</h3>
            <div style="display:flex; gap:8px; margin:16px 0;">
                <input type="date" id="recordDateInput" style="flex:1; padding:8px; border-radius:20px; border:1px solid #d6c9bf;">
                <button class="btn btn-sm btn-primary" id="loadRecordsBtn">查看</button>
            </div>
            <div class="records-list" id="recordsList"></div>
            <div class="modal-actions">
                <button class="btn btn-sm btn-success" id="exportDayRecordsBtn">导出Excel</button>
                <button class="btn btn-sm" id="closeRecordsBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 倒计时模态框 -->
    <div id="customTimeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>设置倒计时</h3>
            <div class="modal-input-group">
                <input type="number" id="customMinutesInput" placeholder="分钟数" min="0.1" value="60" step="0.5">
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelCustomBtn">取消</button>
                <button class="btn btn-primary" id="confirmCustomBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 预约模态框 -->
    <div id="reservationModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>填写预约信息</h3>
            <div class="modal-input-group">
                <label>顾客姓名 *</label>
                <input type="text" id="reserveNameInput" placeholder="姓名">
            </div>
            <div class="modal-input-group">
                <label>联系方式</label>
                <input type="text" id="reserveContactInput" placeholder="电话/微信号">
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelReserveBtn">取消</button>
                <button class="btn btn-primary" id="confirmReserveBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- 收款模态框 -->
    <div id="paymentModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>选择收款方式</h3>
            <div id="paymentSeatInfo" style="margin-bottom:12px;"></div>
            <div class="payment-methods">
                <div class="payment-option" data-payment="抖音团购">
                    <div class="payment-icon">🎵</div>
                    <div class="payment-name">抖音团购</div>
                </div>
                <div class="payment-option" data-payment="美团团购">
                    <div class="payment-icon">🍔</div>
                    <div class="payment-name">美团团购</div>
                </div>
                <div class="payment-option" data-payment="支付宝">
                    <div class="payment-icon">💙</div>
                    <div class="payment-name">支付宝</div>
                </div>
                <div class="payment-option" data-payment="微信">
                    <div class="payment-icon">💚</div>
                    <div class="payment-name">微信</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="skipPaymentBtn">跳过</button>
                <button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    "use strict";
    
    const STORAGE_KEY = 'yujizaowu_seats_v7';
    const RECORDS_KEY = 'yujizaowu_records_v7';
    const GIST_CONFIG_KEY = 'yujizaowu_gist_config';
    const DEFAULT_SEAT_COUNT = 36;
    
    const NOTE_OPTIONS = ['', '抖音全天', '美团全天', '抖音小时', '美团小时', '__custom__'];
    const NOTE_LABELS = {
        '': '无备注',
        '抖音全天': '抖音全天',
        '美团全天': '美团全天', 
        '抖音小时': '抖音小时',
        '美团小时': '美团小时',
        '__custom__': '✨ 自定义'
    };
    
    let seats = [];
    let usageRecords = [];
    let globalTimer = null;
    let pendingCustomSeatId = null;
    let pendingReserveSeatId = null;
    let pendingEndSeatId = null;
    let selectedPayment = null;
    let currentFilter = 'all';
    
    let gistConfig = { gistId: 'fffd6e64e8ae3d70cee6c7e0b1ba3cc2' };
    let syncStatus = 'local';

    const $ = id => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function updateSyncUI() {
        const dot = $('syncDot');
        const text = $('syncTextBar');
        dot.className = 'sync-dot';
        if (syncStatus === 'synced') {
            dot.classList.add('synced');
            text.textContent = '已同步';
        } else if (syncStatus === 'syncing') {
            dot.classList.add('syncing');
            text.textContent = '同步中';
        } else if (syncStatus === 'error') {
            dot.classList.add('error');
            text.textContent = '失败';
        } else {
            text.textContent = gistConfig.gistId ? '已配置' : '未配置';
        }
    }

    function loadGistConfig() {
        try {
            const saved = JSON.parse(localStorage.getItem(GIST_CONFIG_KEY));
            if (saved) gistConfig = saved;
        } catch(e) {}
        $('gistIdInputBar').value = gistConfig.gistId || '';
        updateSyncUI();
    }

    function saveGistConfig() {
        localStorage.setItem(GIST_CONFIG_KEY, JSON.stringify(gistConfig));
        updateSyncUI();
    }

    // ========== 拉取云端数据 ==========
    async function pullFromCloud() {
        if (!gistConfig.gistId) {
            showToast('⚠️ 请先配置 Gist ID');
            return null;
        }
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`);
            if (!response.ok) throw new Error('获取失败');
            
            const gist = await response.json();
            const files = gist.files || {};
            
            let hasData = false;
            
            // 拉取座位数据
            if (files['seats.json']?.content) {
                const cloudSeats = JSON.parse(files['seats.json'].content);
                // 合并策略：保留本地正在运行的状态
                cloudSeats.forEach(cloudSeat => {
                    const localSeat = seats.find(s => s.id === cloudSeat.id);
                    if (localSeat && localSeat.running) {
                        // 如果本地正在运行，保持本地状态
                        cloudSeat.running = localSeat.running;
                        cloudSeat.startTimestamp = localSeat.startTimestamp;
                        cloudSeat.accumulatedSeconds = localSeat.accumulatedSeconds;
                    }
                });
                seats = cloudSeats;
                hasData = true;
            }
            
            // 拉取记录数据
            if (files['records.json']?.content) {
                const cloudRecords = JSON.parse(files['records.json'].content);
                // 合并去重
                cloudRecords.forEach(r => {
                    if (!usageRecords.some(local => local.id === r.id)) {
                        usageRecords.push(r);
                    }
                });
                hasData = true;
            }
            
            if (hasData) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                localStorage.setItem(RECORDS_KEY, JSON.stringify(usageRecords));
                renderAdminGrid();
                syncStatus = 'synced';
                showToast('✅ 拉取成功');
            } else {
                syncStatus = 'synced';
                showToast('ℹ️ 云端暂无数据');
            }
            
            updateSyncUI();
            return true;
        } catch (e) {
            console.error('拉取失败:', e);
            syncStatus = 'error';
            updateSyncUI();
            showToast('❌ 拉取失败: ' + e.message);
            return null;
        }
    }

    // ========== 上传到云端 ==========
    async function pushToCloud() {
        if (!gistConfig.gistId) {
            showToast('⚠️ 请先配置 Gist ID');
            return false;
        }
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            const files = {
                'seats.json': { content: JSON.stringify(seats) },
                'records.json': { content: JSON.stringify(usageRecords) }
            };
            
            const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ files })
            });
            
            if (!response.ok) throw new Error('上传失败');
            
            syncStatus = 'synced';
            updateSyncUI();
            showToast('✅ 上传成功');
            return true;
        } catch (e) {
            console.error('上传失败:', e);
            syncStatus = 'error';
            updateSyncUI();
            showToast('❌ 上传失败: ' + e.message);
            return false;
        }
    }

    // ========== 测试连接 ==========
    async function testConnection() {
        const gistId = $('gistIdInputBar').value.trim();
        if (!gistId) {
            showToast('⚠️ 请输入 Gist ID');
            return;
        }
        
        try {
            const response = await fetch(`https://api.github.com/gists/${gistId}`);
            if (response.ok) {
                showToast('✅ 连接成功');
            } else {
                showToast('❌ Gist 不存在');
            }
        } catch (e) {
            showToast('❌ 网络错误');
        }
    }

    // ========== 座位相关函数 ==========
    function createDefaultSeat(id) {
        return {
            id, name: id + '号桌', status: 'idle', timerMode: 'countup',
            countdownInitial: 3600, accumulatedSeconds: 0, running: false,
            startTimestamp: null, notes: '', customNoteValue: '', reserved: false, reservation: null
        };
    }

    function loadSeats() {
        try { 
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(parsed) && parsed.length) { 
                seats = parsed; 
                return; 
            }
        } catch(e) {}
        seats = Array.from({length: DEFAULT_SEAT_COUNT}, (_, i) => createDefaultSeat(i+1));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
    }
    
    function loadRecords() {
        try { 
            usageRecords = JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; 
        } catch(e) { 
            usageRecords = []; 
        }
    }
    
    function getSeatIndex(id) { return seats.findIndex(s => s.id === id); }

    function getCurrentSeconds(seat) {
        let base = seat.accumulatedSeconds || 0;
        if (seat.running && seat.startTimestamp) base += (Date.now() - seat.startTimestamp) / 1000;
        return base;
    }

    function formatTime(s) {
        s = Math.max(0, s);
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function getTimerText(seat) {
        if (seat.timerMode === 'countdown') return formatTime(Math.max(0, seat.countdownInitial - getCurrentSeconds(seat)));
        return formatTime(getCurrentSeconds(seat));
    }

    function stopRunning(seat) {
        if (seat.running && seat.startTimestamp) {
            seat.accumulatedSeconds += (Date.now() - seat.startTimestamp) / 1000;
            seat.running = false;
            seat.startTimestamp = null;
        }
    }

    function actionOpenTable(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.status = 'active'; seat.reserved = false; seat.reservation = null;
        seat.accumulatedSeconds = 0; seat.running = false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`✅ ${seat.name} 已开台`);
    }

    function actionStart(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (seat.reserved) { showToast('⚠️ 已预约，请先开台'); return; }
        if (seat.status === 'idle') { showToast('⚠️ 请先开台'); return; }
        if (seat.running) return;
        seat.running = true; seat.startTimestamp = Date.now(); seat.status = 'active';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function actionPause(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        stopRunning(seats[idx]); 
        seats[idx].status = 'paused';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`⏸️ ${seats[idx].name} 已暂停`);
    }

    function actionEndWithPayment(seatId, paymentMethod) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        const duration = formatTime(seat.accumulatedSeconds);
        const record = {
            id: Date.now() + Math.random(),
            seatName: seat.name,
            action: '结束使用',
            duration,
            notes: seat.notes || '',
            paymentMethod,
            timestamp: new Date().toISOString()
        };
        usageRecords.push(record);
        seat.status = 'idle'; seat.reserved = false; seat.reservation = null; 
        seat.accumulatedSeconds = 0; seat.notes = ''; seat.customNoteValue = '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        localStorage.setItem(RECORDS_KEY, JSON.stringify(usageRecords));
        renderAdminGrid();
        showToast(`✅ ${seat.name} 结束 ${duration}${paymentMethod ? ' · '+paymentMethod : ''}`);
    }

    function actionReset(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat); 
        seat.accumulatedSeconds = 0;
        seat.notes = ''; seat.customNoteValue = '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`🔄 ${seat.name} 已重置`);
    }

    function actionToggleMode(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.timerMode = seat.timerMode === 'countup' ? 'countdown' : 'countup';
        seat.accumulatedSeconds = 0;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
        showToast(`🔁 ${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}`);
    }

    function getEffectiveNote(seat) {
        if (seat.notes === '__custom__') return seat.customNoteValue || '';
        return seat.notes || '';
    }

    function handleNoteSelect(seatId, value) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (value === '__custom__') {
            seat.notes = '__custom__';
        } else {
            seat.notes = value;
            seat.customNoteValue = '';
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function handleCustomNoteSave(seatId, customValue) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        seat.customNoteValue = customValue.trim();
        if (seat.notes === '__custom__' || !seat.notes) seat.notes = '__custom__';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function showPaymentModal(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        pendingEndSeatId = seatId;
        selectedPayment = null;
        $('paymentSeatInfo').textContent = `${seat.name} · ${formatTime(getCurrentSeconds(seat))}`;
        document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
        $('confirmPaymentBtn').disabled = true;
        $('paymentModal').classList.remove('hidden');
    }

    function renderAdminGrid() {
        let html = '';
        seats.forEach(seat => {
            const statusClass = seat.reserved ? 'status-reserved' : 
                (seat.status === 'active' ? (seat.running ? 'status-active' : 'status-paused') : 
                (seat.status === 'paused' ? 'status-paused' : 'status-idle'));
            const statusText = seat.reserved ? '预约' : 
                (seat.status === 'idle' ? '空闲' : (seat.running ? '计时中' : '暂停'));
            
            const currentNoteValue = seat.notes || '';
            const effectiveNote = getEffectiveNote(seat);
            const customInputValue = seat.notes === '__custom__' ? (seat.customNoteValue || '') : '';
            const showCustomInput = seat.notes === '__custom__';
            
            const optionsHtml = NOTE_OPTIONS.map(opt => {
                const selected = currentNoteValue === opt ? 'selected' : '';
                return `<option value="${opt}" ${selected}>${NOTE_LABELS[opt]}</option>`;
            }).join('');
            
            html += `
                <div class="seat-card" data-seat-id="${seat.id}">
                    <div class="seat-header">
                        <span class="seat-name">${seat.name}</span>
                        <span class="seat-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="mode-badge">${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}</div>
                    <div class="timer-display" id="timer-${seat.id}">${getTimerText(seat)}</div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="start" data-id="${seat.id}">开始</button>
                        <button class="btn btn-sm" data-action="pause" data-id="${seat.id}">暂停</button>
                        <button class="btn btn-sm" data-action="end" data-id="${seat.id}">结束</button>
                        <button class="btn btn-sm" data-action="reset" data-id="${seat.id}">重置</button>
                    </div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="openTable" data-id="${seat.id}">开台</button>
                        <button class="btn btn-sm" data-action="reserve" data-id="${seat.id}">预约</button>
                        <button class="btn btn-sm" data-action="toggleMode" data-id="${seat.id}">切换</button>
                        <button class="btn btn-sm btn-primary" data-action="customCountdown" data-id="${seat.id}">倒计时</button>
                    </div>
                    
                    <div class="notes-selector-wrapper">
                        <div class="custom-select-wrapper">
                            <select class="notes-select" data-action="noteSelect" data-id="${seat.id}">
                                ${optionsHtml}
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                        ${showCustomInput ? `
                        <div class="custom-note-input-wrapper">
                            <input type="text" class="custom-note-input" placeholder="自定义备注" data-id="${seat.id}" value="${customInputValue.replace(/"/g, '&quot;')}">
                            <button class="save-custom-btn" data-action="saveCustomNote" data-id="${seat.id}">保存</button>
                        </div>
                        ` : ''}
                        ${effectiveNote ? `<div class="current-note-display">📋 ${effectiveNote}</div>` : ''}
                    </div>
                    
                    ${seat.reserved && seat.reservation ? 
                        `<div class="reservation-info">
                            <span>预约: ${seat.reservation.name}</span>
                            <button style="background:none;border:none;cursor:pointer;" data-action="cancelReserve" data-id="${seat.id}">取消</button>
                        </div>` : ''
                    }
                </div>
            `;
        });
        $('seatsContainer').innerHTML = html;
        updateStats();
        $('seatCountDisplay').textContent = seats.length;
    }

    function updateStats() {
        $('statAll').textContent = seats.length;
        $('statActive').textContent = seats.filter(s => s.status === 'active' && !s.reserved).length;
        $('statReserved').textContent = seats.filter(s => s.reserved).length;
        $('statIdle').textContent = seats.filter(s => s.status === 'idle' && !s.reserved).length;
    }

    function applyFilter() {
        document.querySelectorAll('.seat-card').forEach(card => {
            const seat = seats.find(s => s.id === parseInt(card.dataset.seatId));
            if (!seat) return;
            let show = true;
            if (currentFilter === 'active') show = seat.status === 'active' && !seat.reserved;
            else if (currentFilter === 'reserved') show = seat.reserved;
            else if (currentFilter === 'idle') show = seat.status === 'idle' && !seat.reserved;
            card.classList.toggle('hidden', !show);
        });
    }

    function showRecords(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        $('recordDateInput').value = date;
        const list = $('recordsList');
        const dayRecords = usageRecords.filter(r => r.timestamp.startsWith(date));
        if (!dayRecords.length) { 
            list.innerHTML = '<div style="text-align:center;padding:20px;">暂无记录</div>'; 
            return; 
        }
        list.innerHTML = dayRecords.map(r => `
            <div class="record-item">
                <strong>${r.seatName}</strong> · ${r.duration}<br>
                <span style="color:#999;">${new Date(r.timestamp).toLocaleTimeString()}${r.paymentMethod ? ' · '+r.paymentMethod : ''}</span>
            </div>
        `).join('');
    }

    function exportToExcel(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        const data = [['座位','时长','收款方式','时间']];
        usageRecords.filter(r => r.timestamp.startsWith(date)).forEach(r => data.push([
            r.seatName, r.duration, r.paymentMethod || '', new Date(r.timestamp).toLocaleString()
        ]));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), '记录');
        XLSX.writeFile(wb, `记录_${date}.xlsx`);
        showToast('✅ 导出成功');
    }

    function setupEvents() {
        $('testSyncBarBtn').onclick = testConnection;
        $('pullSyncBarBtn').onclick = pullFromCloud;
        $('pushSyncBarBtn').onclick = pushToCloud;
        
        $('saveSyncBarBtn').onclick = () => {
            const gistId = $('gistIdInputBar').value.trim();
            if (gistId) {
                gistConfig.gistId = gistId;
                saveGistConfig();
                showToast('✅ 配置已保存');
            }
        };
        
        $('seatsContainer').onclick = e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action, seatId = parseInt(btn.dataset.id);
            
            if (action === 'start') actionStart(seatId);
            else if (action === 'pause') actionPause(seatId);
            else if (action === 'end') showPaymentModal(seatId);
            else if (action === 'reset') actionReset(seatId);
            else if (action === 'openTable') actionOpenTable(seatId);
            else if (action === 'reserve') { 
                pendingReserveSeatId = seatId; 
                $('reserveNameInput').value = ''; 
                $('reserveContactInput').value = ''; 
                $('reservationModal').classList.remove('hidden'); 
            }
            else if (action === 'cancelReserve') { 
                const idx = getSeatIndex(seatId); 
                if (idx!==-1) { 
                    seats[idx].reserved = false; 
                    seats[idx].reservation = null; 
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                    renderAdminGrid(); 
                } 
            }
            else if (action === 'toggleMode') actionToggleMode(seatId);
            else if (action === 'customCountdown') { 
                pendingCustomSeatId = seatId; 
                $('customMinutesInput').value = '60'; 
                $('customTimeModal').classList.remove('hidden'); 
            }
            else if (action === 'saveCustomNote') {
                const input = document.querySelector(`.custom-note-input[data-id="${seatId}"]`);
                if (input) handleCustomNoteSave(seatId, input.value);
            }
        };

        $('seatsContainer').onchange = e => {
            if (e.target.classList.contains('notes-select')) {
                handleNoteSelect(parseInt(e.target.dataset.id), e.target.value);
            }
        };

        document.querySelectorAll('.stat-card').forEach(c => c.onclick = () => {
            currentFilter = c.dataset.filter;
            document.querySelectorAll('.stat-card').forEach(x => x.classList.remove('active'));
            c.classList.add('active'); 
            applyFilter();
        });

        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedPayment = opt.dataset.payment;
                $('confirmPaymentBtn').disabled = false;
            };
        });

        $('confirmPaymentBtn').onclick = () => {
            if (pendingEndSeatId && selectedPayment) {
                actionEndWithPayment(pendingEndSeatId, selectedPayment);
                $('paymentModal').classList.add('hidden');
            }
        };

        $('skipPaymentBtn').onclick = () => {
            if (pendingEndSeatId) {
                actionEndWithPayment(pendingEndSeatId, null);
                $('paymentModal').classList.add('hidden');
            }
        };

        $('addSeatBtn').onclick = () => { 
            const newId = Math.max(...seats.map(s=>s.id)) + 1;
            seats.push(createDefaultSeat(newId)); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
            renderAdminGrid(); 
        };
        
        $('removeSeatBtn').onclick = () => { 
            if(seats.length>1) { 
                seats.pop(); 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                renderAdminGrid(); 
            }
        };
        
        $('resetAllIdleBtn').onclick = () => { 
            seats.forEach(s => { 
                stopRunning(s); 
                s.status='idle'; 
                s.reserved=false; 
                s.accumulatedSeconds=0;
            }); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
            renderAdminGrid(); 
        };
        
        $('viewRecordsBtn').onclick = () => { 
            showRecords(new Date().toISOString().split('T')[0]); 
            $('recordsModal').classList.remove('hidden'); 
        };
        
        $('closeRecordsBtn').onclick = () => $('recordsModal').classList.add('hidden');
        $('loadRecordsBtn').onclick = () => { 
            if($('recordDateInput').value) showRecords($('recordDateInput').value); 
        };
        $('exportRecordsBtn').onclick = () => exportToExcel(new Date().toISOString().split('T')[0]);
        $('exportDayRecordsBtn').onclick = () => { 
            exportToExcel($('recordDateInput').value); 
        };
        
        $('cancelCustomBtn').onclick = () => $('customTimeModal').classList.add('hidden');
        $('confirmCustomBtn').onclick = () => {
            const m = parseFloat($('customMinutesInput').value);
            if (m>0 && pendingCustomSeatId) { 
                const idx = getSeatIndex(pendingCustomSeatId); 
                if(idx!==-1){ 
                    stopRunning(seats[idx]); 
                    seats[idx].countdownInitial = Math.floor(m*60); 
                    seats[idx].timerMode='countdown'; 
                    seats[idx].accumulatedSeconds=0; 
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                    renderAdminGrid(); 
                } 
            }
            $('customTimeModal').classList.add('hidden');
        };
        
        $('cancelReserveBtn').onclick = () => $('reservationModal').classList.add('hidden');
        $('confirmReserveBtn').onclick = () => {
            const name = $('reserveNameInput').value.trim();
            if (!name) { showToast('⚠️ 请填写姓名'); return; }
            if (pendingReserveSeatId) { 
                const idx = getSeatIndex(pendingReserveSeatId); 
                if(idx!==-1){ 
                    seats[idx].reserved=true; 
                    seats[idx].status='idle'; 
                    seats[idx].reservation={name, contact: $('reserveContactInput').value.trim()}; 
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                    renderAdminGrid(); 
                } 
            }
            $('reservationModal').classList.add('hidden');
        };
        
        document.querySelectorAll('.modal-overlay').forEach(m => m.onclick = e => { 
            if(e.target===m) m.classList.add('hidden'); 
        });
    }

    // 初始化
    loadGistConfig();
    loadSeats(); 
    loadRecords(); 
    renderAdminGrid(); 
    setupEvents();
    updateSyncUI();
    
    // 自动拉取一次
    if (gistConfig.gistId) {
        setTimeout(() => pullFromCloud(), 500);
    }
    
    globalTimer = setInterval(() => {
        seats.forEach(s => { 
            const el = $(`timer-${s.id}`); 
            if(el) el.textContent = getTimerText(s); 
            if(s.timerMode==='countdown' && s.running && s.countdownInitial-getCurrentSeconds(s)<=0){ 
                s.running=false; 
                s.accumulatedSeconds=s.countdownInitial; 
                s.status='paused'; 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                renderAdminGrid(); 
            } 
        });
        updateStats();
    }, 200);
})();
</script>
</body>
</html>
