<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif;
            background: #f7f5f2;
            color: #2e241f;
            padding: 16px;
            min-height: 100vh;
        }
        .app { 
            max-width: 1800px; 
            margin: 0 auto; 
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .shop-name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shop-name {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #3b2b24;
            border-left: 5px solid #b28b6f;
            padding-left: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shop-name small { 
            font-size: 0.9rem; 
            color: #7f6a5c; 
            margin-left: 8px; 
        }
        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #7f6a5c;
        }
        .sync-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }
        .sync-indicator.synced { background: #4a7c59; }
        .sync-indicator.syncing { background: #f39c12; animation: pulse 1s infinite; }
        .sync-indicator.error { background: #c0392b; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .admin-actions { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            align-items: center; 
        }
        .btn {
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            color: #2e241f;
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { 
            background: #cdbcaf; 
        }
        .btn-primary { 
            background: #5e4b3c; 
            border-color: #3f3228; 
            color: #fdf6ef; 
        }
        .btn-success { 
            background: #4a7c59; 
            border-color: #3a6347; 
            color: #fff; 
        }
        .btn-sm { 
            padding: 4px 8px; 
            font-size: 0.75rem; 
        }
        .stats-bar { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 16px; 
            flex-wrap: wrap; 
        }
        .stat-card {
            background: #fefcf9;
            border-radius: 20px;
            padding: 10px 20px;
            border: 1px solid #e2d6cd;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .stat-card.active { 
            background: #5e4b3c; 
            color: #fdf6ef; 
        }
        .stat-number { 
            font-size: 1.5rem; 
            font-weight: 600; 
            min-width: 40px; 
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .seat-card {
            background: #fefcf9;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #e2d6cd;
        }
        .seat-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 8px; 
        }
        .seat-name { 
            font-weight: 700; 
            font-size: 1.1rem; 
        }
        .seat-status {
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 20px;
            background: #ede6df;
        }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-reserved { background: #d4c1f0; }
        .status-idle { background: #e5dfd9; }
        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            text-align: center;
            margin: 8px 0;
            background: #f3ede7;
            padding: 6px 0;
            border-radius: 12px;
        }
        .mode-badge {
            font-size: 0.65rem;
            background: #cfc1b6;
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            margin: 0 auto 6px;
            text-align: center;
        }
        .seat-actions { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 4px; 
            margin: 6px 0; 
        }
        .seat-actions .btn { 
            flex: 1 0 40px; 
            padding: 5px 2px; 
            font-size: 0.65rem; 
        }
        .notes-selector-wrapper {
            margin-top: 8px;
            border-top: 1px dashed #d6c9bf;
            padding-top: 8px;
        }
        .custom-select-wrapper {
            position: relative;
        }
        .notes-select {
            width: 100%;
            padding: 6px 24px 6px 10px;
            border: 1px solid #d6c9bf;
            border-radius: 20px;
            font-size: 0.7rem;
            background: #fffbf8;
            cursor: pointer;
            appearance: none;
        }
        .select-arrow {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #7f6a5c;
            font-size: 0.8rem;
        }
        .custom-note-input-wrapper {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .custom-note-input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #d6c9bf;
            border-radius: 20px;
            font-size: 0.65rem;
            background: #fffbf8;
        }
        .save-custom-btn {
            padding: 4px 8px;
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            border-radius: 20px;
            font-size: 0.6rem;
            cursor: pointer;
        }
        .current-note-display {
            margin-top: 4px;
            font-size: 0.6rem;
            color: #5e4b3c;
            padding: 3px 6px;
            background: #f4ede6;
            border-radius: 12px;
        }
        .reservation-info {
            margin-top: 6px;
            padding: 4px 8px;
            background: #f4ede6;
            border-radius: 12px;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toast-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b2b24;
            color: #f0e4da;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast-message.show { opacity: 1; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.hidden { display: none !important; }
        .modal {
            background: #fefcf9;
            border-radius: 24px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { 
            margin-bottom: 16px; 
            color: #3b2b24; 
            font-size: 1.2rem;
        }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { 
            display: block; 
            margin-bottom: 5px; 
            color: #5f4e43; 
            font-size: 0.85rem;
        }
        .modal-input-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d6c9bf;
            border-radius: 24px;
            font-size: 0.9rem;
            background: #fffbf8;
        }
        .modal-actions { 
            display: flex; 
            gap: 8px; 
            justify-content: flex-end; 
            margin-top: 20px; 
        }
        .records-list { 
            margin: 16px 0; 
            max-height: 300px; 
            overflow-y: auto; 
        }
        .record-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e2d6cd;
            font-size: 0.8rem;
        }
        .footer-note {
            margin-top: 20px;
            color: #a28d7e;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px dashed #d9ccc2;
            padding-top: 12px;
        }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 16px 0;
        }
        .payment-option {
            padding: 12px 10px;
            border: 2px solid #d6c9bf;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fffbf8;
        }
        .payment-option.selected {
            border-color: #5e4b3c;
            background: #5e4b3c;
            color: #fdf6ef;
        }
        .payment-option .payment-icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        .payment-option .payment-name {
            font-size: 0.8rem;
            font-weight: 500;
        }
        .gist-settings {
            margin-bottom: 16px;
            padding: 12px;
            background: #f4ede6;
            border-radius: 12px;
        }
        .gist-settings input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d6c9bf;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 6px;
        }
        .gist-settings small {
            color: #7f6a5c;
            font-size: 0.7rem;
        }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    
    <div id="adminView">
        <div class="header">
            <div class="shop-name-wrapper">
                <div id="shopNameDisplay" class="shop-name">
                    <span id="mainShopName">与己造物</span> 
                    <small id="shopSubtitle">· 手作时光</small>
                </div>
                <div class="sync-status">
                    <span class="sync-indicator" id="syncIndicator"></span>
                    <span id="syncText">本地</span>
                </div>
            </div>
            <div class="admin-actions">
                <button class="btn btn-sm" id="syncNowBtn" title="立即同步">🔄 同步</button>
                <button class="btn btn-sm" id="setupGistBtn" title="设置云同步">⚙️ 云设置</button>
                <button class="btn btn-sm" id="addSeatBtn">+座位</button>
                <button class="btn btn-sm" id="removeSeatBtn">-座位</button>
                <span id="seatCountDisplay" style="margin:0 4px; color:#5f4e43;">36</span>
                <button class="btn btn-sm btn-primary" id="resetAllIdleBtn">全部空闲</button>
                <button class="btn btn-sm btn-success" id="viewRecordsBtn">记录</button>
                <button class="btn btn-sm btn-success" id="exportRecordsBtn">导出</button>
            </div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all">
                <span class="stat-number" id="statAll">36</span>
                <span>全部</span>
            </div>
            <div class="stat-card" data-filter="active">
                <span class="stat-number" id="statActive">0</span>
                <span>使用中</span>
            </div>
            <div class="stat-card" data-filter="reserved">
                <span class="stat-number" id="statReserved">0</span>
                <span>已预约</span>
            </div>
            <div class="stat-card" data-filter="idle">
                <span class="stat-number" id="statIdle">36</span>
                <span>空闲</span>
            </div>
        </div>
        
        <div id="seatsContainer" class="seats-grid"></div>
        
        <div class="footer-note">
            <p>开台后计时 · 结束可选收款 · 支持云端同步</p>
        </div>
    </div>

    <!-- 云同步设置模态框 -->
    <div id="gistSettingsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>☁️ 云端同步设置</h3>
            <div class="gist-settings">
                <p style="margin-bottom: 12px; font-size: 0.85rem;">
                    使用 GitHub Gist 实现多设备数据同步。<br>
                    <a href="https://gist.github.com/" target="_blank" style="color: #5e4b3c;">创建 Gist →</a>
                </p>
                <label style="font-size: 0.8rem;">Gist ID (32位字符)</label>
                <input type="text" id="gistIdInput" placeholder="例如: a1b2c3d4e5f6..." maxlength="50">
                <label style="font-size: 0.8rem; margin-top: 10px; display: block;">GitHub Token (可选，避免限流)</label>
                <input type="password" id="githubTokenInput" placeholder="ghp_xxxxxxxxxxxx">
                <small>不填 Token 也可以使用，但每小时请求次数有限</small>
            </div>
            <div class="modal-actions">
                <button class="btn" id="testSyncBtn">测试连接</button>
                <button class="btn" id="closeGistSettingsBtn">取消</button>
                <button class="btn btn-primary" id="saveGistSettingsBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 其他模态框保持不变 -->
    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>每日使用记录</h3>
            <div style="display:flex; gap:8px; margin:16px 0;">
                <input type="date" id="recordDateInput" style="flex:1; padding:8px; border-radius:20px; border:1px solid #d6c9bf;">
                <button class="btn btn-sm btn-primary" id="loadRecordsBtn">查看</button>
            </div>
            <div class="records-list" id="recordsList">
                <div style="text-align:center; color:#999; padding:20px;">请选择日期</div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-sm btn-success" id="exportDayRecordsBtn">导出Excel</button>
                <button class="btn btn-sm" id="closeRecordsBtn">关闭</button>
            </div>
        </div>
    </div>

    <div id="customTimeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>设置倒计时</h3>
            <div class="modal-input-group">
                <input type="number" id="customMinutesInput" placeholder="分钟数" min="0.1" value="60" step="0.5">
            </div>
            <div style="color:#7f6a5c; margin-bottom:16px; font-size:0.8rem;">支持小数，如 1.5 = 1分30秒</div>
            <div class="modal-actions">
                <button class="btn" id="cancelCustomBtn">取消</button>
                <button class="btn btn-primary" id="confirmCustomBtn">确定</button>
            </div>
        </div>
    </div>

    <div id="reservationModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>填写预约信息</h3>
            <div class="modal-input-group">
                <label>顾客姓名 <span style="color:#c0392b;">*</span></label>
                <input type="text" id="reserveNameInput" placeholder="姓名" maxlength="50">
            </div>
            <div class="modal-input-group">
                <label>联系方式</label>
                <input type="text" id="reserveContactInput" placeholder="电话/微信号">
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelReserveBtn">取消</button>
                <button class="btn btn-primary" id="confirmReserveBtn">确认</button>
            </div>
        </div>
    </div>

    <div id="paymentModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>选择收款方式</h3>
            <div style="margin-bottom:12px; color:#5f4e43;" id="paymentSeatInfo"></div>
            <div class="payment-methods">
                <div class="payment-option" data-payment="抖音团购">
                    <div class="payment-icon">🎵</div>
                    <div class="payment-name">抖音团购</div>
                </div>
                <div class="payment-option" data-payment="美团团购">
                    <div class="payment-icon">🍔</div>
                    <div class="payment-name">美团团购</div>
                </div>
                <div class="payment-option" data-payment="支付宝">
                    <div class="payment-icon">💙</div>
                    <div class="payment-name">支付宝</div>
                </div>
                <div class="payment-option" data-payment="微信">
                    <div class="payment-icon">💚</div>
                    <div class="payment-name">微信</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="skipPaymentBtn">跳过</button>
                <button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    "use strict";
    
    const STORAGE_KEY = 'yujizaowu_seats_v5';
    const RECORDS_KEY = 'yujizaowu_records_v5';
    const SHOP_NAME_KEY = 'yujizaowu_shop_name';
    const GIST_CONFIG_KEY = 'yujizaowu_gist_config';
    const DEFAULT_SEAT_COUNT = 36;
    
    const NOTE_OPTIONS = ['', '抖音全天', '美团全天', '抖音小时', '美团小时', '__custom__'];
    const NOTE_LABELS = {
        '': '无备注',
        '抖音全天': '抖音全天',
        '美团全天': '美团全天', 
        '抖音小时': '抖音小时',
        '美团小时': '美团小时',
        '__custom__': '✨ 自定义'
    };
    
    let seats = [];
    let usageRecords = [];
    let globalTimer = null;
    let pendingCustomSeatId = null;
    let pendingReserveSeatId = null;
    let pendingEndSeatId = null;
    let selectedPayment = null;
    let currentFilter = 'all';
    let shopName = { main: '与己造物', subtitle: '· 手作时光' };
    
    // 云端同步配置
    let gistConfig = { gistId: '', token: '' };
    let syncStatus = 'local'; // local, syncing, synced, error
    let syncTimer = null;

    const $ = id => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function updateSyncUI() {
        const indicator = $('syncIndicator');
        const text = $('syncText');
        indicator.className = 'sync-indicator';
        if (syncStatus === 'synced') {
            indicator.classList.add('synced');
            text.textContent = '已同步';
        } else if (syncStatus === 'syncing') {
            indicator.classList.add('syncing');
            text.textContent = '同步中';
        } else if (syncStatus === 'error') {
            indicator.classList.add('error');
            text.textContent = '同步失败';
        } else {
            text.textContent = '本地';
        }
    }

    // 加载 Gist 配置
    function loadGistConfig() {
        try {
            const saved = JSON.parse(localStorage.getItem(GIST_CONFIG_KEY));
            if (saved) gistConfig = saved;
        } catch(e) {}
    }

    function saveGistConfig() {
        localStorage.setItem(GIST_CONFIG_KEY, JSON.stringify(gistConfig));
    }

    // 从 Gist 拉取数据
    async function pullFromGist() {
        if (!gistConfig.gistId) return null;
        
        try {
            const headers = {};
            if (gistConfig.token) {
                headers['Authorization'] = `token ${gistConfig.token}`;
            }
            
            const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`, { headers });
            if (!response.ok) throw new Error('获取失败');
            
            const gist = await response.json();
            const files = gist.files || {};
            
            let data = {};
            if (files['seats.json'] && files['seats.json'].content) {
                data.seats = JSON.parse(files['seats.json'].content);
            }
            if (files['records.json'] && files['records.json'].content) {
                data.records = JSON.parse(files['records.json'].content);
            }
            if (files['shop.json'] && files['shop.json'].content) {
                data.shopName = JSON.parse(files['shop.json'].content);
            }
            
            return data;
        } catch (e) {
            console.error('拉取失败:', e);
            return null;
        }
    }

    // 推送到 Gist
    async function pushToGist(data) {
        if (!gistConfig.gistId) return false;
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            const headers = {
                'Content-Type': 'application/json',
            };
            if (gistConfig.token) {
                headers['Authorization'] = `token ${gistConfig.token}`;
            }
            
            const files = {};
            if (data.seats) files['seats.json'] = { content: JSON.stringify(data.seats) };
            if (data.records) files['records.json'] = { content: JSON.stringify(data.records) };
            if (data.shopName) files['shop.json'] = { content: JSON.stringify(data.shopName) };
            
            const response = await fetch(`https://api.github.com/gists/${gistConfig.gistId}`, {
                method: 'PATCH',
                headers,
                body: JSON.stringify({ files })
            });
            
            if (!response.ok) throw new Error('推送失败');
            
            syncStatus = 'synced';
            updateSyncUI();
            return true;
        } catch (e) {
            console.error('推送失败:', e);
            syncStatus = 'error';
            updateSyncUI();
            return false;
        }
    }

    // 同步数据（双向）
    async function syncData(showToastMsg = true) {
        if (!gistConfig.gistId) {
            if (showToastMsg) showToast('⚠️ 请先设置云端同步', 2000);
            return;
        }
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            // 先从云端拉取
            const cloudData = await pullFromGist();
            
            if (cloudData) {
                let hasCloudUpdate = false;
                
                // 比较时间戳决定使用哪个数据（简单处理：如果云端有数据就合并）
                if (cloudData.seats) {
                    // 合并策略：保留本地的运行状态，但更新其他数据
                    const localSeats = [...seats];
                    const cloudSeats = cloudData.seats;
                    
                    cloudSeats.forEach((cloudSeat, idx) => {
                        const localSeat = localSeats.find(s => s.id === cloudSeat.id);
                        if (localSeat) {
                            // 如果本地正在运行，保留运行状态
                            if (localSeat.running) {
                                cloudSeat.running = localSeat.running;
                                cloudSeat.startTimestamp = localSeat.startTimestamp;
                                cloudSeat.accumulatedSeconds = localSeat.accumulatedSeconds;
                            }
                        }
                    });
                    
                    seats = cloudSeats;
                    hasCloudUpdate = true;
                }
                
                if (cloudData.records) {
                    // 合并记录，去重
                    const mergedRecords = [...usageRecords];
                    cloudData.records.forEach(r => {
                        if (!mergedRecords.some(m => m.id === r.id)) {
                            mergedRecords.push(r);
                        }
                    });
                    usageRecords = mergedRecords;
                    hasCloudUpdate = true;
                }
                
                if (cloudData.shopName) {
                    shopName = cloudData.shopName;
                    updateShopNameDisplay();
                    hasCloudUpdate = true;
                }
                
                if (hasCloudUpdate) {
                    saveSeats();
                    saveRecords();
                    saveShopName();
                    renderAdminGrid();
                }
            }
            
            // 推送到云端
            await pushToGist({
                seats: seats.map(s => ({...s})), // 深拷贝
                records: usageRecords,
                shopName
            });
            
            if (showToastMsg) showToast('✅ 同步成功', 1500);
        } catch (e) {
            syncStatus = 'error';
            updateSyncUI();
            if (showToastMsg) showToast('❌ 同步失败', 2000);
        }
    }

    function loadShopName() {
        try { 
            const saved = JSON.parse(localStorage.getItem(SHOP_NAME_KEY));
            if (saved && saved.main) { 
                shopName = saved; 
            }
        } catch(e) {}
        updateShopNameDisplay();
    }
    
    function saveShopName() { 
        localStorage.setItem(SHOP_NAME_KEY, JSON.stringify(shopName)); 
    }
    
    function updateShopNameDisplay() {
        $('mainShopName').textContent = shopName.main;
        $('shopSubtitle').textContent = shopName.subtitle || '';
        document.title = shopName.main + ' · 手工店计时';
    }

    function loadRecords() {
        try { usageRecords = JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } 
        catch(e) { usageRecords = []; }
    }
    
    function saveRecords() { localStorage.setItem(RECORDS_KEY, JSON.stringify(usageRecords)); }
    
    function addRecord(seatName, action, duration, notes, paymentMethod) {
        const record = {
            id: Date.now() + Math.random(),
            seatName, action, duration, notes: notes || '',
            timestamp: new Date().toISOString()
        };
        if (paymentMethod) {
            record.paymentMethod = paymentMethod;
            record.notes = record.notes + (record.notes ? ' | ' : '') + '收款: ' + paymentMethod;
        }
        usageRecords.push(record);
        saveRecords();
        
        // 自动同步
        if (gistConfig.gistId) {
            syncData(false);
        }
    }

    function createDefaultSeat(id) {
        return {
            id, name: id + '号桌', status: 'idle', timerMode: 'countup',
            countdownInitial: 3600, accumulatedSeconds: 0, running: false,
            startTimestamp: null, notes: '', customNoteValue: '', reserved: false, reservation: null
        };
    }

    function loadSeats() {
        try { 
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(parsed) && parsed.length) { 
                seats = parsed; 
                seats.forEach(s => { 
                    if (s.notes === undefined) s.notes = '';
                    if (s.customNoteValue === undefined) s.customNoteValue = '';
                });
                return; 
            }
        } catch(e) {}
        seats = Array.from({length: DEFAULT_SEAT_COUNT}, (_, i) => createDefaultSeat(i+1));
        saveSeats();
    }
    
    function saveSeats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(seats)); }
    function getSeatIndex(id) { return seats.findIndex(s => s.id === id); }

    function getCurrentSeconds(seat) {
        let base = seat.accumulatedSeconds || 0;
        if (seat.running && seat.startTimestamp) base += (Date.now() - seat.startTimestamp) / 1000;
        return base;
    }

    function formatTime(s) {
        s = Math.max(0, s);
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function getTimerText(seat) {
        if (seat.timerMode === 'countdown') return formatTime(Math.max(0, seat.countdownInitial - getCurrentSeconds(seat)));
        return formatTime(getCurrentSeconds(seat));
    }

    function stopRunning(seat) {
        if (seat.running && seat.startTimestamp) {
            seat.accumulatedSeconds += (Date.now() - seat.startTimestamp) / 1000;
            seat.running = false;
            seat.startTimestamp = null;
        }
    }

    function actionOpenTable(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.status = 'active'; seat.reserved = false; seat.reservation = null;
        seat.accumulatedSeconds = 0; seat.running = false;
        refreshUI(); 
        showToast(`✅ ${seat.name} 已开台`);
        if (gistConfig.gistId) syncData(false);
    }

    function actionStart(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (seat.reserved) { showToast('⚠️ 该座位已预约，请先开台'); return; }
        if (seat.status === 'idle') { showToast('⚠️ 请先「开台」再开始计时'); return; }
        if (seat.running) return;
        seat.running = true; seat.startTimestamp = Date.now(); seat.status = 'active';
        refreshUI();
    }

    function actionPause(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        stopRunning(seats[idx]); seats[idx].status = 'paused';
        refreshUI(); 
        showToast(`⏸️ ${seats[idx].name} 已暂停`);
        if (gistConfig.gistId) syncData(false);
    }

    function actionEndWithPayment(seatId, paymentMethod) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        const finalNote = getEffectiveNote(seat);
        const duration = formatTime(seat.accumulatedSeconds);
        addRecord(seat.name, '结束使用', duration, finalNote, paymentMethod);
        seat.status = 'idle'; seat.reserved = false; seat.reservation = null; 
        seat.accumulatedSeconds = 0; seat.notes = ''; seat.customNoteValue = '';
        refreshUI();
        const paymentMsg = paymentMethod ? ` (${paymentMethod})` : '';
        showToast(`✅ ${seat.name} 已结束${paymentMsg}`);
        if (gistConfig.gistId) syncData(false);
    }

    function actionReset(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat); 
        seat.accumulatedSeconds = 0;
        seat.notes = ''; seat.customNoteValue = '';
        refreshUI(); 
        showToast(`🔄 ${seat.name} 已重置`);
        if (gistConfig.gistId) syncData(false);
    }

    function actionToggleMode(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.timerMode = seat.timerMode === 'countup' ? 'countdown' : 'countup';
        seat.accumulatedSeconds = 0;
        renderAdminGrid();
        showToast(`🔁 切换为${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}`);
    }

    function getEffectiveNote(seat) {
        if (seat.notes === '__custom__') return seat.customNoteValue || '';
        return seat.notes || '';
    }

    function handleNoteSelect(seatId, value) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (value === '__custom__') {
            seat.notes = '__custom__';
        } else {
            seat.notes = value;
            seat.customNoteValue = '';
        }
        saveSeats();
        renderAdminGrid();
        const displayNote = getEffectiveNote(seat);
        showToast(displayNote ? `🏷️ ${displayNote}` : '🧹 已清空');
        if (gistConfig.gistId) syncData(false);
    }

    function handleCustomNoteSave(seatId, customValue) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        const trimmed = customValue.trim();
        seat.customNoteValue = trimmed;
        if (seat.notes === '__custom__' || !seat.notes) seat.notes = '__custom__';
        saveSeats();
        renderAdminGrid();
        showToast(trimmed ? `✅ ${trimmed}` : '🧹 已清空');
        if (gistConfig.gistId) syncData(false);
    }

    function showPaymentModal(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        pendingEndSeatId = seatId;
        selectedPayment = null;
        $('paymentSeatInfo').textContent = `${seat.name} · ${formatTime(getCurrentSeconds(seat))}`;
        document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
        $('confirmPaymentBtn').disabled = true;
        $('paymentModal').classList.remove('hidden');
    }

    function renderAdminGrid() {
        let html = '';
        seats.forEach(seat => {
            const statusClass = seat.reserved ? 'status-reserved' : 
                (seat.status === 'active' ? (seat.running ? 'status-active' : 'status-paused') : 
                (seat.status === 'paused' ? 'status-paused' : 'status-idle'));
            const statusText = seat.reserved ? '预约' : 
                (seat.status === 'idle' ? '空闲' : (seat.running ? '计时中' : '暂停'));
            
            const currentNoteValue = seat.notes || '';
            const effectiveNote = getEffectiveNote(seat);
            const customInputValue = seat.notes === '__custom__' ? (seat.customNoteValue || '') : '';
            const showCustomInput = seat.notes === '__custom__';
            
            const optionsHtml = NOTE_OPTIONS.map(opt => {
                const selected = currentNoteValue === opt ? 'selected' : '';
                return `<option value="${opt}" ${selected}>${NOTE_LABELS[opt]}</option>`;
            }).join('');
            
            html += `
                <div class="seat-card" data-seat-id="${seat.id}">
                    <div class="seat-header">
                        <span class="seat-name">${seat.name}</span>
                        <span class="seat-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="mode-badge">${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}</div>
                    <div class="timer-display" id="timer-${seat.id}">${getTimerText(seat)}</div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="start" data-id="${seat.id}">开始</button>
                        <button class="btn btn-sm" data-action="pause" data-id="${seat.id}">暂停</button>
                        <button class="btn btn-sm" data-action="end" data-id="${seat.id}">结束</button>
                        <button class="btn btn-sm" data-action="reset" data-id="${seat.id}">重置</button>
                    </div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="openTable" data-id="${seat.id}">开台</button>
                        <button class="btn btn-sm" data-action="reserve" data-id="${seat.id}">预约</button>
                        <button class="btn btn-sm" data-action="toggleMode" data-id="${seat.id}">切换</button>
                        <button class="btn btn-sm btn-primary" data-action="customCountdown" data-id="${seat.id}">倒计时</button>
                    </div>
                    
                    <div class="notes-selector-wrapper">
                        <div class="custom-select-wrapper">
                            <select class="notes-select" data-action="noteSelect" data-id="${seat.id}">
                                ${optionsHtml}
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                        ${showCustomInput ? `
                        <div class="custom-note-input-wrapper">
                            <input type="text" class="custom-note-input" placeholder="自定义备注" data-id="${seat.id}" value="${customInputValue.replace(/"/g, '&quot;')}">
                            <button class="save-custom-btn" data-action="saveCustomNote" data-id="${seat.id}">保存</button>
                        </div>
                        ` : ''}
                        ${effectiveNote ? `<div class="current-note-display">📋 ${effectiveNote}</div>` : ''}
                    </div>
                    
                    ${seat.reserved && seat.reservation ? 
                        `<div class="reservation-info">
                            <span>预约: ${seat.reservation.name}</span>
                            <button style="background:none;border:none;cursor:pointer;padding:2px 4px;" data-action="cancelReserve" data-id="${seat.id}">取消</button>
                        </div>` : ''
                    }
                </div>
            `;
        });
        $('seatsContainer').innerHTML = html;
        updateStats(); applyFilter();
        $('seatCountDisplay').textContent = seats.length;
    }

    function updateStats() {
        $('statAll').textContent = seats.length;
        $('statActive').textContent = seats.filter(s => s.status === 'active' && !s.reserved).length;
        $('statReserved').textContent = seats.filter(s => s.reserved).length;
        $('statIdle').textContent = seats.filter(s => s.status === 'idle' && !s.reserved).length;
    }

    function applyFilter() {
        document.querySelectorAll('.seat-card').forEach(card => {
            const seat = seats.find(s => s.id === parseInt(card.dataset.seatId));
            if (!seat) return;
            let show = true;
            if (currentFilter === 'active') show = seat.status === 'active' && !seat.reserved;
            else if (currentFilter === 'reserved') show = seat.reserved;
            else if (currentFilter === 'idle') show = seat.status === 'idle' && !seat.reserved;
            card.classList.toggle('hidden', !show);
        });
    }

    function refreshUI() {
        saveSeats();
        renderAdminGrid();
    }

    function showRecords(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        $('recordDateInput').value = date;
        const list = $('recordsList');
        const dayRecords = usageRecords.filter(r => r.timestamp.startsWith(date)).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        if (!dayRecords.length) { 
            list.innerHTML = '<div style="text-align:center; color:#999; padding:20px;">暂无记录</div>'; 
            return; 
        }
        list.innerHTML = dayRecords.map(r => `<div class="record-item"><strong>${r.seatName}</strong> · ${r.duration}<br><span style="color:#999;font-size:0.7rem;">${new Date(r.timestamp).toLocaleTimeString('zh-CN',{hour12:false})}${r.notes?' · '+r.notes:''}</span></div>`).join('');
    }

    function exportToExcel(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        const data = [['座位','操作','时长','备注','时间']];
        usageRecords.filter(r => r.timestamp.startsWith(date)).forEach(r => data.push([r.seatName, r.action, r.duration, r.notes||'', new Date(r.timestamp).toLocaleString('zh-CN',{hour12:false})]));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), '使用记录');
        XLSX.writeFile(wb, `${shopName.main}_${date}.xlsx`);
        showToast('✅ 导出成功');
    }

    function setupEvents() {
        $('setupGistBtn').addEventListener('click', () => {
            $('gistIdInput').value = gistConfig.gistId || '';
            $('githubTokenInput').value = gistConfig.token || '';
            $('gistSettingsModal').classList.remove('hidden');
        });
        
        $('closeGistSettingsBtn').addEventListener('click', () => {
            $('gistSettingsModal').classList.add('hidden');
        });
        
        $('saveGistSettingsBtn').addEventListener('click', () => {
            const gistId = $('gistIdInput').value.trim();
            const token = $('githubTokenInput').value.trim();
            
            if (!gistId) {
                showToast('⚠️ 请输入 Gist ID');
                return;
            }
            
            gistConfig = { gistId, token };
            saveGistConfig();
            $('gistSettingsModal').classList.add('hidden');
            showToast('✅ 配置已保存');
            
            // 首次同步
            syncData(true);
        });
        
        $('testSyncBtn').addEventListener('click', async () => {
            const gistId = $('gistIdInput').value.trim();
            const token = $('githubTokenInput').value.trim();
            
            if (!gistId) {
                showToast('⚠️ 请输入 Gist ID');
                return;
            }
            
            const tempConfig = { gistId, token };
            const oldConfig = gistConfig;
            gistConfig = tempConfig;
            
            const data = await pullFromGist();
            gistConfig = oldConfig;
            
            if (data) {
                showToast('✅ 连接成功！');
            } else {
                showToast('❌ 连接失败，请检查 Gist ID');
            }
        });
        
        $('syncNowBtn').addEventListener('click', () => syncData(true));
        
        $('seatsContainer').addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action, seatId = parseInt(btn.dataset.id);
            
            if (action === 'start') actionStart(seatId);
            else if (action === 'pause') actionPause(seatId);
            else if (action === 'end') showPaymentModal(seatId);
            else if (action === 'reset') actionReset(seatId);
            else if (action === 'openTable') actionOpenTable(seatId);
            else if (action === 'reserve') { 
                pendingReserveSeatId = seatId; 
                $('reserveNameInput').value = ''; 
                $('reserveContactInput').value = ''; 
                $('reservationModal').classList.remove('hidden'); 
            }
            else if (action === 'cancelReserve') { 
                const idx = getSeatIndex(seatId); 
                if (idx!==-1) { 
                    seats[idx].reserved = false; 
                    seats[idx].reservation = null; 
                    refreshUI(); 
                    showToast('预约已取消'); 
                    if (gistConfig.gistId) syncData(false);
                } 
            }
            else if (action === 'toggleMode') actionToggleMode(seatId);
            else if (action === 'customCountdown') { 
                pendingCustomSeatId = seatId; 
                $('customMinutesInput').value = '60'; 
                $('customTimeModal').classList.remove('hidden'); 
            }
            else if (action === 'saveCustomNote') {
                const input = document.querySelector(`.custom-note-input[data-id="${seatId}"]`);
                if (input) handleCustomNoteSave(seatId, input.value);
            }
        });

        $('seatsContainer').addEventListener('change', e => {
            if (e.target.classList.contains('notes-select')) {
                handleNoteSelect(parseInt(e.target.dataset.id), e.target.value);
            }
        });

        $('seatsContainer').addEventListener('keypress', e => {
            if (e.key === 'Enter' && e.target.classList.contains('custom-note-input')) {
                handleCustomNoteSave(parseInt(e.target.dataset.id), e.target.value);
            }
        });

        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedPayment = opt.dataset.payment;
                $('confirmPaymentBtn').disabled = false;
            });
        });

        $('confirmPaymentBtn').addEventListener('click', () => {
            if (pendingEndSeatId && selectedPayment) {
                actionEndWithPayment(pendingEndSeatId, selectedPayment);
                $('paymentModal').classList.add('hidden');
            }
        });

        $('skipPaymentBtn').addEventListener('click', () => {
            if (pendingEndSeatId) {
                actionEndWithPayment(pendingEndSeatId, null);
                $('paymentModal').classList.add('hidden');
            }
        });

        document.querySelectorAll('.stat-card').forEach(c => c.addEventListener('click', () => {
            currentFilter = c.dataset.filter;
            document.querySelectorAll('.stat-card').forEach(x => x.classList.remove('active'));
            c.classList.add('active'); applyFilter();
        }));

        $('addSeatBtn').addEventListener('click', () => { 
            const newId = seats.length > 0 ? Math.max(...seats.map(s=>s.id)) + 1 : 1;
            seats.push(createDefaultSeat(newId)); 
            saveSeats(); 
            renderAdminGrid(); 
            showToast(`✅ 已添加`); 
            if (gistConfig.gistId) syncData(false);
        });
        
        $('removeSeatBtn').addEventListener('click', () => { 
            if(seats.length>1) { 
                seats.pop(); 
                saveSeats(); 
                renderAdminGrid(); 
                showToast('✅ 已移除'); 
                if (gistConfig.gistId) syncData(false);
            } else showToast('⚠️ 至少保留一个'); 
        });
        
        $('resetAllIdleBtn').addEventListener('click', () => { 
            seats.forEach(s => { 
                stopRunning(s); 
                s.status='idle'; 
                s.reserved=false; 
                s.reservation=null; 
                s.accumulatedSeconds=0;
                s.notes = ''; s.customNoteValue = '';
            }); 
            saveSeats(); 
            renderAdminGrid(); 
            showToast('✅ 全部空闲'); 
            if (gistConfig.gistId) syncData(false);
        });
        
        $('viewRecordsBtn').addEventListener('click', () => { 
            showRecords(new Date().toISOString().split('T')[0]); 
            $('recordsModal').classList.remove('hidden'); 
        });
        
        $('closeRecordsBtn').addEventListener('click', () => $('recordsModal').classList.add('hidden'));
        $('loadRecordsBtn').addEventListener('click', () => { 
            if($('recordDateInput').value) showRecords($('recordDateInput').value); 
        });
        $('exportRecordsBtn').addEventListener('click', () => exportToExcel(new Date().toISOString().split('T')[0]));
        $('exportDayRecordsBtn').addEventListener('click', () => { 
            exportToExcel($('recordDateInput').value); 
            $('recordsModal').classList.add('hidden'); 
        });
        
        $('cancelCustomBtn').addEventListener('click', () => $('customTimeModal').classList.add('hidden'));
        $('confirmCustomBtn').addEventListener('click', () => {
            const m = parseFloat($('customMinutesInput').value);
            if (m>0 && pendingCustomSeatId) { 
                const idx = getSeatIndex(pendingCustomSeatId); 
                if(idx!==-1){ 
                    stopRunning(seats[idx]); 
                    seats[idx].countdownInitial = Math.floor(m*60); 
                    seats[idx].timerMode='countdown'; 
                    seats[idx].accumulatedSeconds=0; 
                    refreshUI(); 
                    showToast(`✅ ${m}分钟`); 
                } 
            }
            $('customTimeModal').classList.add('hidden');
        });
        
        $('cancelReserveBtn').addEventListener('click', () => $('reservationModal').classList.add('hidden'));
        $('confirmReserveBtn').addEventListener('click', () => {
            const name = $('reserveNameInput').value.trim();
            if (!name) { showToast('⚠️ 请填写姓名'); return; }
            if (pendingReserveSeatId) { 
                const idx = getSeatIndex(pendingReserveSeatId); 
                if(idx!==-1){ 
                    stopRunning(seats[idx]); 
                    seats[idx].reserved=true; 
                    seats[idx].status='idle'; 
                    seats[idx].reservation={name, contact: $('reserveContactInput').value.trim()}; 
                    addRecord(seats[idx].name,'预约','-',name); 
                    refreshUI(); 
                    showToast(`✅ 已预约`); 
                } 
            }
            $('reservationModal').classList.add('hidden');
        });
        
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { 
            if(e.target===m) m.classList.add('hidden'); 
        }));
    }

    // 初始化
    loadGistConfig();
    loadShopName();
    loadSeats(); 
    loadRecords(); 
    renderAdminGrid(); 
    setupEvents();
    updateSyncUI();
    
    // 如果配置了云端，自动同步一次
    if (gistConfig.gistId) {
        setTimeout(() => syncData(false), 1000);
    }
    
    // 定时同步（每30秒）
    syncTimer = setInterval(() => {
        if (gistConfig.gistId) {
            syncData(false);
        }
    }, 30000);
    
    globalTimer = setInterval(() => {
        seats.forEach(s => { 
            const el = $(`timer-${s.id}`); 
            if(el) el.textContent = getTimerText(s); 
            if(s.timerMode==='countdown' && s.running && s.countdownInitial-getCurrentSeconds(s)<=0){ 
                s.running=false; 
                s.accumulatedSeconds=s.countdownInitial; 
                s.status='paused'; 
                refreshUI(); 
            } 
        });
        updateStats();
    }, 200);
})();
</script>
</body>
</html>
