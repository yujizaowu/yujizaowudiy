<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif; background: #f7f5f2; color: #2e241f; padding: 12px; min-height: 100vh; }
        .app { max-width: 1800px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .shop-name { font-size: 1.4rem; font-weight: 400; letter-spacing: 3px; color: #3b2b24; border-left: 4px solid #b28b6f; padding-left: 14px; }
        .shop-name small { font-size: 0.85rem; color: #7f6a5c; margin-left: 6px; }
        .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .btn { background: #e3d9d1; border: 1px solid #b8a69a; color: #2e241f; padding: 7px 12px; border-radius: 24px; font-size: 0.8rem; cursor: pointer; font-weight: 500; user-select: none; transition: all 0.15s; white-space: nowrap; }
        .btn:hover { background: #cdbcaf; }
        .btn-primary { background: #5e4b3c; border-color: #3f3228; color: #fdf6ef; }
        .btn-success { background: #4a7c59; border-color: #3a6347; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; background: #ddd; border-color: #ccc; color: #999; pointer-events: none; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 1px solid #d6c9bf; background: #fefcf9; border-radius: 24px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .tab-btn.active { background: #5e4b3c; color: #fdf6ef; border-color: #3f3228; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .stat-card { background: #fefcf9; border-radius: 20px; padding: 8px 18px; border: 1px solid #e2d6cd; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }
        .stat-card.active { background: #5e4b3c; color: #fdf6ef; }
        .stat-number { font-size: 1.4rem; font-weight: 600; min-width: 35px; }
        .batch-bar { display: flex; gap: 6px; align-items: center; margin-left: 10px; flex-wrap: wrap; }
        .batch-bar .btn { font-size: 0.7rem; padding: 4px 10px; }
        .seats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .seat-card { background: #fefcf9; border-radius: 14px; padding: 12px; border: 1px solid #e2d6cd; position: relative; cursor: pointer; user-select: none; }
        .seat-card.selected { border-color: #5e4b3c; background: #f5f0ea; box-shadow: 0 0 8px rgba(94,75,60,0.2); }
        .seat-card.hidden { display: none; }
        .seat-header { display: flex; justify-content: space-between; margin-bottom: 6px; padding-right: 20px; }
        .seat-name { font-weight: 700; font-size: 1rem; }
        .seat-status { font-size: 0.6rem; padding: 2px 6px; border-radius: 20px; background: #ede6df; }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-idle { background: #e5dfd9; }
        .start-time-label { font-size: 0.6rem; color: #6b5d4e; text-align: center; margin-bottom: 3px; padding: 3px 0; background: #fdf5e6; border-radius: 10px; font-weight: 500; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 1.4rem; text-align: center; margin: 6px 0; background: #f3ede7; padding: 5px 0; border-radius: 10px; pointer-events: none; }
        .mode-badge { font-size: 0.6rem; background: #cfc1b6; display: inline-block; padding: 2px 8px; border-radius: 20px; margin: 0 auto 5px; text-align: center; pointer-events: none; }
        .seat-actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
        .seat-actions .btn { flex: 1 0 35px; padding: 4px 2px; font-size: 0.6rem; }
        .delete-seat-btn { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; z-index: 5; padding: 2px 6px; border-radius: 50%; }
        .delete-seat-btn:hover { color: #e74c3c; background: #fdf5e6; }
        .notes-selector-wrapper { margin-top: 6px; border-top: 1px dashed #d6c9bf; padding-top: 6px; }
        .remark-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .remark-row select { flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid #d6c9bf; border-radius: 16px; font-size: 0.65rem; background: #fffbf8; pointer-events: auto; }
        .remark-row input { flex: 2; min-width: 100px; padding: 5px 8px; border: 1px solid #d6c9bf; border-radius: 16px; font-size: 0.65rem; background: #fffbf8; pointer-events: auto; }
        .current-note-display { margin-top: 4px; font-size: 0.55rem; color: #5e4b3c; padding: 2px 5px; background: #f4ede6; border-radius: 10px; }
        .toast-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3b2b24; color: #f0e4da; padding: 8px 20px; border-radius: 40px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 9999; }
        .toast-message.show { opacity: 1; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(2px); }
        .modal-overlay.hidden { display: none !important; }
        .modal { background: #fefcf9; border-radius: 24px; padding: 20px; max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 16px; color: #3b2b24; font-size: 1.1rem; }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { display: block; margin-bottom: 5px; color: #5f4e43; font-size: 0.8rem; }
        .modal-input-group input, .modal-input-group select { width: 100%; padding: 10px 12px; border: 1px solid #d6c9bf; border-radius: 20px; font-size: 0.9rem; background: #fffbf8; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .records-list { margin: 14px 0; max-height: 280px; overflow-y: auto; }
        .record-item { padding: 7px 10px; border-bottom: 1px solid #e2d6cd; font-size: 0.75rem; }
        .payment-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0; }
        .payment-option { padding: 12px 8px; border: 2px solid #d6c9bf; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fffbf8; }
        .payment-option.selected { border-color: #5e4b3c; background: #5e4b3c; color: #fdf6ef; }
        .payment-option .payment-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .payment-option .payment-name { font-size: 0.7rem; font-weight: 500; }
        .payment-hint { text-align: center; color: #999; font-size: 0.75rem; margin-top: 8px; }
        .reservation-form { background: #fefcf9; border-radius: 14px; padding: 20px; border: 1px solid #e2d6cd; }
        .reservation-list { margin-top: 20px; }
        .reservation-item { background: #fefcf9; border-radius: 10px; padding: 10px; border: 1px solid #e2d6cd; margin-bottom: 8px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .reservation-item .info { flex: 1; }
        .reservation-item .badge { font-size: 0.6rem; padding: 2px 8px; border-radius: 12px; background: #e2d6cd; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .time-input-group { display: flex; gap: 8px; align-items: center; }
        .time-input-group input { width: 60px; text-align: center; }
        .transfer-btn { background: #8b6f5c !important; border-color: #6b5343 !important; color: #fff !important; }
        .select-all-btn { font-size: 0.7rem; padding: 4px 8px; }
        @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    <div class="header">
        <div class="shop-name"><span>与己造物</span><small>· 手作时光</small></div>
        <div class="admin-actions">
            <button class="btn btn-sm" id="addSeatBtn">+ 添加座位</button>
            <button class="btn btn-sm btn-primary" id="resetAllIdleBtn">全部空闲</button>
            <button class="btn btn-sm btn-success" id="viewRecordsBtn">记录</button>
            <button class="btn btn-sm btn-success" id="exportRecordsBtn">导出</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="timer">⏱️ 计时管理</button>
        <button class="tab-btn" data-tab="reservation">📋 预约管理</button>
    </div>
    <div class="tab-content active" id="tabTimer">
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all"><span class="stat-number" id="statAll">0</span><span>全部</span></div>
            <div class="stat-card" data-filter="active"><span class="stat-number" id="statActive">0</span><span>使用中</span></div>
            <div class="stat-card" data-filter="idle"><span class="stat-number" id="statIdle">0</span><span>空闲</span></div>
            <div class="batch-bar">
                <button class="btn btn-sm select-all-btn" id="selectAllBtn">全选</button>
                <button class="btn btn-sm select-all-btn" id="deselectAllBtn">取消</button>
                <button class="btn btn-sm btn-success" id="batchOpenBtn">批量开台</button>
                <button class="btn btn-sm btn-primary" id="batchStartBtn">批量开始</button>
                <button class="btn btn-sm" id="batchEndBtn">批量结束</button>
                <button class="btn btn-sm" id="batchNoteBtn">批量备注</button>
            </div>
        </div>
        <div id="seatsContainer" class="seats-grid"></div>
    </div>
    <div class="tab-content" id="tabReservation">
        <div class="two-col">
            <div class="reservation-form"><h3>新增预约</h3>
                <div class="modal-input-group"><label>👤 姓名 <span style="color:#999;">(选填)</span></label><input type="text" id="resNameInput" placeholder="请输入顾客姓名（可不填）"></div>
                <div class="modal-input-group"><label>📞 电话 *</label><input type="text" id="resPhoneInput" placeholder="请输入联系电话"></div>
                <div class="modal-input-group"><label>📅 预约时间 *</label><input type="datetime-local" id="resDateTimeInput"></div>
                <div class="modal-input-group"><label>📍 座位</label><select id="resSeatSelect"><option value="">不指定座位</option></select></div>
                <div class="modal-input-group"><label>📌 备注</label><div class="remark-row"><select id="resNoteSelect"><option value="抖音">抖音</option><option value="快手">快手</option><option value="美团">美团</option><option value="小红书">小红书</option><option value="线下">线下</option></select><input type="text" id="resCustomNoteInput" placeholder="或直接输入自定义备注"></div></div>
                <div class="modal-actions"><button class="btn btn-primary" id="addReservationBtn">添加预约</button><button class="btn" id="clearResFormBtn">清空</button></div>
            </div>
            <div class="reservation-list"><h3 style="margin-bottom:14px;">预约列表 <button class="btn btn-sm btn-success" id="exportReservationsBtn" style="float:right;">导出</button></h3><div id="reservationList"></div></div>
        </div>
    </div>
    <div id="transferModal" class="modal-overlay hidden"><div class="modal"><h3>🔄 转桌</h3><div id="transferInfo" style="margin-bottom:12px;color:#5f4e43;font-size:0.8rem;"></div><div class="modal-input-group"><label>目标座位</label><select id="transferTargetSelect"></select></div><div class="modal-actions"><button class="btn" id="cancelTransferBtn">取消</button><button class="btn btn-primary" id="confirmTransferBtn">确认</button></div></div></div>
    <div id="batchNoteModal" class="modal-overlay hidden"><div class="modal"><h3>📋 批量备注</h3><div id="batchNoteInfo" style="margin-bottom:12px;color:#5f4e43;font-size:0.8rem;"></div><div class="modal-input-group"><label>备注</label><div class="remark-row"><select id="batchNoteSelect"><option value="抖音">抖音</option><option value="快手">快手</option><option value="美团">美团</option><option value="小红书">小红书</option></select><input type="text" id="batchNoteInput" placeholder="或直接输入自定义备注"></div></div><div class="modal-actions"><button class="btn" id="cancelBatchNoteBtn">取消</button><button class="btn btn-primary" id="confirmBatchNoteBtn">确认</button></div></div></div>
    <div id="customTimeModal" class="modal-overlay hidden"><div class="modal"><h3>⏱️ 设置倒计时</h3><div class="modal-input-group"><div class="time-input-group"><input type="number" id="customHoursInput" min="0" value="1"><span>时</span><input type="number" id="customMinutesInput" min="0" max="59" value="0"><span>分</span><input type="number" id="customSecondsInput" min="0" max="59" value="0"><span>秒</span></div><div style="margin-top:8px;font-size:0.7rem;color:#999;">总秒数：<span id="totalSecondsDisplay">3600</span> 秒</div></div><div class="modal-actions"><button class="btn" id="cancelCustomBtn">取消</button><button class="btn btn-primary" id="confirmCustomBtn">确定</button></div></div></div>
    <div id="paymentModal" class="modal-overlay hidden"><div class="modal"><h3>💰 选择收款方式</h3><div id="paymentSeatInfo" style="margin-bottom:12px;color:#5f4e43;"></div><div class="payment-methods" id="paymentOptionsContainer"></div><div class="payment-hint">👆 请选择一种收款方式</div><div class="modal-actions"><button class="btn" id="cancelPaymentBtn">取消</button><button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button></div></div></div>
    <div id="recordsModal" class="modal-overlay hidden"><div class="modal"><h3>每日使用记录</h3><div style="display:flex;gap:8px;margin:16px 0;"><input type="date" id="recordDateInput" style="flex:1;padding:8px;border-radius:20px;border:1px solid #d6c9bf;"><button class="btn btn-sm btn-primary" id="loadRecordsBtn">查看</button></div><div class="records-list" id="recordsList"></div><div class="modal-actions"><button class="btn btn-sm btn-success" id="exportDayRecordsBtn">导出Excel</button><button class="btn btn-sm" id="closeRecordsBtn">关闭</button></div></div></div>
</div>
<script>
(function(){
    const STORAGE_KEY='yzw_v28',RECORDS_KEY='yzw_rec28',RESERVATIONS_KEY='yzw_res28';
    const PAYMENT_METHODS=[{name:'抖音团购',icon:'🎵'},{name:'快手团购',icon:'📱'},{name:'美团团购',icon:'🍔'},{name:'支付宝',icon:'💙'},{name:'微信',icon:'💚'}];
    const PRESET_NOTES=['','抖音','美团','快手','小红书'];
    let seats=[],usageRecords=[],reservations=[],displayTimer=null,saveTimer=null,selectedSeats=new Set();
    let pendingCustomSeatId=null,pendingEndSeatId=null,pendingTransferSeatId=null,selectedPayment=null,currentFilter='all';
    const $=id=>document.getElementById(id);
    const toastEl=$('toast');
    function showToast(m,d=1500){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),d);}
    function createSeat(id,name){return{id,name:name||(id+'号桌'),status:'idle',timerMode:'countup',countdownInitial:3600,accumulatedSeconds:0,running:false,startTimestamp:null,startTimeStr:'',notes:'',customNote:''};}
    function getElapsed(s){let b=s.accumulatedSeconds||0;if(s.running&&s.startTimestamp)b+=(Date.now()-s.startTimestamp)/1000;return b;}
    function getDisplayTime(s){const e=getElapsed(s);return s.timerMode==='countdown'?Math.max(0,s.countdownInitial-e):e;}
    function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
    function pauseSeat(s){if(s.running&&s.startTimestamp){s.accumulatedSeconds+=(Date.now()-s.startTimestamp)/1000;s.running=false;s.startTimestamp=null;}}
    function formatStartTime(d){return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 开始计时`;}
    function isLocked(s){return s.running||s.status==='paused';}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(seats));}
    function refreshAll(){seats.forEach(s=>{const el=document.getElementById('timer-'+s.id);if(el)el.textContent=fmtTime(getDisplayTime(s));if(s.timerMode==='countdown'&&s.running&&getDisplayTime(s)<=0){pauseSeat(s);s.status='paused';renderGrid();}});}
    function openTable(id){const s=seats.find(x=>x.id===id);if(!s)return;if(isLocked(s)){showToast('⚠️ 计时中无法操作');return;}pauseSeat(s);s.status='active';s.accumulatedSeconds=0;s.running=false;s.startTimeStr='';save();renderGrid();}
    function startTimer(id){const s=seats.find(x=>x.id===id);if(!s)return;if(s.status==='idle'){showToast('⚠️ 请先开台');return;}if(s.running)return;s.running=true;s.startTimestamp=Date.now();s.startTimeStr=formatStartTime(new Date());s.status='active';save();renderGrid();}
    function pauseTimer(id){const s=seats.find(x=>x.id===id);if(!s)return;pauseSeat(s);s.status='paused';save();renderGrid();}
    function endWithPayment(id,method){const s=seats.find(x=>x.id===id);if(!s)return;pauseSeat(s);usageRecords.push({id:Date.now(),seatName:s.name,duration:fmtTime(s.accumulatedSeconds),notes:s.customNote||s.notes||'',paymentMethod:method,timestamp:new Date().toISOString()});s.status='idle';s.accumulatedSeconds=0;s.startTimeStr='';s.notes='';s.customNote='';save();localStorage.setItem(RECORDS_KEY,JSON.stringify(usageRecords));renderGrid();}
    function toggleMode(id){const s=seats.find(x=>x.id===id);if(!s)return;if(isLocked(s)){showToast('⚠️ 计时中无法操作');return;}pauseSeat(s);s.timerMode=s.timerMode==='countup'?'countdown':'countup';s.accumulatedSeconds=0;s.startTimeStr='';save();renderGrid();}
    function setCountdown(id,totalSec){const s=seats.find(x=>x.id===id);if(!s)return;if(isLocked(s)){showToast('⚠️ 计时中无法操作');return;}pauseSeat(s);s.countdownInitial=totalSec;s.timerMode='countdown';s.accumulatedSeconds=0;s.startTimeStr='';save();renderGrid();}
    function addSeat(){const maxId=seats.reduce((max,s)=>Math.max(max,s.id),0);seats.push(createSeat(maxId+1,(maxId+1)+'号桌'));save();renderGrid();}
    function deleteSeat(id){const s=seats.find(x=>x.id===id);if(!s)return;if(s.status!=='idle'){showToast('⚠️ 请先结束');return;}if(!confirm(`删除 ${s.name}？`))return;seats=seats.filter(x=>x.id!==id);save();renderGrid();}
    function showTransferModal(id){const s=seats.find(x=>x.id===id);if(!s)return;if(!isLocked(s)){showToast('⚠️ 只有计时中或暂停中才能转桌');return;}pendingTransferSeatId=id;$('transferInfo').textContent=`${s.name} · ${fmtTime(getDisplayTime(s))}`;const select=$('transferTargetSelect');select.innerHTML=seats.filter(x=>x.id!==id&&x.status==='idle').map(x=>`<option value="${x.id}">${x.name}</option>`).join('');if(!select.options.length){showToast('⚠️ 没有空闲座位');return;}$('transferModal').classList.remove('hidden');}
    function confirmTransfer(){if(!pendingTransferSeatId)return;const sourceSeat=seats.find(x=>x.id===pendingTransferSeatId);const targetId=parseInt($('transferTargetSelect').value);const targetSeat=seats.find(x=>x.id===targetId);if(!sourceSeat||!targetSeat||targetSeat.status!=='idle'){showToast('⚠️ 操作失败');return;}const savedData={status:sourceSeat.status,timerMode:sourceSeat.timerMode,countdownInitial:sourceSeat.countdownInitial,accumulatedSeconds:sourceSeat.accumulatedSeconds,running:sourceSeat.running,startTimestamp:sourceSeat.startTimestamp,startTimeStr:sourceSeat.startTimeStr,notes:sourceSeat.notes,customNote:sourceSeat.customNote};sourceSeat.status='idle';sourceSeat.accumulatedSeconds=0;sourceSeat.running=false;sourceSeat.startTimestamp=null;sourceSeat.startTimeStr='';sourceSeat.notes='';sourceSeat.customNote='';Object.assign(targetSeat,savedData);targetSeat.id=targetId;save();$('transferModal').classList.add('hidden');pendingTransferSeatId=null;renderGrid();showToast(`✅ 已转至${targetSeat.name}`);}
    function autoSaveNoteSelect(seatId,value){const s=seats.find(x=>x.id===seatId);if(!s)return;s.notes=value;if(value!=='')s.customNote='';save();}
    function autoSaveNoteInput(seatId,value){const s=seats.find(x=>x.id===seatId);if(!s)return;s.customNote=value.trim();if(s.customNote)s.notes='';save();}
    function toggleSelect(id){if(selectedSeats.has(id))selectedSeats.delete(id);else selectedSeats.add(id);updateCardSelection(id);}
    function updateCardSelection(id){const card=document.querySelector(`.seat-card[data-seat-id="${id}"]`);if(card)card.classList.toggle('selected',selectedSeats.has(id));}
    function batchOpen(){if(!selectedSeats.size){showToast('⚠️ 请先选择座位');return;}let count=0;selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s&&s.status==='idle'){s.status='active';s.accumulatedSeconds=0;s.running=false;s.startTimeStr='';count++;}});selectedSeats.clear();save();renderGrid();showToast(`✅ 批量开台 ${count} 个座位`);}
    function batchStart(){if(!selectedSeats.size){showToast('⚠️ 请先选择座位');return;}let count=0;selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s&&s.status!=='idle'&&!s.running){s.running=true;s.startTimestamp=Date.now();s.startTimeStr=formatStartTime(new Date());s.status='active';count++;}});selectedSeats.clear();save();renderGrid();showToast(`✅ 批量开始 ${count} 个座位`);}
    function batchEnd(){if(!selectedSeats.size){showToast('⚠️ 请先选择座位');return;}const ids=[...selectedSeats];$('paymentSeatInfo').textContent=`批量结束 ${ids.length} 个座位`;selectedPayment=null;document.querySelectorAll('.payment-option').forEach(o=>o.classList.remove('selected'));$('confirmPaymentBtn').disabled=true;$('paymentModal').classList.remove('hidden');const origConfirm=$('confirmPaymentBtn').onclick;$('confirmPaymentBtn').onclick=()=>{if(!selectedPayment){showToast('⚠️ 请选择收款方式');return;}ids.forEach(id=>{const seat=seats.find(x=>x.id===id);if(seat&&isLocked(seat)){pauseSeat(seat);usageRecords.push({id:Date.now()+Math.random(),seatName:seat.name,duration:fmtTime(seat.accumulatedSeconds),notes:seat.customNote||seat.notes||'',paymentMethod:selectedPayment,timestamp:new Date().toISOString()});seat.status='idle';seat.accumulatedSeconds=0;seat.startTimeStr='';seat.notes='';seat.customNote='';}});selectedSeats.clear();save();localStorage.setItem(RECORDS_KEY,JSON.stringify(usageRecords));$('paymentModal').classList.add('hidden');$('confirmPaymentBtn').onclick=origConfirm;renderGrid();showToast(`✅ 批量结束 ${ids.length} 个座位`);};}
    function batchNote(){if(!selectedSeats.size){showToast('⚠️ 请先选择座位');return;}$('batchNoteInfo').textContent=`已选择 ${selectedSeats.size} 个座位`;$('batchNoteModal').classList.remove('hidden');}
    function renderPaymentOptions(){const c=$('paymentOptionsContainer');if(!c)return;c.innerHTML=PAYMENT_METHODS.map(m=>`<div class="payment-option" data-payment="${m.name}"><div class="payment-icon">${m.icon}</div><div class="payment-name">${m.name}</div></div>`).join('');c.querySelectorAll('.payment-option').forEach(o=>{o.onclick=function(){c.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');selectedPayment=this.dataset.payment;$('confirmPaymentBtn').disabled=false;};});}
    function renderGrid(){let h='';seats.forEach(s=>{const locked=isLocked(s);const sc=s.status==='active'?(s.running?'status-active':'status-paused'):(s.status==='paused'?'status-paused':'status-idle');const st=s.status==='idle'?'空闲':(s.running?'计时中':'暂停');const dn=s.customNote||s.notes||'';const opts=PRESET_NOTES.map(o=>`<option value="${o}" ${s.notes===o?'selected':''}>${o||'无备注'}</option>`).join('');const showST=(s.running||s.status==='paused')&&s.startTimeStr;const stHtml=showST?`<div class="start-time-label">🕐 ${s.startTimeStr}</div>`:'';const dis=locked?'disabled':'';const sel=selectedSeats.has(s.id)?' selected':'';h+=`<div class="seat-card${sel}" data-seat-id="${s.id}" onclick="toggleSelect(${s.id})"><button class="delete-seat-btn" onclick="event.stopPropagation();deleteSeat(${s.id})">×</button><div class="seat-header"><span class="seat-name">${s.name}</span><span class="seat-status ${sc}">${st}</span></div><div class="mode-badge">${s.timerMode==='countdown'?'倒计时':'正计时'}</div>${stHtml}<div class="timer-display" id="timer-${s.id}">${fmtTime(getDisplayTime(s))}</div><div class="seat-actions"><button class="btn btn-sm" data-act="start" data-id="${s.id}" onclick="event.stopPropagation()">开始</button><button class="btn btn-sm" data-act="pause" data-id="${s.id}" onclick="event.stopPropagation()">暂停</button><button class="btn btn-sm" data-act="end" data-id="${s.id}" onclick="event.stopPropagation()">结束</button></div><div class="seat-actions"><button class="btn btn-sm" data-act="open" data-id="${s.id}" ${dis} onclick="event.stopPropagation()">开台</button><button class="btn btn-sm" data-act="toggle" data-id="${s.id}" ${dis} onclick="event.stopPropagation()">切换</button><button class="btn btn-sm btn-primary" data-act="cdown" data-id="${s.id}" ${dis} onclick="event.stopPropagation()">倒计时</button></div><div class="seat-actions"><button class="btn btn-sm transfer-btn" data-act="transfer" data-id="${s.id}" ${!locked?'disabled':''} onclick="event.stopPropagation()">🔄 转桌</button></div><div class="notes-selector-wrapper" onclick="event.stopPropagation()"><div class="remark-row"><select class="np" data-id="${s.id}" onchange="autoSaveNoteSelect(${s.id},this.value)">${opts}</select><input type="text" class="nc" data-id="${s.id}" placeholder="自定义备注" value="${(s.customNote||'').replace(/"/g,'&quot;')}" onblur="autoSaveNoteInput(${s.id},this.value)"></div>${dn?`<div class="current-note-display">📋 ${dn}</div>`:''}</div></div>`;});$('seatsContainer').innerHTML=h;updateStats();updateSeatSelect();}
    function updateStats(){$('statAll').textContent=seats.length;$('statActive').textContent=seats.filter(s=>s.status==='active'||s.status==='paused').length;$('statIdle').textContent=seats.filter(s=>s.status==='idle').length;}
    function updateSeatSelect(){$('resSeatSelect').innerHTML='<option value="">不指定座位</option>'+seats.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');}
    function applyFilter(){document.querySelectorAll('.seat-card').forEach(card=>{const s=seats.find(x=>x.id===parseInt(card.dataset.seatId));if(!s)return;card.classList.toggle('hidden',currentFilter==='active'?!(s.status==='active'||s.status==='paused'):currentFilter==='idle'?s.status!=='idle':false);});}
    function init(){try{const p=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(p)&&p.length)seats=p;else throw 0;}catch(e){seats=Array.from({length:36},(_,i)=>createSeat(i+1));save();}const now=Date.now();seats.forEach(s=>{if(s.running&&s.startTimestamp){s.accumulatedSeconds+=(now-s.startTimestamp)/1000;s.startTimestamp=now;s.status='active';}});try{usageRecords=JSON.parse(localStorage.getItem(RECORDS_KEY))||[];}catch(e){usageRecords=[];}try{reservations=JSON.parse(localStorage.getItem(RESERVATIONS_KEY))||[];}catch(e){reservations=[];}renderGrid();renderResList();updateSeatSelect();renderPaymentOptions();$('resDateTimeInput').value=new Date().toISOString().slice(0,16);if(displayTimer)clearInterval(displayTimer);displayTimer=setInterval(refreshAll,1000);if(saveTimer)clearInterval(saveTimer);saveTimer=setInterval(save,3000);}
    function renderResList(){const c=$('reservationList');if(!reservations.length){c.innerHTML='<div style="text-align:center;padding:20px;color:#999;">暂无预约</div>';return;}const g={};reservations.sort((a,b)=>new Date(a.dateTime)-new Date(b.dateTime));reservations.forEach(r=>{if(!g[r.date])g[r.date]=[];g[r.date].push(r);});let h='';for(const d in g){h+=`<div style="font-weight:bold;margin:12px 0 6px;color:#5e4b3c;">📅 ${d} (${g[d].length}个)</div>`;g[d].forEach(r=>{h+=`<div class="reservation-item"><div class="info"><div>⏰ ${r.time||''} | 👤 ${r.name} | 📞 ${r.phone}</div><div>📍 ${r.seatName} | <span class="badge">${r.remark}</span></div></div><button class="btn btn-sm" style="color:#e74c3c;border-color:#e74c3c;" onclick="delRes(${r.id})">删除</button></div>`;});}c.innerHTML=h;}
    function addRes(){const name=$('resNameInput').value.trim()||'未填写';const phone=$('resPhoneInput').value.trim();const dt=$('resDateTimeInput').value;const seatId=$('resSeatSelect').value?parseInt($('resSeatSelect').value):null;const remark=$('resCustomNoteInput').value.trim()||$('resNoteSelect').value;if(!phone){showToast('⚠️ 请填写电话');return;}if(!dt){showToast('⚠️ 请选择时间');return;}const date=dt.split('T')[0];if(seatId&&reservations.find(r=>r.seatId===seatId&&r.date===date)){showToast('⚠️ 该座位当天已预约');return;}reservations.push({id:Date.now(),name,phone,dateTime:dt,date,time:dt.split('T')[1]||'',seatId,seatName:seatId?(seats.find(s=>s.id===seatId)?.name||''):'不指定',remark,status:'已预约'});localStorage.setItem(RESERVATIONS_KEY,JSON.stringify(reservations));renderResList();$('resNameInput').value='';$('resPhoneInput').value='';$('resCustomNoteInput').value='';showToast('✅ 预约成功');}
    function delRes(id){if(!confirm('确定删除？'))return;reservations=reservations.filter(r=>r.id!==id);localStorage.setItem(RESERVATIONS_KEY,JSON.stringify(reservations));renderResList();}
    function setup(){$('seatsContainer').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=parseInt(b.dataset.id);if(act==='start')startTimer(id);else if(act==='pause')pauseTimer(id);else if(act==='end'){pendingEndSeatId=id;const s=seats.find(x=>x.id===id);$('paymentSeatInfo').textContent=s?`${s.name} · ${fmtTime(getDisplayTime(s))}`:'';selectedPayment=null;document.querySelectorAll('.payment-option').forEach(o=>o.classList.remove('selected'));$('confirmPaymentBtn').disabled=true;$('paymentModal').classList.remove('hidden');const origConfirm=$('confirmPaymentBtn').onclick;$('confirmPaymentBtn').onclick=()=>{if(!selectedPayment){showToast('⚠️ 请选择收款方式');return;}endWithPayment(pendingEndSeatId,selectedPayment);$('paymentModal').classList.add('hidden');$('confirmPaymentBtn').onclick=origConfirm;};}else if(act==='open')openTable(id);else if(act==='toggle')toggleMode(id);else if(act==='cdown'){pendingCustomSeatId=id;$('customHoursInput').value='1';$('customMinutesInput').value='0';$('customSecondsInput').value='0';updateTotal();$('customTimeModal').classList.remove('hidden');}else if(act==='transfer')showTransferModal(id);};$('cancelPaymentBtn').onclick=()=>$('paymentModal').classList.add('hidden');$('confirmTransferBtn').onclick=confirmTransfer;$('cancelTransferBtn').onclick=()=>{$('transferModal').classList.add('hidden');pendingTransferSeatId=null;};document.querySelectorAll('.stat-card').forEach(c=>c.onclick=()=>{currentFilter=c.dataset.filter;document.querySelectorAll('.stat-card').forEach(x=>x.classList.remove('active'));c.classList.add('active');applyFilter();selectedSeats.clear();});document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab==='timer'?'tabTimer':'tabReservation').classList.add('active');});$('addSeatBtn').onclick=addSeat;$('resetAllIdleBtn').onclick=()=>{seats.forEach(s=>{pauseSeat(s);s.status='idle';s.accumulatedSeconds=0;s.startTimeStr='';});save();renderGrid();};$('selectAllBtn').onclick=()=>{const visible=seats.filter(s=>{if(currentFilter==='active')return s.status==='active'||s.status==='paused';if(currentFilter==='idle')return s.status==='idle';return true;});visible.forEach(s=>selectedSeats.add(s.id));renderGrid();};$('deselectAllBtn').onclick=()=>{selectedSeats.clear();renderGrid();};$('batchOpenBtn').onclick=batchOpen;$('batchStartBtn').onclick=batchStart;$('batchEndBtn').onclick=batchEnd;$('batchNoteBtn').onclick=batchNote;$('confirmBatchNoteBtn').onclick=()=>{const noteVal=$('batchNoteSelect').value;const customVal=$('batchNoteInput').value.trim();const finalNote=customVal||noteVal;selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s){if(customVal){s.customNote=customVal;s.notes='';}else{s.notes=noteVal;s.customNote='';}}});save();$('batchNoteModal').classList.add('hidden');renderGrid();showToast(`✅ 已批量备注 ${selectedSeats.size} 个座位`);};$('cancelBatchNoteBtn').onclick=()=>$('batchNoteModal').classList.add('hidden');$('viewRecordsBtn').onclick=()=>{const d=new Date().toISOString().split('T')[0];$('recordDateInput').value=d;const recs=usageRecords.filter(r=>r.timestamp.startsWith(d));$('recordsList').innerHTML=recs.length?recs.map(r=>`<div class="record-item"><strong>${r.seatName}</strong> · ${r.duration}<br><span style="color:#999;">${new Date(r.timestamp).toLocaleTimeString()} · ${r.paymentMethod||''}</span></div>`).join(''):'<div style="text-align:center;padding:20px;">暂无记录</div>';$('recordsModal').classList.remove('hidden');};$('closeRecordsBtn').onclick=()=>$('recordsModal').classList.add('hidden');$('loadRecordsBtn').onclick=()=>{if($('recordDateInput').value){const recs=usageRecords.filter(r=>r.timestamp.startsWith($('recordDateInput').value));$('recordsList').innerHTML=recs.length?recs.map(r=>`<div class="record-item"><strong>${r.seatName}</strong> · ${r.duration}<br><span style="color:#999;">${new Date(r.timestamp).toLocaleTimeString()} · ${r.paymentMethod||''}</span></div>`).join(''):'<div style="text-align:center;padding:20px;">暂无记录</div>';}};$('exportRecordsBtn').onclick=()=>{const d=new Date().toISOString().split('T')[0];const data=[['座位','时长','收款','备注','时间']];usageRecords.filter(r=>r.timestamp.startsWith(d)).forEach(r=>data.push([r.seatName,r.duration,r.paymentMethod||'',r.notes||'',new Date(r.timestamp).toLocaleString()]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'记录');XLSX.writeFile(wb,`记录_${d}.xlsx`);};$('exportDayRecordsBtn').onclick=()=>{const d=$('recordDateInput').value;const data=[['座位','时长','收款','备注','时间']];usageRecords.filter(r=>r.timestamp.startsWith(d)).forEach(r=>data.push([r.seatName,r.duration,r.paymentMethod||'',r.notes||'',new Date(r.timestamp).toLocaleString()]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'记录');XLSX.writeFile(wb,`记录_${d}.xlsx`);};$('exportReservationsBtn').onclick=()=>{if(!reservations.length){showToast('无预约');return;}const data=[['时间','姓名','电话','座位','备注']];reservations.forEach(r=>data.push([r.dateTime,r.name,r.phone,r.seatName,r.remark]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'预约');XLSX.writeFile(wb,`预约_${new Date().toISOString().split('T')[0]}.xlsx`);};function updateTotal(){const h=parseInt($('customHoursInput').value)||0,m=parseInt($('customMinutesInput').value)||0,s=parseInt($('customSecondsInput').value)||0;$('totalSecondsDisplay').textContent=h*3600+m*60+s;}$('customHoursInput').oninput=updateTotal;$('customMinutesInput').oninput=updateTotal;$('customSecondsInput').oninput=updateTotal;$('cancelCustomBtn').onclick=()=>$('customTimeModal').classList.add('hidden');$('confirmCustomBtn').onclick=()=>{const total=(parseInt($('customHoursInput').value)||0)*3600+(parseInt($('customMinutesInput').value)||0)*60+(parseInt($('customSecondsInput').value)||0);if(total>0&&pendingCustomSeatId){setCountdown(pendingCustomSeatId,total);$('customTimeModal').classList.add('hidden');}};$('addReservationBtn').onclick=addRes;$('clearResFormBtn').onclick=()=>{$('resNameInput').value='';$('resPhoneInput').value='';$('resCustomNoteInput').value='';};document.querySelectorAll('.modal-overlay').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden');});window.delRes=delRes;window.deleteSeat=deleteSeat;window.toggleSelect=toggleSelect;}
    init();setup();
    window.addEventListener('beforeunload',()=>{save();});
})();
</script>
</body>
