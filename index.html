<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif;
            background: #f7f5f2;
            color: #2e241f;
            padding: 16px;
            min-height: 100vh;
        }
        .app { 
            max-width: 1800px; 
            margin: 0 auto; 
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .shop-name-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .shop-name {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 4px;
            color: #3b2b24;
            border-left: 5px solid #b28b6f;
            padding-left: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shop-name:hover {
            background: #f0ebe6;
            border-radius: 8px;
            padding: 4px 20px;
        }
        .shop-name small { 
            font-size: 1rem; 
            color: #7f6a5c; 
            margin-left: 8px; 
        }
        .edit-shop-name-btn {
            background: none;
            border: 1px solid #d6c9bf;
            color: #7f6a5c;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .edit-shop-name-btn:hover {
            background: #e3d9d1;
            color: #2e241f;
        }
        .shop-name-edit {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .shop-name-input {
            padding: 8px 16px;
            border: 2px solid #b28b6f;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 2px;
            background: #fffbf8;
            color: #3b2b24;
            width: 300px;
        }
        .shop-name-input:focus {
            outline: none;
            border-color: #5e4b3c;
        }
        .admin-actions { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            align-items: center; 
        }
        .btn {
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            color: #2e241f;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            user-select: none;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { 
            background: #cdbcaf; 
        }
        .btn-primary { 
            background: #5e4b3c; 
            border-color: #3f3228; 
            color: #fdf6ef; 
        }
        .btn-primary:hover { 
            background: #4a3b2f; 
        }
        .btn-success { 
            background: #4a7c59; 
            border-color: #3a6347; 
            color: #fff; 
        }
        .btn-success:hover { 
            background: #3a6347; 
        }
        .btn-sm { 
            padding: 4px 10px; 
            font-size: 0.8rem; 
        }
        .stats-bar { 
            display: flex; 
            gap: 16px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        .stat-card {
            background: #fefcf9;
            border-radius: 20px;
            padding: 12px 24px;
            border: 1px solid #e2d6cd;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 1rem;
        }
        .stat-card.active { 
            background: #5e4b3c; 
            color: #fdf6ef; 
        }
        .stat-number { 
            font-size: 1.8rem; 
            font-weight: 600; 
            min-width: 45px; 
        }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .seat-card {
            background: #fefcf9;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #e2d6cd;
        }
        .seat-card.hidden { 
            display: none !important; 
        }
        .seat-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
        }
        .seat-name { 
            font-weight: 700; 
            font-size: 1.2rem; 
        }
        .seat-status {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 20px;
            background: #ede6df;
        }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-reserved { background: #d4c1f0; }
        .status-idle { background: #e5dfd9; }
        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            text-align: center;
            margin: 10px 0;
            background: #f3ede7;
            padding: 8px 0;
            border-radius: 16px;
        }
        .mode-badge {
            font-size: 0.75rem;
            background: #cfc1b6;
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            margin: 0 auto 8px;
            text-align: center;
        }
        .seat-actions { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            margin: 8px 0; 
        }
        .seat-actions .btn { 
            flex: 1 0 45px; 
            padding: 6px 3px; 
            font-size: 0.7rem; 
        }
        
        /* 下拉备注选择器样式 */
        .notes-selector-wrapper {
            margin-top: 10px;
            border-top: 1px dashed #d6c9bf;
            padding-top: 10px;
        }
        .notes-selector-container {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .custom-select-wrapper {
            position: relative;
            flex: 1;
        }
        .notes-select {
            width: 100%;
            padding: 8px 30px 8px 12px;
            border: 1px solid #d6c9bf;
            border-radius: 24px;
            font-size: 0.8rem;
            background: #fffbf8;
            color: #2e241f;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.15s;
        }
        .notes-select:focus {
            outline: none;
            border-color: #b28b6f;
        }
        .select-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #7f6a5c;
            font-size: 0.9rem;
        }
        .custom-note-input-wrapper {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .custom-note-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #d6c9bf;
            border-radius: 24px;
            font-size: 0.75rem;
            background: #fffbf8;
        }
        .custom-note-input:focus {
            outline: none;
            border-color: #b28b6f;
        }
        .save-custom-btn {
            padding: 6px 12px;
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            border-radius: 24px;
            font-size: 0.7rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .save-custom-btn:hover {
            background: #cdbcaf;
        }
        .current-note-display {
            margin-top: 6px;
            font-size: 0.7rem;
            color: #5e4b3c;
            padding: 4px 8px;
            background: #f4ede6;
            border-radius: 16px;
        }
        
        .reservation-info {
            margin-top: 8px;
            padding: 6px 10px;
            background: #f4ede6;
            border-radius: 16px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b2b24;
            color: #f0e4da;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast-message.show { 
            opacity: 1; 
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.hidden { 
            display: none !important; 
        }
        .modal {
            background: #fefcf9;
            border-radius: 32px;
            padding: 28px;
            max-width: 450px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { 
            margin-bottom: 20px; 
            color: #3b2b24; 
            font-size: 1.3rem;
        }
        .modal-input-group { 
            margin-bottom: 18px; 
        }
        .modal-input-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #5f4e43; 
            font-size: 0.95rem;
        }
        .modal-input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d6c9bf;
            border-radius: 28px;
            font-size: 1rem;
            background: #fffbf8;
        }
        .modal-actions { 
            display: flex; 
            gap: 10px; 
            justify-content: flex-end; 
            margin-top: 24px; 
        }
        .records-list { 
            margin: 20px 0; 
            max-height: 350px; 
            overflow-y: auto; 
        }
        .record-item {
            padding: 10px 14px;
            border-bottom: 1px solid #e2d6cd;
            font-size: 0.9rem;
        }
        .footer-note {
            margin-top: 24px;
            color: #a28d7e;
            font-size: 0.85rem;
            text-align: center;
            border-top: 1px dashed #d9ccc2;
            padding-top: 16px;
        }
        
        /* 收款方式选择样式 */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .payment-option {
            padding: 16px 12px;
            border: 2px solid #d6c9bf;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fffbf8;
        }
        .payment-option:hover {
            border-color: #b28b6f;
            background: #f7f2ed;
        }
        .payment-option.selected {
            border-color: #5e4b3c;
            background: #5e4b3c;
            color: #fdf6ef;
        }
        .payment-option .payment-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .payment-option .payment-name {
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
    <!-- Excel导出库 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <!-- 提示消息 -->
    <div id="toast" class="toast-message"></div>
    
    <!-- 管理视图 -->
    <div id="adminView">
        <div class="header">
            <div class="shop-name-wrapper">
                <div id="shopNameDisplay" class="shop-name">
                    <span id="mainShopName">与己造物</span> 
                    <small id="shopSubtitle">· 手作时光</small>
                </div>
                <button class="edit-shop-name-btn" id="editShopNameBtn" title="编辑店名">编辑</button>
                <div id="shopNameEdit" class="shop-name-edit" style="display: none;">
                    <input type="text" id="shopNameInput" class="shop-name-input" placeholder="输入店名" maxlength="30">
                    <button class="btn btn-sm btn-primary" id="saveShopNameBtn">保存</button>
                    <button class="btn btn-sm" id="cancelShopNameBtn">取消</button>
                </div>
            </div>
            <div class="admin-actions">
                <button class="btn btn-sm" id="addSeatBtn" title="新增座位">新增座位</button>
                <button class="btn btn-sm" id="removeSeatBtn" title="移除座位">移除座位</button>
                <span id="seatCountDisplay" style="margin:0 6px; color:#5f4e43; font-size:1rem;">36</span>
                <button class="btn btn-sm btn-primary" id="resetAllIdleBtn" title="将所有座位设为空闲">全部空闲</button>
                <button class="btn btn-sm btn-success" id="viewRecordsBtn" title="查看使用记录">使用记录</button>
                <button class="btn btn-sm btn-success" id="exportRecordsBtn">导出记录</button>
            </div>
        </div>
        
        <!-- 状态统计 -->
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all">
                <span class="stat-number" id="statAll">36</span>
                <span>全部座位</span>
            </div>
            <div class="stat-card" data-filter="active">
                <span class="stat-number" id="statActive">0</span>
                <span>使用中</span>
            </div>
            <div class="stat-card" data-filter="reserved">
                <span class="stat-number" id="statReserved">0</span>
                <span>已预约</span>
            </div>
            <div class="stat-card" data-filter="idle">
                <span class="stat-number" id="statIdle">36</span>
                <span>空闲中</span>
            </div>
        </div>
        
        <!-- 座位网格 -->
        <div id="seatsContainer" class="seats-grid"></div>
        
        <!-- 底部说明 -->
        <div class="footer-note">
            <p>点击「开台」后计时从0开始 · 预约可记录顾客信息 · 结束时可选择收款方式</p>
        </div>
    </div>

    <!-- 使用记录模态框 -->
    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>每日使用记录</h3>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <input type="date" id="recordDateInput" style="flex:1; padding:10px; border-radius:24px; border:1px solid #d6c9bf; background:#fffbf8;">
                <button class="btn btn-sm btn-primary" id="loadRecordsBtn">查看</button>
            </div>
            <div class="records-list" id="recordsList">
                <div style="text-align:center; color:#999; padding:30px;">请选择日期查看记录</div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-sm btn-success" id="exportDayRecordsBtn">导出Excel</button>
                <button class="btn btn-sm" id="closeRecordsBtn">关闭</button>
            </div>
        </div>
    </div>

    <!-- 倒计时设置模态框 -->
    <div id="customTimeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>设置倒计时</h3>
            <div class="modal-input-group">
                <input type="number" id="customMinutesInput" placeholder="请输入分钟数" min="0.1" value="60" step="0.5">
            </div>
            <div style="color:#7f6a5c; margin-bottom:20px; font-size:0.9rem;">
                提示：支持小数，例如 1.5 表示 1分30秒
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelCustomBtn">取消</button>
                <button class="btn btn-primary" id="confirmCustomBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 预约信息模态框 -->
    <div id="reservationModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>填写预约信息</h3>
            <div class="modal-input-group">
                <label>顾客姓名 <span style="color:#c0392b;">*</span></label>
                <input type="text" id="reserveNameInput" placeholder="请输入顾客姓名" maxlength="50">
            </div>
            <div class="modal-input-group">
                <label>联系方式</label>
                <input type="text" id="reserveContactInput" placeholder="电话 / 微信号 / 微信名" maxlength="100">
            </div>
            <div style="color:#7f6a5c; margin-bottom:12px; font-size:0.85rem;">
                提示：姓名必填，联系方式选填
            </div>
            <div class="modal-actions">
                <button class="btn" id="cancelReserveBtn">取消</button>
                <button class="btn btn-primary" id="confirmReserveBtn">确认预约</button>
            </div>
        </div>
    </div>

    <!-- 收款方式选择模态框 -->
    <div id="paymentModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>选择收款方式</h3>
            <div style="margin-bottom: 16px; color: #5f4e43;">
                <span id="paymentSeatInfo"></span>
            </div>
            <div class="payment-methods">
                <div class="payment-option" data-payment="抖音团购">
                    <div class="payment-icon">🎵</div>
                    <div class="payment-name">抖音团购</div>
                </div>
                <div class="payment-option" data-payment="美团团购">
                    <div class="payment-icon">🍔</div>
                    <div class="payment-name">美团团购</div>
                </div>
                <div class="payment-option" data-payment="支付宝">
                    <div class="payment-icon">💙</div>
                    <div class="payment-name">支付宝</div>
                </div>
                <div class="payment-option" data-payment="微信">
                    <div class="payment-icon">💚</div>
                    <div class="payment-name">微信</div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" id="skipPaymentBtn">跳过</button>
                <button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    "use strict";
    
    const STORAGE_KEY = 'yujizaowu_seats_v4';
    const RECORDS_KEY = 'yujizaowu_records_v4';
    const SHOP_NAME_KEY = 'yujizaowu_shop_name';
    const DEFAULT_SEAT_COUNT = 36;
    
    // 备注选项
    const NOTE_OPTIONS = ['', '抖音全天', '美团全天', '抖音小时', '美团小时', '__custom__'];
    const NOTE_LABELS = {
        '': '无备注',
        '抖音全天': '抖音全天',
        '美团全天': '美团全天', 
        '抖音小时': '抖音小时',
        '美团小时': '美团小时',
        '__custom__': '✨ 自定义备注'
    };
    
    let seats = [];
    let usageRecords = [];
    let globalTimer = null;
    let pendingCustomSeatId = null;
    let pendingReserveSeatId = null;
    let pendingEndSeatId = null;
    let selectedPayment = null;
    let currentFilter = 'all';
    let shopName = { main: '与己造物', subtitle: '· 手作时光' };

    const $ = id => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function loadShopName() {
        try { 
            const saved = JSON.parse(localStorage.getItem(SHOP_NAME_KEY));
            if (saved && saved.main) { 
                shopName = saved; 
            }
        } catch(e) {}
        updateShopNameDisplay();
    }
    
    function saveShopName() { 
        localStorage.setItem(SHOP_NAME_KEY, JSON.stringify(shopName)); 
    }
    
    function updateShopNameDisplay() {
        $('mainShopName').textContent = shopName.main;
        $('shopSubtitle').textContent = shopName.subtitle || '';
        document.title = shopName.main + (shopName.subtitle ? ' ' + shopName.subtitle : '') + ' · 手工店计时';
    }

    function loadRecords() {
        try { usageRecords = JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } 
        catch(e) { usageRecords = []; }
    }
    
    function saveRecords() { localStorage.setItem(RECORDS_KEY, JSON.stringify(usageRecords)); }
    
    function addRecord(seatName, action, duration, notes, paymentMethod) {
        const record = {
            id: Date.now() + Math.random(),
            seatName, action, duration, notes: notes || '',
            timestamp: new Date().toISOString()
        };
        if (paymentMethod) {
            record.paymentMethod = paymentMethod;
            record.notes = record.notes + (record.notes ? ' | ' : '') + '收款: ' + paymentMethod;
        }
        usageRecords.push(record);
        saveRecords();
    }

    function createDefaultSeat(id) {
        return {
            id, name: id + '号桌', status: 'idle', timerMode: 'countup',
            countdownInitial: 3600, accumulatedSeconds: 0, running: false,
            startTimestamp: null, notes: '', customNoteValue: '', reserved: false, reservation: null
        };
    }

    function loadSeats() {
        try { 
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(parsed) && parsed.length) { 
                seats = parsed; 
                seats.forEach(s => { 
                    if (s.notes === undefined) s.notes = '';
                    if (s.customNoteValue === undefined) s.customNoteValue = '';
                });
                return; 
            }
        } catch(e) {}
        // 兼容旧版本
        try {
            const oldKeys = ['yujizaowu_seats_v3', 'yujizaowu_seats_v2', 'yujizaowu_seats'];
            for (let key of oldKeys) {
                const old = JSON.parse(localStorage.getItem(key));
                if (Array.isArray(old) && old.length) {
                    seats = old;
                    seats.forEach(s => { 
                        if (s.notes === undefined) s.notes = '';
                        if (s.customNoteValue === undefined) s.customNoteValue = '';
                    });
                    saveSeats();
                    return;
                }
            }
        } catch(e) {}
        seats = Array.from({length: DEFAULT_SEAT_COUNT}, (_, i) => createDefaultSeat(i+1));
        saveSeats();
    }
    
    function saveSeats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(seats)); }
    function getSeatIndex(id) { return seats.findIndex(s => s.id === id); }

    function getCurrentSeconds(seat) {
        let base = seat.accumulatedSeconds || 0;
        if (seat.running && seat.startTimestamp) base += (Date.now() - seat.startTimestamp) / 1000;
        return base;
    }

    function formatTime(s) {
        s = Math.max(0, s);
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function getTimerText(seat) {
        if (seat.timerMode === 'countdown') return formatTime(Math.max(0, seat.countdownInitial - getCurrentSeconds(seat)));
        return formatTime(getCurrentSeconds(seat));
    }

    function stopRunning(seat) {
        if (seat.running && seat.startTimestamp) {
            seat.accumulatedSeconds += (Date.now() - seat.startTimestamp) / 1000;
            seat.running = false;
            seat.startTimestamp = null;
        }
    }

    function actionOpenTable(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.status = 'active'; seat.reserved = false; seat.reservation = null;
        seat.accumulatedSeconds = 0; seat.running = false;
        refreshUI(); showToast(`✅ ${seat.name} 已开台`);
    }

    function actionStart(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (seat.reserved) { showToast('⚠️ 该座位已预约，请先开台'); return; }
        if (seat.status === 'idle') { showToast('⚠️ 请先「开台」再开始计时'); return; }
        if (seat.running) return;
        seat.running = true; seat.startTimestamp = Date.now(); seat.status = 'active';
        refreshUI();
    }

    function actionPause(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        stopRunning(seats[idx]); seats[idx].status = 'paused';
        refreshUI(); showToast(`⏸️ ${seats[idx].name} 已暂停`);
    }

    function actionEndWithPayment(seatId, paymentMethod) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        const finalNote = getEffectiveNote(seat);
        const duration = formatTime(seat.accumulatedSeconds);
        addRecord(seat.name, '结束使用', duration, finalNote, paymentMethod);
        seat.status = 'idle'; seat.reserved = false; seat.reservation = null; 
        seat.accumulatedSeconds = 0; seat.notes = ''; seat.customNoteValue = '';
        refreshUI();
        const paymentMsg = paymentMethod ? ` (${paymentMethod})` : '';
        showToast(`✅ ${seat.name} 已结束，使用时长 ${duration}${paymentMsg}`);
    }

    function actionReset(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat); 
        seat.accumulatedSeconds = 0;
        seat.notes = ''; seat.customNoteValue = '';
        refreshUI(); 
        showToast(`🔄 ${seat.name} 计时已重置，备注已清空`);
    }

    function actionToggleMode(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.timerMode = seat.timerMode === 'countup' ? 'countdown' : 'countup';
        seat.accumulatedSeconds = 0;
        renderAdminGrid();
        showToast(`🔁 已切换为${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}`);
    }

    function getEffectiveNote(seat) {
        if (seat.notes === '__custom__') {
            return seat.customNoteValue || '';
        }
        return seat.notes || '';
    }

    function handleNoteSelect(seatId, value) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        
        if (value === '__custom__') {
            seat.notes = '__custom__';
        } else {
            seat.notes = value;
            seat.customNoteValue = '';
        }
        saveSeats();
        renderAdminGrid();
        
        const displayNote = getEffectiveNote(seat);
        if (displayNote) {
            showToast(`🏷️ 备注: ${displayNote}`);
        } else {
            showToast(`🧹 已清空备注`);
        }
    }

    function handleCustomNoteSave(seatId, customValue) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        const trimmed = customValue.trim();
        seat.customNoteValue = trimmed;
        if (seat.notes === '__custom__' || !seat.notes) {
            seat.notes = '__custom__';
        }
        saveSeats();
        renderAdminGrid();
        if (trimmed) {
            showToast(`✅ 自定义备注: ${trimmed}`);
        } else {
            showToast(`🧹 备注已清空`);
        }
    }

    function showPaymentModal(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        pendingEndSeatId = seatId;
        selectedPayment = null;
        
        $('paymentSeatInfo').textContent = `${seat.name} · 使用时长: ${formatTime(getCurrentSeconds(seat))}`;
        
        // 清除所有选中状态
        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.classList.remove('selected');
        });
        $('confirmPaymentBtn').disabled = true;
        
        $('paymentModal').classList.remove('hidden');
    }

    function renderAdminGrid() {
        let html = '';
        seats.forEach(seat => {
            const statusClass = seat.reserved ? 'status-reserved' : 
                (seat.status === 'active' ? (seat.running ? 'status-active' : 'status-paused') : 
                (seat.status === 'paused' ? 'status-paused' : 'status-idle'));
            const statusText = seat.reserved ? '已预约' : 
                (seat.status === 'idle' ? '空闲' : (seat.running ? '计时中' : '已暂停'));
            
            const currentNoteValue = seat.notes || '';
            const effectiveNote = getEffectiveNote(seat);
            const customInputValue = seat.notes === '__custom__' ? (seat.customNoteValue || '') : '';
            const showCustomInput = seat.notes === '__custom__';
            
            const optionsHtml = NOTE_OPTIONS.map(opt => {
                const selected = currentNoteValue === opt ? 'selected' : '';
                return `<option value="${opt}" ${selected}>${NOTE_LABELS[opt]}</option>`;
            }).join('');
            
            html += `
                <div class="seat-card" data-seat-id="${seat.id}">
                    <div class="seat-header">
                        <span class="seat-name">${seat.name}</span>
                        <span class="seat-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="mode-badge">${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}</div>
                    <div class="timer-display" id="timer-${seat.id}">${getTimerText(seat)}</div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="start" data-id="${seat.id}" title="开始计时">开始</button>
                        <button class="btn btn-sm" data-action="pause" data-id="${seat.id}" title="暂停计时">暂停</button>
                        <button class="btn btn-sm" data-action="end" data-id="${seat.id}" title="结束使用">结束</button>
                        <button class="btn btn-sm" data-action="reset" data-id="${seat.id}" title="重置时间并清空备注">重置</button>
                    </div>
                    <div class="seat-actions">
                        <button class="btn btn-sm" data-action="openTable" data-id="${seat.id}" title="开台">开台</button>
                        <button class="btn btn-sm" data-action="reserve" data-id="${seat.id}" title="预约">预约</button>
                        <button class="btn btn-sm" data-action="toggleMode" data-id="${seat.id}" title="切换模式">切换</button>
                        <button class="btn btn-sm btn-primary" data-action="customCountdown" data-id="${seat.id}" title="设置倒计时">倒计时</button>
                    </div>
                    
                    <!-- 下拉备注选择器 -->
                    <div class="notes-selector-wrapper">
                        <div class="notes-selector-container">
                            <div class="custom-select-wrapper">
                                <select class="notes-select" data-action="noteSelect" data-id="${seat.id}">
                                    ${optionsHtml}
                                </select>
                                <span class="select-arrow">▼</span>
                            </div>
                        </div>
                        
                        ${showCustomInput ? `
                        <div class="custom-note-input-wrapper">
                            <input type="text" class="custom-note-input" placeholder="输入自定义备注..." data-id="${seat.id}" value="${customInputValue.replace(/"/g, '&quot;')}">
                            <button class="save-custom-btn" data-action="saveCustomNote" data-id="${seat.id}">保存</button>
                        </div>
                        ` : ''}
                        
                        ${effectiveNote ? `
                        <div class="current-note-display">
                            📋 当前备注: ${effectiveNote}
                        </div>
                        ` : ''}
                    </div>
                    
                    ${seat.reserved && seat.reservation ? 
                        `<div class="reservation-info">
                            <span>预约</span>
                            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${seat.reservation.name} | ${seat.reservation.contact || '未填写联系方式'}</span>
                            <button style="background:none;border:none;cursor:pointer;padding:3px 6px;" data-action="cancelReserve" data-id="${seat.id}">取消预约</button>
                        </div>` : ''
                    }
                </div>
            `;
        });
        $('seatsContainer').innerHTML = html;
        updateStats(); applyFilter();
        $('seatCountDisplay').textContent = seats.length;
    }

    function updateStats() {
        $('statAll').textContent = seats.length;
        $('statActive').textContent = seats.filter(s => s.status === 'active' && !s.reserved).length;
        $('statReserved').textContent = seats.filter(s => s.reserved).length;
        $('statIdle').textContent = seats.filter(s => s.status === 'idle' && !s.reserved).length;
    }

    function applyFilter() {
        document.querySelectorAll('.seat-card').forEach(card => {
            const seat = seats.find(s => s.id === parseInt(card.dataset.seatId));
            if (!seat) return;
            let show = true;
            if (currentFilter === 'active') show = seat.status === 'active' && !seat.reserved;
            else if (currentFilter === 'reserved') show = seat.reserved;
            else if (currentFilter === 'idle') show = seat.status === 'idle' && !seat.reserved;
            card.classList.toggle('hidden', !show);
        });
    }

    function refreshUI() {
        saveSeats();
        renderAdminGrid();
    }

    function showRecords(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        $('recordDateInput').value = date;
        const list = $('recordsList');
        const dayRecords = usageRecords.filter(r => r.timestamp.startsWith(date)).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        if (!dayRecords.length) { list.innerHTML = '<div style="text-align:center; color:#999; padding:30px;">当天暂无使用记录</div>'; return; }
        list.innerHTML = dayRecords.map(r => `<div class="record-item"><strong>${r.seatName}</strong> · ${r.action} · ${r.duration} <span style="color:#999;font-size:0.8rem;">${new Date(r.timestamp).toLocaleTimeString('zh-CN',{hour12:false})}</span>${r.notes?'<br><span style="color:#666;">备注：'+r.notes+'</span>':''}</div>`).join('');
    }

    function exportToExcel(dateStr) {
        const date = dateStr || new Date().toISOString().split('T')[0];
        const data = [['座位','操作','时长','备注','时间']];
        usageRecords.filter(r => r.timestamp.startsWith(date)).forEach(r => data.push([r.seatName, r.action, r.duration, r.notes||'', new Date(r.timestamp).toLocaleString('zh-CN',{hour12:false})]));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), '使用记录');
        XLSX.writeFile(wb, `${shopName.main}_使用记录_${date}.xlsx`);
        showToast('✅ Excel 导出成功');
    }

    function setupEvents() {
        $('editShopNameBtn').addEventListener('click', () => {
            $('shopNameDisplay').style.display = 'none';
            $('editShopNameBtn').style.display = 'none';
            $('shopNameEdit').style.display = 'flex';
            $('shopNameInput').value = shopName.main;
            $('shopNameInput').focus();
        });
        
        $('saveShopNameBtn').addEventListener('click', () => {
            const newName = $('shopNameInput').value.trim();
            if (newName) {
                shopName.main = newName;
                shopName.subtitle = '· 手作时光';
                saveShopName();
                updateShopNameDisplay();
                showToast(`✅ 店名已更新为"${shopName.main}"`);
            }
            $('shopNameDisplay').style.display = 'block';
            $('editShopNameBtn').style.display = 'inline-block';
            $('shopNameEdit').style.display = 'none';
        });
        
        $('cancelShopNameBtn').addEventListener('click', () => {
            $('shopNameDisplay').style.display = 'block';
            $('editShopNameBtn').style.display = 'inline-block';
            $('shopNameEdit').style.display = 'none';
        });
        
        $('shopNameInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') $('saveShopNameBtn').click();
        });

        $('seatsContainer').addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action, seatId = parseInt(btn.dataset.id);
            
            if (action === 'start') actionStart(seatId);
            else if (action === 'pause') actionPause(seatId);
            else if (action === 'end') showPaymentModal(seatId);
            else if (action === 'reset') actionReset(seatId);
            else if (action === 'openTable') actionOpenTable(seatId);
            else if (action === 'reserve') { 
                pendingReserveSeatId = seatId; 
                $('reserveNameInput').value = ''; 
                $('reserveContactInput').value = ''; 
                $('reservationModal').classList.remove('hidden'); 
            }
            else if (action === 'cancelReserve') { 
                const idx = getSeatIndex(seatId); 
                if (idx!==-1) { 
                    seats[idx].reserved = false; 
                    seats[idx].reservation = null; 
                    refreshUI(); 
                    showToast('预约已取消'); 
                } 
            }
            else if (action === 'toggleMode') actionToggleMode(seatId);
            else if (action === 'customCountdown') { 
                pendingCustomSeatId = seatId; 
                $('customMinutesInput').value = '60'; 
                $('customTimeModal').classList.remove('hidden'); 
            }
            else if (action === 'saveCustomNote') {
                const input = document.querySelector(`.custom-note-input[data-id="${seatId}"]`);
                if (input) {
                    handleCustomNoteSave(seatId, input.value);
                }
            }
        });

        $('seatsContainer').addEventListener('change', e => {
            if (e.target.classList.contains('notes-select')) {
                const select = e.target;
                const action = select.dataset.action;
                const seatId = parseInt(select.dataset.id);
                if (action === 'noteSelect') {
                    handleNoteSelect(seatId, select.value);
                }
            }
        });

        $('seatsContainer').addEventListener('keypress', e => {
            if (e.key === 'Enter' && e.target.classList.contains('custom-note-input')) {
                const seatId = parseInt(e.target.dataset.id);
                handleCustomNoteSave(seatId, e.target.value);
            }
        });

        // 收款方式选择事件
        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedPayment = opt.dataset.payment;
                $('confirmPaymentBtn').disabled = false;
            });
        });

        $('confirmPaymentBtn').addEventListener('click', () => {
            if (pendingEndSeatId && selectedPayment) {
                actionEndWithPayment(pendingEndSeatId, selectedPayment);
                $('paymentModal').classList.add('hidden');
            }
        });

        $('skipPaymentBtn').addEventListener('click', () => {
            if (pendingEndSeatId) {
                actionEndWithPayment(pendingEndSeatId, null);
                $('paymentModal').classList.add('hidden');
            }
        });

        document.querySelectorAll('.stat-card').forEach(c => c.addEventListener('click', () => {
            currentFilter = c.dataset.filter;
            document.querySelectorAll('.stat-card').forEach(x => x.classList.remove('active'));
            c.classList.add('active'); applyFilter();
        }));

        $('addSeatBtn').addEventListener('click', () => { 
            const newId = seats.length > 0 ? Math.max(...seats.map(s=>s.id)) + 1 : 1;
            seats.push(createDefaultSeat(newId)); 
            saveSeats(); 
            renderAdminGrid(); 
            showToast(`✅ 已添加新座位`); 
        });
        $('removeSeatBtn').addEventListener('click', () => { 
            if(seats.length>1) { 
                seats.pop(); 
                saveSeats(); 
                renderAdminGrid(); 
                showToast('✅ 已移除座位'); 
            } else showToast('⚠️ 至少保留一个座位'); 
        });
        $('resetAllIdleBtn').addEventListener('click', () => { 
            seats.forEach(s => { 
                stopRunning(s); 
                s.status='idle'; 
                s.reserved=false; 
                s.reservation=null; 
                s.accumulatedSeconds=0;
                s.notes = ''; s.customNoteValue = '';
            }); 
            saveSeats(); 
            renderAdminGrid(); 
            showToast('✅ 全部空闲，所有备注已清空'); 
        });
        $('viewRecordsBtn').addEventListener('click', () => { 
            showRecords(new Date().toISOString().split('T')[0]); 
            $('recordsModal').classList.remove('hidden'); 
        });
        $('closeRecordsBtn').addEventListener('click', () => $('recordsModal').classList.add('hidden'));
        $('loadRecordsBtn').addEventListener('click', () => { 
            if($('recordDateInput').value) showRecords($('recordDateInput').value); 
        });
        $('exportRecordsBtn').addEventListener('click', () => exportToExcel(new Date().toISOString().split('T')[0]));
        $('exportDayRecordsBtn').addEventListener('click', () => { 
            exportToExcel($('recordDateInput').value); 
            $('recordsModal').classList.add('hidden'); 
        });
        $('cancelCustomBtn').addEventListener('click', () => $('customTimeModal').classList.add('hidden'));
        $('confirmCustomBtn').addEventListener('click', () => {
            const m = parseFloat($('customMinutesInput').value);
            if (m>0 && pendingCustomSeatId) { 
                const idx = getSeatIndex(pendingCustomSeatId); 
                if(idx!==-1){ 
                    stopRunning(seats[idx]); 
                    seats[idx].countdownInitial = Math.floor(m*60); 
                    seats[idx].timerMode='countdown'; 
                    seats[idx].accumulatedSeconds=0; 
                    refreshUI(); 
                    showToast(`✅ 倒计时设为 ${m} 分钟`); 
                } 
            }
            else showToast('⚠️ 请输入有效分钟数');
            $('customTimeModal').classList.add('hidden');
        });
        $('cancelReserveBtn').addEventListener('click', () => $('reservationModal').classList.add('hidden'));
        $('confirmReserveBtn').addEventListener('click', () => {
            const name = $('reserveNameInput').value.trim();
            if (!name) { showToast('⚠️ 请填写姓名'); return; }
            if (pendingReserveSeatId) { 
                const idx = getSeatIndex(pendingReserveSeatId); 
                if(idx!==-1){ 
                    stopRunning(seats[idx]); 
                    seats[idx].reserved=true; 
                    seats[idx].status='idle'; 
                    const contact = $('reserveContactInput').value.trim();
                    seats[idx].reservation={name, contact: contact || ''}; 
                    addRecord(seats[idx].name,'预约','-',`${name} ${contact || ''}`); 
                    refreshUI(); 
                    showToast(`✅ 已预约给 ${name}`); 
                } 
            }
            $('reservationModal').classList.add('hidden');
        });
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { 
            if(e.target===m) m.classList.add('hidden'); 
        }));
    }

    loadShopName();
    loadSeats(); 
    loadRecords(); 
    renderAdminGrid(); 
    setupEvents();
    globalTimer = setInterval(() => {
        seats.forEach(s => { 
            const el = $(`timer-${s.id}`); 
            if(el) el.textContent = getTimerText(s); 
            if(s.timerMode==='countdown' && s.running && s.countdownInitial-getCurrentSeconds(s)<=0){ 
                s.running=false; 
                s.accumulatedSeconds=s.countdownInitial; 
                s.status='paused'; 
                refreshUI(); 
            } 
        });
        updateStats();
    }, 200);
})();
</script>
</body>
</html>
