<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f7f5f2; color: #2e241f; padding: 12px; min-height: 100vh; }
        .app { max-width: 1600px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        .shop-name { font-size: 1.8rem; font-weight: 400; letter-spacing: 4px; color: #3b2b24; border-left: 5px solid #b28b6f; padding-left: 16px; }
        .btn { background: #e3d9d1; border: 1px solid #b8a69a; color: #2e241f; padding: 6px 12px; border-radius: 30px; font-size: 0.85rem; cursor: pointer; }
        .btn-primary { background: #5e4b3c; border-color: #3f3228; color: #fdf6ef; }
        .btn-success { background: #4a7c59; color: #fff; }
        .stats-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card { background: #fefcf9; border-radius: 16px; padding: 8px 16px; border: 1px solid #e2d6cd; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .stat-card.active { background: #5e4b3c; color: #fdf6ef; }
        .stat-number { font-size: 1.5rem; font-weight: 600; min-width: 35px; }
        .seats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
        .seat-card { background: #fefcf9; border-radius: 16px; padding: 10px; border: 1px solid #e2d6cd; }
        .seat-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .seat-name { font-weight: 700; font-size: 1rem; }
        .seat-status { font-size: 0.55rem; padding: 2px 5px; border-radius: 20px; background: #ede6df; }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-reserved { background: #d4c1f0; }
        .status-idle { background: #e5dfd9; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 1.4rem; text-align: center; margin: 6px 0; background: #f3ede7; padding: 5px 0; border-radius: 12px; }
        .mode-badge { font-size: 0.6rem; background: #cfc1b6; display: inline-block; padding: 2px 6px; border-radius: 20px; text-align: center; }
        .qr-section { margin: 6px 0; }
        .qr-toggle-btn { width: 100%; background: #e8dfd7; border: 1px dashed #b8a69a; color: #5e4b3c; padding: 4px 8px; border-radius: 20px; font-size: 0.65rem; cursor: pointer; }
        .qr-content { display: none; flex-direction: column; align-items: center; margin-top: 6px; padding: 8px; background: #f8f4f0; border-radius: 12px; }
        .qr-content.show { display: flex; }
        .qr-code { width: 100px; height: 100px; background: white; border-radius: 8px; padding: 5px; border: 1px solid #d9ccc2; }
        .qr-url { font-size: 0.4rem; color: #8e7a6c; margin-top: 4px; word-break: break-all; }
        .seat-actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
        .seat-actions .btn { flex: 1 0 40px; padding: 4px 2px; font-size: 0.6rem; }
        .notes-input { width: 100%; padding: 4px 6px; border: 1px solid #d6c9bf; border-radius: 20px; font-size: 0.65rem; margin-top: 4px; }
        .toast-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3b2b24; color: #f0e4da; padding: 8px 20px; border-radius: 30px; opacity: 0; transition: opacity 0.2s; z-index: 9999; }
        .toast-message.show { opacity: 1; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-overlay.hidden { display: none !important; }
        .modal { background: #fefcf9; border-radius: 28px; padding: 24px; max-width: 400px; width: 90%; }
        .customer-container { max-width: 420px; margin: 20px auto; background: #fefcf9; border-radius: 36px; padding: 28px 20px; text-align: center; }
        .customer-timer { font-size: 4rem; font-family: 'Courier New', monospace; background: #f2ebe4; padding: 20px 10px; border-radius: 50px; margin: 16px 0; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; color: #7b6456; padding: 8px 20px; background: #e8dfd7; border-radius: 30px; text-decoration: none; margin-top: 16px; }
        .reservation-info { margin-top: 5px; padding: 4px 6px; background: #f4ede6; border-radius: 12px; font-size: 0.6rem; display: flex; align-items: center; gap: 4px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    
    <div id="adminView">
        <div class="header">
            <div class="shop-name">与己造物 <small>· 手作时光</small></div>
            <div class="admin-actions">
                <button class="btn btn-sm" id="addSeatBtn">➕ 座位</button>
                <button class="btn btn-sm" id="removeSeatBtn">➖ 座位</button>
                <span id="seatCountDisplay">36</span>
                <button class="btn btn-sm" id="saveAllNotesBtn">💾 保存</button>
                <button class="btn btn-sm btn-primary" id="resetAllIdleBtn">🔄 全部空闲</button>
                <button class="btn btn-sm btn-success" id="viewRecordsBtn">📊 记录</button>
                <button class="btn btn-sm btn-success" id="exportRecordsBtn">📥 导出</button>
            </div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all"><span class="stat-number" id="statAll">36</span><span>全部</span></div>
            <div class="stat-card" data-filter="active"><span class="stat-number" id="statActive">0</span><span>🟢 使用中</span></div>
            <div class="stat-card" data-filter="reserved"><span class="stat-number" id="statReserved">0</span><span>📅 已预约</span></div>
            <div class="stat-card" data-filter="idle"><span class="stat-number" id="statIdle">36</span><span>⚪ 空闲</span></div>
        </div>
        
        <div id="seatsContainer" class="seats-grid"></div>
        <div style="text-align:center; margin-top:20px; color:#8e7a6c; font-size:0.75rem;">📱 点击「显示二维码」→ 打印 → 顾客扫码实时计时</div>
    </div>

    <div id="customerView" class="hidden">
        <div class="customer-container">
            <div style="font-size:1.6rem; color:#5f4b3c;">与己造物</div>
            <div style="font-size:2.5rem; margin:16px 0;" id="customerSeatName">座位</div>
            <div id="customerTimerDisplay" class="customer-timer">00:00:00</div>
            <div id="customerStatusBadge" style="font-size:1rem; margin:8px 0;"></div>
            <div id="customerReservationInfo"></div>
            <div id="customerNoteDisplay" style="background:#f4ede6; border-radius:20px; padding:14px; margin:16px 0;">暂无备注</div>
            <div style="color:#7f6a5c;">⏱️ 实时更新中</div>
            <a href="./" class="back-link">← 返回管理</a>
        </div>
    </div>

    <div id="customTimeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>⏱️ 自定义倒计时</h3>
            <input type="number" id="customMinutesInput" placeholder="分钟" min="0.1" value="60" step="0.5" style="width:100%; padding:10px; border-radius:24px; border:1px solid #d6c9bf; margin:16px 0;">
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" id="cancelCustomBtn">取消</button>
                <button class="btn btn-primary" id="confirmCustomBtn">确定</button>
            </div>
        </div>
    </div>

    <div id="reservationModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>📅 预约信息</h3>
            <div style="margin-bottom:14px;"><label>姓名 *</label><input type="text" id="reserveNameInput" placeholder="顾客姓名" style="width:100%; padding:10px; border-radius:24px; border:1px solid #d6c9bf;"></div>
            <div style="margin-bottom:14px;"><label>联系方式</label><input type="text" id="reserveContactInput" placeholder="电话/微信号" style="width:100%; padding:10px; border-radius:24px; border:1px solid #d6c9bf;"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="btn" id="cancelReserveBtn">取消</button>
                <button class="btn btn-primary" id="confirmReserveBtn">确认</button>
            </div>
        </div>
    </div>

    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>📊 使用记录</h3>
            <div style="display:flex; gap:8px; margin:16px 0;"><input type="date" id="recordDateInput" style="flex:1; padding:8px; border-radius:20px; border:1px solid #d6c9bf;"><button class="btn btn-primary" id="loadRecordsBtn">查看</button></div>
            <div id="recordsList" style="max-height:300px; overflow-y:auto;"></div>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px;">
                <button class="btn btn-success" id="exportDayRecordsBtn">📥 导出</button>
                <button class="btn" id="closeRecordsBtn">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const STORAGE_KEY = 'yujizaowu_seats';
    const RECORDS_KEY = 'yujizaowu_records';
    const DEFAULT_SEAT_COUNT = 36;
    
    let seats = [], usageRecords = [], globalTimer = null, currentView = 'admin', customerSeatId = null;
    let pendingCustomSeatId = null, pendingReserveSeatId = null, currentFilter = 'all';
    const qrCodeCache = new Map();

    const $ = id => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    function getSeatUrl(seatId) {
        const url = new URL(window.location.href);
        url.searchParams.set('seat', seatId);
        return url.toString();
    }

    function generateQRCode(container, seatId) {
        if (!container) return;
        if (qrCodeCache.has(seatId)) { container.innerHTML = ''; container.appendChild(qrCodeCache.get(seatId).cloneNode(true)); return; }
        container.innerHTML = '';
        try {
            const div = document.createElement('div');
            new QRCode(div, { text: getSeatUrl(seatId), width: 100, height: 100, colorDark: "#3a2c24", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.L });
            setTimeout(() => { const canvas = div.querySelector('canvas'); if (canvas) qrCodeCache.set(seatId, canvas.cloneNode(true)); }, 50);
            container.appendChild(div);
        } catch(e) { container.innerHTML = '<div style="width:100px;height:100px;background:#f0ebe6;display:flex;align-items:center;justify-content:center;">失败</div>'; }
    }

    function toggleQRCode(seatId, show) {
        const content = $(`qr-content-${seatId}`), container = $(`qrcode-${seatId}`), btn = $(`qr-toggle-${seatId}`);
        if (content && container) {
            content.classList.toggle('show', show);
            if (btn) btn.innerHTML = show ? '📱 隐藏二维码' : '📱 显示二维码';
            if (show) generateQRCode(container, seatId);
        }
    }

    function loadRecords() { try { usageRecords = JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } catch(e) { usageRecords = []; } }
    function saveRecords() { localStorage.setItem(RECORDS_KEY, JSON.stringify(usageRecords)); }
    function addRecord(seatName, action, duration, notes) {
        usageRecords.push({ id: Date.now(), seatName, action, duration, notes: notes || '', timestamp: new Date().toISOString() });
        saveRecords();
    }

    function createDefaultSeat(id) { return { id, name: id+'号桌', status:'idle', timerMode:'countup', countdownInitial:3600, accumulatedSeconds:0, running:false, startTimestamp:null, notes:'', reserved:false, reservation:null }; }
    function loadSeats() {
        try { const p = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (Array.isArray(p) && p.length) { seats = p; return; } } catch(e) {}
        seats = Array.from({length:DEFAULT_SEAT_COUNT}, (_,i) => createDefaultSeat(i+1));
        saveSeats();
    }
    function saveSeats() { localStorage.setItem(STORAGE_KEY, JSON.stringify(seats)); }
    function getSeatIndex(id) { return seats.findIndex(s => s.id === id); }

    function getCurrentSeconds(seat) { let b = seat.accumulatedSeconds||0; if(seat.running && seat.startTimestamp) b += (Date.now()-seat.startTimestamp)/1000; return b; }
    function formatTime(s) { s=Math.max(0,s); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=Math.floor(s%60); return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
    function getTimerText(seat) { return seat.timerMode==='countdown' ? formatTime(Math.max(0, seat.countdownInitial - getCurrentSeconds(seat))) : formatTime(getCurrentSeconds(seat)); }
    function stopRunning(seat) { if(seat.running && seat.startTimestamp) { seat.accumulatedSeconds += (Date.now()-seat.startTimestamp)/1000; seat.running=false; seat.startTimestamp=null; } }

    function actionOpenTable(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; const s=seats[idx]; stopRunning(s); s.status='active'; s.reserved=false; s.reservation=null; s.accumulatedSeconds=0; s.running=false; refreshUI(); showToast(`✅ ${s.name} 已开台`); }
    function actionStart(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; const s=seats[idx]; if(s.reserved){showToast('⚠️ 已预约，请先开台');return;} if(s.status==='idle'){showToast('⚠️ 请先开台');return;} if(s.running)return; s.running=true; s.startTimestamp=Date.now(); s.status='active'; refreshUI(); }
    function actionPause(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; stopRunning(seats[idx]); seats[idx].status='paused'; refreshUI(); }
    function actionEnd(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; const s=seats[idx]; stopRunning(s); addRecord(s.name,'结束',formatTime(s.accumulatedSeconds),s.notes); s.status='idle'; s.reserved=false; s.reservation=null; s.accumulatedSeconds=0; refreshUI(); showToast(`✅ ${s.name} 已结束`); }
    function actionReset(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; stopRunning(seats[idx]); seats[idx].accumulatedSeconds=0; refreshUI(); }
    function actionToggleMode(seatId) { const idx=getSeatIndex(seatId); if(idx===-1) return; const s=seats[idx]; stopRunning(s); s.timerMode = s.timerMode==='countup'?'countdown':'countup'; s.accumulatedSeconds=0; renderAdminGrid(); }

    function renderAdminGrid() {
        let html = '';
        seats.forEach(s => {
            const cls = s.reserved?'status-reserved':(s.status==='active'?(s.running?'status-active':'status-paused'):(s.status==='paused'?'status-paused':'status-idle'));
            const txt = s.reserved?'已预约':(s.status==='idle'?'空闲':(s.running?'计时中':'已暂停'));
            html += `<div class="seat-card" data-seat-id="${s.id}">
                <div class="seat-header"><span class="seat-name">${s.name}</span><span class="seat-status ${cls}">${txt}</span></div>
                <div class="mode-badge">${s.timerMode==='countdown'?'⏳ 倒计时':'⏱️ 正计时'}</div>
                <div class="timer-display" id="timer-${s.id}">${getTimerText(s)}</div>
                <div class="qr-section">
                    <button class="qr-toggle-btn" id="qr-toggle-${s.id}" data-qr-toggle="${s.id}">📱 显示二维码</button>
                    <div class="qr-content" id="qr-content-${s.id}">
                        <div class="qr-code" id="qrcode-${s.id}"></div>
                        <div class="qr-url">?seat=${s.id}</div>
                    </div>
                </div>
                <div class="seat-actions">
                    <button class="btn btn-sm" data-action="start" data-id="${s.id}">▶</button>
                    <button class="btn btn-sm" data-action="pause" data-id="${s.id}">⏸</button>
                    <button class="btn btn-sm" data-action="end" data-id="${s.id}">⏹</button>
                    <button class="btn btn-sm" data-action="reset" data-id="${s.id}">↺</button>
                </div>
                <div class="seat-actions">
                    <button class="btn btn-sm" data-action="openTable" data-id="${s.id}">开台</button>
                    <button class="btn btn-sm" data-action="reserve" data-id="${s.id}">预约</button>
                    <button class="btn btn-sm" data-action="toggleMode" data-id="${s.id}">切换</button>
                    <button class="btn btn-sm btn-primary" data-action="customCountdown" data-id="${s.id}">✨</button>
                </div>
                <input type="text" class="notes-input" placeholder="备注" data-id="${s.id}" value="${s.notes||''}">
                ${s.reserved && s.reservation?`<div class="reservation-info"><span>📅 ${s.reservation.name} ${s.reservation.contact}</span><button style="background:none;border:none;" data-action="cancelReserve" data-id="${s.id}">✕</button></div>`:'<div style="display:none;"></div>'}
            </div>`;
        });
        $('seatsContainer').innerHTML = html;
        updateStats(); applyFilter(); $('seatCountDisplay').textContent = seats.length;
    }

    function updateStats() { $('statAll').textContent=seats.length; $('statActive').textContent=seats.filter(s=>s.status==='active'&&!s.reserved).length; $('statReserved').textContent=seats.filter(s=>s.reserved).length; $('statIdle').textContent=seats.filter(s=>s.status==='idle'&&!s.reserved).length; }
    function applyFilter() { document.querySelectorAll('.seat-card').forEach(c=>{ const s=seats.find(s=>s.id===parseInt(c.dataset.seatId)); if(!s)return; let show=true; if(currentFilter==='active') show=s.status==='active'&&!s.reserved; else if(currentFilter==='reserved') show=s.reserved; else if(currentFilter==='idle') show=s.status==='idle'&&!s.reserved; c.classList.toggle('hidden',!show); }); }
    function refreshUI() { saveSeats(); seats.forEach(s=>{ const el=$(`timer-${s.id}`); if(el) el.textContent=getTimerText(s); }); updateStats(); if(currentView==='customer'&&customerSeatId) renderCustomerView(); }
    
    function renderCustomerView() { 
        const s=seats.find(s=>s.id===customerSeatId); 
        if(!s){$('customerSeatName').textContent='座位不存在';return;} 
        $('customerSeatName').textContent=s.name; 
        $('customerTimerDisplay').textContent=getTimerText(s); 
        $('customerStatusBadge').textContent=s.reserved?'📅 已预约':(s.status==='active'?(s.running?'🟢 使用中':'⏸️ 暂停'):'⚪ 空闲'); 
        $('customerNoteDisplay').textContent=s.notes||'暂无备注';
        const resEl = $('customerReservationInfo');
        if(s.reserved && s.reservation) {
            resEl.innerHTML = `<div style="background:#f0e6f5; border-radius:16px; padding:10px;">预约人：${s.reservation.name}<br>联系方式：${s.reservation.contact}</div>`;
        } else { resEl.innerHTML = ''; }
    }

    function showRecords(d) { const date=d||new Date().toISOString().split('T')[0]; $('recordDateInput').value=date; const rec=usageRecords.filter(r=>r.timestamp.startsWith(date)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)); $('recordsList').innerHTML=rec.length?rec.map(r=>`<div style="padding:8px;border-bottom:1px solid #ddd;"><strong>${r.seatName}</strong> ${r.action} ${r.duration}<br><span style="color:#999;">${r.notes||''}</span></div>`).join(''):'<div style="text-align:center;padding:20px;">暂无记录</div>'; }
    function exportExcel(d) { const date=d||new Date().toISOString().split('T')[0]; const data=[['座位','操作','时长','备注','时间']]; usageRecords.filter(r=>r.timestamp.startsWith(date)).forEach(r=>data.push([r.seatName,r.action,r.duration,r.notes||'',new Date(r.timestamp).toLocaleString()])); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'记录'); XLSX.writeFile(wb,`记录_${date}.xlsx`); showToast('✅ 导出成功'); }

    function detectView() { const p=new URLSearchParams(window.location.search); const seat=p.get('seat'); if(seat&&!isNaN(parseInt(seat))){ currentView='customer'; customerSeatId=parseInt(seat); $('adminView').classList.add('hidden'); $('customerView').classList.remove('hidden'); renderCustomerView(); } else { currentView='admin'; $('adminView').classList.remove('hidden'); $('customerView').classList.add('hidden'); renderAdminGrid(); } }

    function setupEvents() {
        $('seatsContainer').addEventListener('click', e => {
            const toggle = e.target.closest('[data-qr-toggle]'); if(toggle){ const id=parseInt(toggle.dataset.qrToggle); toggleQRCode(id, !$(`qr-content-${id}`).classList.contains('show')); return; }
            const btn = e.target.closest('[data-action]'); if(btn){ const a=btn.dataset.action, id=parseInt(btn.dataset.id);
                if(a==='start') actionStart(id); else if(a==='pause') actionPause(id); else if(a==='end') actionEnd(id); else if(a==='reset') actionReset(id);
                else if(a==='openTable') actionOpenTable(id); else if(a==='reserve'){ pendingReserveSeatId=id; $('reserveNameInput').value=''; $('reserveContactInput').value=''; $('reservationModal').classList.remove('hidden'); }
                else if(a==='cancelReserve'){ const idx=getSeatIndex(id); if(idx!==-1){ seats[idx].reserved=false; seats[idx].reservation=null; refreshUI(); } }
                else if(a==='toggleMode') actionToggleMode(id); else if(a==='customCountdown'){ pendingCustomSeatId=id; $('customMinutesInput').value='60'; $('customTimeModal').classList.remove('hidden'); }
            }
        });
        document.querySelectorAll('.stat-card').forEach(c=>c.addEventListener('click',()=>{ currentFilter=c.dataset.filter; document.querySelectorAll('.stat-card').forEach(x=>x.classList.remove('active')); c.classList.add('active'); applyFilter(); }));
        $('addSeatBtn').addEventListener('click',()=>{ seats.push(createDefaultSeat(Math.max(...seats.map(s=>s.id))+1)); saveSeats(); renderAdminGrid(); });
        $('removeSeatBtn').addEventListener('click',()=>{ if(seats.length>1){ seats.pop(); saveSeats(); renderAdminGrid(); } });
        $('saveAllNotesBtn').addEventListener('click',()=>{ document.querySelectorAll('.notes-input').forEach(i=>{ const idx=getSeatIndex(parseInt(i.dataset.id)); if(idx!==-1) seats[idx].notes=i.value; }); saveSeats(); showToast('✅ 已保存'); });
        $('resetAllIdleBtn').addEventListener('click',()=>{ seats.forEach(s=>{ stopRunning(s); s.status='idle'; s.reserved=false; s.accumulatedSeconds=0; }); saveSeats(); renderAdminGrid(); });
        $('viewRecordsBtn').addEventListener('click',()=>{ showRecords(new Date().toISOString().split('T')[0]); $('recordsModal').classList.remove('hidden'); });
        $('closeRecordsBtn').addEventListener('click',()=>$('recordsModal').classList.add('hidden'));
        $('loadRecordsBtn').addEventListener('click',()=>{ if($('recordDateInput').value) showRecords($('recordDateInput').value); });
        $('exportRecordsBtn').addEventListener('click',()=>exportExcel(new Date().toISOString().split('T')[0]));
        $('exportDayRecordsBtn').addEventListener('click',()=>{ exportExcel($('recordDateInput').value); $('recordsModal').classList.add('hidden'); });
        $('cancelCustomBtn').addEventListener('click',()=>$('customTimeModal').classList.add('hidden'));
        $('confirmCustomBtn').addEventListener('click',()=>{ const m=parseFloat($('customMinutesInput').value); if(m>0&&pendingCustomSeatId){ const idx=getSeatIndex(pendingCustomSeatId); if(idx!==-1){ stopRunning(seats[idx]); seats[idx].countdownInitial=Math.floor(m*60); seats[idx].timerMode='countdown'; seats[idx].accumulatedSeconds=0; refreshUI(); } } $('customTimeModal').classList.add('hidden'); });
        $('cancelReserveBtn').addEventListener('click',()=>$('reservationModal').classList.add('hidden'));
        $('confirmReserveBtn').addEventListener('click',()=>{ const n=$('reserveNameInput').value.trim(); if(n&&pendingReserveSeatId){ const idx=getSeatIndex(pendingReserveSeatId); if(idx!==-1){ seats[idx].reserved=true; seats[idx].status='idle'; seats[idx].reservation={name:n,contact:$('reserveContactInput').value.trim()||'未填写'}; refreshUI(); showToast(`✅ 已预约给 ${n}`); } } $('reservationModal').classList.add('hidden'); });
        document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.add('hidden'); }));
    }

    loadSeats(); loadRecords(); detectView(); setupEvents();
    
    // 核心：全局定时器，每200ms更新一次所有计时显示
    globalTimer = setInterval(() => { 
        seats.forEach(s=>{ 
            const el = $(`timer-${s.id}`); 
            if(el) el.textContent = getTimerText(s); 
        }); 
        updateStats();
        if(currentView === 'customer' && customerSeatId){ 
            const s = seats.find(s => s.id === customerSeatId); 
            if(s) {
                $('customerTimerDisplay').textContent = getTimerText(s);
                $('customerStatusBadge').textContent = s.reserved?'📅 已预约':(s.status==='active'?(s.running?'🟢 使用中':'⏸️ 暂停'):'⚪ 空闲');
            }
        } 
    }, 200);
})();
</script>
</body>
</html>
