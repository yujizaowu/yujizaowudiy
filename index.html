<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f7f5f2;
            color: #2e241f;
            padding: 12px;
            min-height: 100vh;
        }
        .app { max-width: 1800px; margin: 0 auto; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .shop-name {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #3b2b24;
            border-left: 4px solid #b28b6f;
            padding-left: 14px;
        }
        .shop-name small { font-size: 0.85rem; color: #7f6a5c; margin-left: 6px; }
        .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .sync-status-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: #7f6a5c;
            margin-right: 6px;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ccc;
        }
        .sync-dot.synced { background: #4ade80; }
        .sync-dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
        .sync-dot.error { background: #f87171; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .btn {
            background: #e3d9d1;
            border: 1px solid #b8a69a;
            color: #2e241f;
            padding: 7px 12px;
            border-radius: 24px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn-primary { background: #5e4b3c; border-color: #3f3228; color: #fdf6ef; }
        .btn-success { background: #4a7c59; border-color: #3a6347; color: #fff; }
        .stats-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .stat-card {
            background: #fefcf9;
            border-radius: 20px;
            padding: 8px 18px;
            border: 1px solid #e2d6cd;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .stat-card.active { background: #5e4b3c; color: #fdf6ef; }
        .stat-number { font-size: 1.4rem; font-weight: 600; min-width: 35px; }
        .seats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .seat-card {
            background: #fefcf9;
            border-radius: 14px;
            padding: 12px;
            border: 1px solid #e2d6cd;
        }
        .seat-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .seat-name { font-weight: 700; font-size: 1rem; }
        .seat-status {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 20px;
            background: #ede6df;
        }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-idle { background: #e5dfd9; }
        .timer-display {
            font-family: monospace;
            font-size: 1.4rem;
            text-align: center;
            margin: 6px 0;
            background: #f3ede7;
            padding: 5px 0;
            border-radius: 10px;
        }
        .mode-badge {
            font-size: 0.6rem;
            background: #cfc1b6;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            margin: 0 auto 5px;
            text-align: center;
        }
        .seat-actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
        .seat-actions .btn { flex: 1 0 35px; padding: 4px 2px; font-size: 0.6rem; }
        .notes-selector-wrapper {
            margin-top: 6px;
            border-top: 1px dashed #d6c9bf;
            padding-top: 6px;
        }
        .custom-select-wrapper { position: relative; }
        .notes-select {
            width: 100%;
            padding: 5px 20px 5px 8px;
            border: 1px solid #d6c9bf;
            border-radius: 16px;
            font-size: 0.65rem;
            background: #fffbf8;
            appearance: none;
        }
        .select-arrow {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f6a5c;
            font-size: 0.7rem;
        }
        .current-note-display {
            margin-top: 4px;
            font-size: 0.55rem;
            color: #5e4b3c;
            padding: 2px 5px;
            background: #f4ede6;
            border-radius: 10px;
        }
        .toast-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #3b2b24;
            color: #f0e4da;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast-message.show { opacity: 1; }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.hidden { display: none !important; }
        .modal {
            background: #fefcf9;
            border-radius: 24px;
            padding: 20px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { margin-bottom: 16px; color: #3b2b24; }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { display: block; margin-bottom: 5px; color: #5f4e43; }
        .modal-input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d6c9bf;
            border-radius: 20px;
            background: #fffbf8;
        }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 14px 0;
        }
        .payment-option {
            padding: 12px 8px;
            border: 2px solid #d6c9bf;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
        }
        .payment-option.selected {
            border-color: #5e4b3c;
            background: #5e4b3c;
            color: #fdf6ef;
        }
        .payment-option .payment-icon { font-size: 1.4rem; }
        .gist-help {
            background: #f4ede6;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.75rem;
        }
        .gist-help a { color: #5e4b3c; font-weight: 600; }
        .proxy-selector {
            margin-bottom: 16px;
        }
        .proxy-selector select {
            width: 100%;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #d6c9bf;
            background: #fffbf8;
        }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    
    <div id="adminView">
        <div class="header">
            <div class="shop-name">
                <span id="mainShopName">与己造物</span> 
                <small>· 手作时光</small>
            </div>
            <div class="admin-actions">
                <div class="sync-status-badge">
                    <span class="sync-dot" id="syncDot"></span>
                    <span id="syncText">本地</span>
                </div>
                <button class="btn" id="syncNowBtn" title="手动同步">🔄</button>
                <button class="btn" id="cloudSetupBtn" title="云同步设置">☁️</button>
                <button class="btn" id="addSeatBtn">+座位</button>
                <button class="btn" id="removeSeatBtn">-座位</button>
                <span id="seatCountDisplay">36</span>
                <button class="btn btn-primary" id="resetAllIdleBtn">全部空闲</button>
                <button class="btn btn-success" id="viewRecordsBtn">记录</button>
                <button class="btn btn-success" id="exportRecordsBtn">导出</button>
            </div>
        </div>
        
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all">
                <span class="stat-number" id="statAll">0</span><span>全部</span>
            </div>
            <div class="stat-card" data-filter="active">
                <span class="stat-number" id="statActive">0</span><span>使用中</span>
            </div>
            <div class="stat-card" data-filter="reserved">
                <span class="stat-number" id="statReserved">0</span><span>已预约</span>
            </div>
            <div class="stat-card" data-filter="idle">
                <span class="stat-number" id="statIdle">0</span><span>空闲</span>
            </div>
        </div>
        
        <div id="seatsContainer" class="seats-grid"></div>
        
        <div class="footer-note" style="margin-top:16px;text-align:center;color:#a28d7e;font-size:0.7rem;">
            <p>点击「开台」开始计时 · 结束必须选择收款方式</p>
        </div>
    </div>

    <!-- 云设置弹窗 -->
    <div id="cloudSetupModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>☁️ 云端同步设置</h3>
            
            <!-- 代理选择 -->
            <div class="proxy-selector">
                <label style="display:block;margin-bottom:5px;">🌐 网络代理（解决连接失败）</label>
                <select id="proxySelect">
                    <option value="direct">直连（可能失败）</option>
                    <option value="corsproxy">CORS 代理 1</option>
                    <option value="allorigins">CORS 代理 2</option>
                    <option value="jsdelivr">jsDelivr CDN</option>
                </select>
            </div>
            
            <div class="gist-help">
                👉 <a href="https://gist.github.com/" target="_blank">点击创建 Gist</a>，复制网址末尾32位字符<br>
                如果直连失败，请尝试切换上面的代理
            </div>
            <div class="modal-input-group">
                <label>Gist ID</label>
                <input type="text" id="gistIdInput" placeholder="粘贴32位 Gist ID">
            </div>
            <div class="modal-actions">
                <button class="btn" id="testCloudBtn">测试连接</button>
                <button class="btn" id="pullCloudBtn">⬇️ 拉取</button>
                <button class="btn" id="pushCloudBtn">⬆️ 上传</button>
                <button class="btn" id="closeCloudBtn">关闭</button>
                <button class="btn btn-primary" id="saveCloudBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 收款弹窗 -->
    <div id="paymentModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>💰 选择收款方式</h3>
            <div id="paymentSeatInfo" style="margin-bottom:12px;"></div>
            <div class="payment-methods">
                <div class="payment-option" data-payment="抖音团购">
                    <div class="payment-icon">🎵</div>
                    <div>抖音团购</div>
                </div>
                <div class="payment-option" data-payment="美团团购">
                    <div class="payment-icon">🍔</div>
                    <div>美团团购</div>
                </div>
                <div class="payment-option" data-payment="支付宝">
                    <div class="payment-icon">💙</div>
                    <div>支付宝</div>
                </div>
                <div class="payment-option" data-payment="微信">
                    <div class="payment-icon">💚</div>
                    <div>微信</div>
                </div>
            </div>
            <div style="text-align:center;color:#999;font-size:0.75rem;margin-top:8px;">👆 请选择一种收款方式</div>
            <div class="modal-actions">
                <button class="btn" id="cancelPaymentBtn">取消</button>
                <button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button>
            </div>
        </div>
    </div>

    <!-- 记录弹窗 -->
    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>使用记录</h3>
            <div id="recordsList" style="max-height:300px;overflow-y:auto;"></div>
            <div class="modal-actions">
                <button class="btn" id="closeRecordsBtn">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    "use strict";
    
    const STORAGE_KEY = 'yujizaowu_seats_v9';
    const GIST_CONFIG_KEY = 'yujizaowu_gist_config';
    const DEFAULT_SEAT_COUNT = 12;
    
    const NOTE_OPTIONS = ['', '抖音全天', '美团全天', '抖音小时', '美团小时', '__custom__'];
    const NOTE_LABELS = {
        '': '无备注',
        '抖音全天': '抖音全天',
        '美团全天': '美团全天', 
        '抖音小时': '抖音小时',
        '美团小时': '美团小时',
        '__custom__': '✨ 自定义'
    };
    
    let seats = [];
    let usageRecords = [];
    let globalTimer = null;
    let pendingEndSeatId = null;
    let selectedPayment = null;
    let currentFilter = 'all';
    
    let gistConfig = { gistId: '' };
    let syncStatus = 'local';
    let proxyType = 'direct';

    const $ = id => document.getElementById(id);
    const toastEl = $('toast');

    function showToast(msg, duration = 1500) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    function updateSyncUI() {
        const dot = $('syncDot');
        const text = $('syncText');
        dot.className = 'sync-dot';
        if (syncStatus === 'synced') {
            dot.classList.add('synced');
            text.textContent = '已同步';
        } else if (syncStatus === 'syncing') {
            dot.classList.add('syncing');
            text.textContent = '同步中';
        } else if (syncStatus === 'error') {
            dot.classList.add('error');
            text.textContent = '失败';
        } else {
            text.textContent = gistConfig.gistId ? '已配置' : '本地';
        }
    }

    // 获取代理 URL
    function getProxyUrl(originalUrl) {
        switch (proxyType) {
            case 'corsproxy':
                return 'https://corsproxy.io/?' + encodeURIComponent(originalUrl);
            case 'allorigins':
                return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(originalUrl);
            case 'jsdelivr':
                // 对于 Gist，可以用 jsDelivr
                if (originalUrl.includes('api.github.com/gists/')) {
                    const gistId = originalUrl.split('/').pop();
                    return `https://cdn.jsdelivr.net/gh/gist/${gistId}/seats.json`;
                }
                return originalUrl;
            default:
                return originalUrl;
        }
    }

    async function fetchWithProxy(url, options = {}) {
        const proxyUrl = getProxyUrl(url);
        console.log('请求 URL:', proxyUrl);
        
        try {
            const response = await fetch(proxyUrl, options);
            return response;
        } catch (e) {
            // 如果代理失败，尝试直连
            if (proxyType !== 'direct') {
                console.log('代理失败，尝试直连');
                return fetch(url, options);
            }
            throw e;
        }
    }

    async function pullFromCloud() {
        if (!gistConfig.gistId) {
            showToast('⚠️ 请先配置 Gist ID');
            return null;
        }
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            const url = `https://api.github.com/gists/${gistConfig.gistId}`;
            const response = await fetchWithProxy(url);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const gist = await response.json();
            const files = gist.files || {};
            
            if (files['seats.json']?.content) {
                const cloudSeats = JSON.parse(files['seats.json'].content);
                seats = cloudSeats;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                renderAdminGrid();
                syncStatus = 'synced';
                showToast('✅ 拉取成功');
            } else {
                syncStatus = 'synced';
                showToast('ℹ️ 云端暂无数据');
            }
            
            updateSyncUI();
            return true;
        } catch (e) {
            console.error('拉取失败:', e);
            syncStatus = 'error';
            updateSyncUI();
            showToast('❌ 拉取失败: ' + e.message);
            return null;
        }
    }

    async function pushToCloud() {
        if (!gistConfig.gistId) {
            showToast('⚠️ 请先配置 Gist ID');
            return false;
        }
        
        syncStatus = 'syncing';
        updateSyncUI();
        
        try {
            const url = `https://api.github.com/gists/${gistConfig.gistId}`;
            
            // 推送到 Gist 不能用 CDN 代理，必须用支持 POST 的代理
            let fetchUrl = url;
            let fetchOptions = {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    files: { 'seats.json': { content: JSON.stringify(seats) } }
                })
            };
            
            if (proxyType === 'corsproxy') {
                fetchUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
            } else if (proxyType === 'allorigins') {
                // allorigins 不支持 POST，降级到直连
                fetchUrl = url;
            }
            
            const response = await fetch(fetchUrl, fetchOptions);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            syncStatus = 'synced';
            updateSyncUI();
            showToast('✅ 上传成功');
            return true;
        } catch (e) {
            console.error('上传失败:', e);
            syncStatus = 'error';
            updateSyncUI();
            showToast('❌ 上传失败: ' + e.message);
            return false;
        }
    }

    async function testConnection() {
        const gistId = $('gistIdInput').value.trim();
        if (!gistId) {
            showToast('⚠️ 请输入 Gist ID');
            return;
        }
        
        showToast('🔄 测试中...');
        
        try {
            const url = `https://api.github.com/gists/${gistId}`;
            const response = await fetchWithProxy(url);
            
            if (response.ok) {
                showToast('✅ 连接成功');
            } else {
                showToast('❌ Gist 不存在');
            }
        } catch (e) {
            showToast('❌ 网络错误，尝试切换代理');
        }
    }

    function createDefaultSeat(id) {
        return {
            id, name: id + '号桌', status: 'idle', timerMode: 'countup',
            countdownInitial: 3600, accumulatedSeconds: 0, running: false,
            startTimestamp: null, notes: '', customNoteValue: '', reserved: false
        };
    }

    function loadSeats() {
        try { 
            const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (Array.isArray(parsed) && parsed.length) { 
                seats = parsed; 
                return; 
            }
        } catch(e) {}
        seats = Array.from({length: DEFAULT_SEAT_COUNT}, (_, i) => createDefaultSeat(i+1));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
    }
    
    function getSeatIndex(id) { return seats.findIndex(s => s.id === id); }

    function getCurrentSeconds(seat) {
        let base = seat.accumulatedSeconds || 0;
        if (seat.running && seat.startTimestamp) base += (Date.now() - seat.startTimestamp) / 1000;
        return base;
    }

    function formatTime(s) {
        s = Math.max(0, s);
        const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
        return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
    }

    function getTimerText(seat) {
        if (seat.timerMode === 'countdown') return formatTime(Math.max(0, seat.countdownInitial - getCurrentSeconds(seat)));
        return formatTime(getCurrentSeconds(seat));
    }

    function stopRunning(seat) {
        if (seat.running && seat.startTimestamp) {
            seat.accumulatedSeconds += (Date.now() - seat.startTimestamp) / 1000;
            seat.running = false;
            seat.startTimestamp = null;
        }
    }

    function actionOpenTable(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.status = 'active'; seat.reserved = false;
        seat.accumulatedSeconds = 0; seat.running = false;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`✅ ${seat.name} 已开台`);
    }

    function actionStart(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (seat.status === 'idle') { showToast('⚠️ 请先开台'); return; }
        if (seat.running) return;
        seat.running = true; seat.startTimestamp = Date.now(); seat.status = 'active';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function actionPause(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        stopRunning(seats[idx]); 
        seats[idx].status = 'paused';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`⏸️ ${seats[idx].name} 已暂停`);
    }

    function actionEndWithPayment(seatId, paymentMethod) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        const duration = formatTime(seat.accumulatedSeconds);
        usageRecords.push({
            id: Date.now(),
            seatName: seat.name,
            duration,
            paymentMethod,
            timestamp: new Date().toISOString()
        });
        seat.status = 'idle'; seat.reserved = false;
        seat.accumulatedSeconds = 0; seat.notes = ''; seat.customNoteValue = '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
        showToast(`✅ ${seat.name} 结束 ${duration} · ${paymentMethod}`);
    }

    function actionReset(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat); 
        seat.accumulatedSeconds = 0;
        seat.notes = ''; seat.customNoteValue = '';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid(); 
        showToast(`🔄 ${seat.name} 已重置`);
    }

    function actionToggleMode(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        stopRunning(seat);
        seat.timerMode = seat.timerMode === 'countup' ? 'countdown' : 'countup';
        seat.accumulatedSeconds = 0;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function getEffectiveNote(seat) {
        if (seat.notes === '__custom__') return seat.customNoteValue || '';
        return seat.notes || '';
    }

    function handleNoteSelect(seatId, value) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        if (value === '__custom__') {
            seat.notes = '__custom__';
        } else {
            seat.notes = value;
            seat.customNoteValue = '';
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
        renderAdminGrid();
    }

    function showPaymentModal(seatId) {
        const idx = getSeatIndex(seatId);
        if (idx === -1) return;
        const seat = seats[idx];
        pendingEndSeatId = seatId;
        selectedPayment = null;
        $('paymentSeatInfo').textContent = `${seat.name} · ${formatTime(getCurrentSeconds(seat))}`;
        document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
        $('confirmPaymentBtn').disabled = true;
        $('paymentModal').classList.remove('hidden');
    }

    function renderAdminGrid() {
        let html = '';
        seats.forEach(seat => {
            const statusClass = seat.reserved ? 'status-reserved' : 
                (seat.status === 'active' ? (seat.running ? 'status-active' : 'status-paused') : 
                (seat.status === 'paused' ? 'status-paused' : 'status-idle'));
            const statusText = seat.reserved ? '预约' : 
                (seat.status === 'idle' ? '空闲' : (seat.running ? '计时中' : '暂停'));
            
            const currentNoteValue = seat.notes || '';
            const effectiveNote = getEffectiveNote(seat);
            
            const optionsHtml = NOTE_OPTIONS.map(opt => {
                const selected = currentNoteValue === opt ? 'selected' : '';
                return `<option value="${opt}" ${selected}>${NOTE_LABELS[opt]}</option>`;
            }).join('');
            
            html += `
                <div class="seat-card" data-seat-id="${seat.id}">
                    <div class="seat-header">
                        <span class="seat-name">${seat.name}</span>
                        <span class="seat-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="mode-badge">${seat.timerMode === 'countdown' ? '倒计时' : '正计时'}</div>
                    <div class="timer-display" id="timer-${seat.id}">${getTimerText(seat)}</div>
                    <div class="seat-actions">
                        <button class="btn" data-action="start" data-id="${seat.id}">开始</button>
                        <button class="btn" data-action="pause" data-id="${seat.id}">暂停</button>
                        <button class="btn" data-action="end" data-id="${seat.id}">结束</button>
                        <button class="btn" data-action="reset" data-id="${seat.id}">重置</button>
                    </div>
                    <div class="seat-actions">
                        <button class="btn" data-action="openTable" data-id="${seat.id}">开台</button>
                        <button class="btn" data-action="toggleMode" data-id="${seat.id}">切换</button>
                        <button class="btn btn-primary" data-action="customCountdown" data-id="${seat.id}">倒计时</button>
                    </div>
                    
                    <div class="notes-selector-wrapper">
                        <div class="custom-select-wrapper">
                            <select class="notes-select" data-action="noteSelect" data-id="${seat.id}">
                                ${optionsHtml}
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                        ${effectiveNote ? `<div class="current-note-display">📋 ${effectiveNote}</div>` : ''}
                    </div>
                </div>
            `;
        });
        $('seatsContainer').innerHTML = html;
        updateStats();
        $('seatCountDisplay').textContent = seats.length;
    }

    function updateStats() {
        $('statAll').textContent = seats.length;
        $('statActive').textContent = seats.filter(s => s.status === 'active' && !s.reserved).length;
        $('statReserved').textContent = seats.filter(s => s.reserved).length;
        $('statIdle').textContent = seats.filter(s => s.status === 'idle' && !s.reserved).length;
    }

    function setupEvents() {
        $('cloudSetupBtn').onclick = () => {
            $('gistIdInput').value = gistConfig.gistId || '';
            $('cloudSetupModal').classList.remove('hidden');
        };
        
        $('closeCloudBtn').onclick = () => $('cloudSetupModal').classList.add('hidden');
        
        $('proxySelect').onchange = (e) => {
            proxyType = e.target.value;
            localStorage.setItem('proxy_type', proxyType);
        };
        
        // 加载代理设置
        const savedProxy = localStorage.getItem('proxy_type');
        if (savedProxy) {
            proxyType = savedProxy;
            $('proxySelect').value = savedProxy;
        }
        
        $('testCloudBtn').onclick = testConnection;
        $('pullCloudBtn').onclick = pullFromCloud;
        $('pushCloudBtn').onclick = pushToCloud;
        
        $('saveCloudBtn').onclick = () => {
            const gistId = $('gistIdInput').value.trim();
            if (gistId) {
                gistConfig.gistId = gistId;
                localStorage.setItem(GIST_CONFIG_KEY, JSON.stringify(gistConfig));
                updateSyncUI();
                showToast('✅ 配置已保存');
                $('cloudSetupModal').classList.add('hidden');
            }
        };
        
        $('syncNowBtn').onclick = pullFromCloud;
        
        $('seatsContainer').onclick = e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.dataset.action, seatId = parseInt(btn.dataset.id);
            
            if (action === 'start') actionStart(seatId);
            else if (action === 'pause') actionPause(seatId);
            else if (action === 'end') showPaymentModal(seatId);
            else if (action === 'reset') actionReset(seatId);
            else if (action === 'openTable') actionOpenTable(seatId);
            else if (action === 'toggleMode') actionToggleMode(seatId);
            else if (action === 'customCountdown') { 
                const m = prompt('输入倒计时分钟数:', '60');
                if (m) {
                    const idx = getSeatIndex(seatId); 
                    if(idx!==-1){ 
                        seats[idx].countdownInitial = Math.floor(parseFloat(m)*60); 
                        seats[idx].timerMode='countdown'; 
                        seats[idx].accumulatedSeconds=0; 
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                        renderAdminGrid(); 
                    }
                }
            }
        };

        $('seatsContainer').onchange = e => {
            if (e.target.classList.contains('notes-select')) {
                handleNoteSelect(parseInt(e.target.dataset.id), e.target.value);
            }
        };

        document.querySelectorAll('.payment-option').forEach(opt => {
            opt.onclick = () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                selectedPayment = opt.dataset.payment;
                $('confirmPaymentBtn').disabled = false;
            };
        });

        $('confirmPaymentBtn').onclick = () => {
            if (pendingEndSeatId && selectedPayment) {
                actionEndWithPayment(pendingEndSeatId, selectedPayment);
                $('paymentModal').classList.add('hidden');
            }
        };

        $('cancelPaymentBtn').onclick = () => {
            $('paymentModal').classList.add('hidden');
        };

        $('addSeatBtn').onclick = () => { 
            const newId = Math.max(...seats.map(s=>s.id)) + 1;
            seats.push(createDefaultSeat(newId)); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
            renderAdminGrid(); 
        };
        
        $('removeSeatBtn').onclick = () => { 
            if(seats.length>1) { 
                seats.pop(); 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                renderAdminGrid(); 
            }
        };
        
        $('resetAllIdleBtn').onclick = () => { 
            seats.forEach(s => { 
                stopRunning(s); 
                s.status='idle'; 
                s.reserved=false; 
                s.accumulatedSeconds=0;
            }); 
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
            renderAdminGrid(); 
        };
        
        $('viewRecordsBtn').onclick = () => { 
            const html = usageRecords.slice(0, 20).map(r => 
                `<div style="padding:8px;border-bottom:1px solid #ddd;">${r.seatName} · ${r.duration} · ${r.paymentMethod}</div>`
            ).join('');
            $('recordsList').innerHTML = html || '<div>暂无记录</div>';
            $('recordsModal').classList.remove('hidden'); 
        };
        
        $('closeRecordsBtn').onclick = () => $('recordsModal').classList.add('hidden');
        
        $('exportRecordsBtn').onclick = () => {
            const data = [['座位','时长','收款方式','时间']];
            usageRecords.forEach(r => data.push([r.seatName, r.duration, r.paymentMethod||'', r.timestamp]));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), '记录');
            XLSX.writeFile(wb, '使用记录.xlsx');
            showToast('✅ 导出成功');
        };
        
        document.querySelectorAll('.stat-card').forEach(c => c.onclick = () => {
            currentFilter = c.dataset.filter;
            document.querySelectorAll('.stat-card').forEach(x => x.classList.remove('active'));
            c.classList.add('active');
        });
        
        document.querySelectorAll('.modal-overlay').forEach(m => m.onclick = e => { 
            if(e.target===m) m.classList.add('hidden'); 
        });
    }

    // 加载配置
    try {
        const saved = JSON.parse(localStorage.getItem(GIST_CONFIG_KEY));
        if (saved) gistConfig = saved;
    } catch(e) {}
    
    loadSeats(); 
    renderAdminGrid(); 
    setupEvents();
    updateSyncUI();
    
    globalTimer = setInterval(() => {
        seats.forEach(s => { 
            const el = $(`timer-${s.id}`); 
            if(el) el.textContent = getTimerText(s); 
            if(s.timerMode==='countdown' && s.running && s.countdownInitial-getCurrentSeconds(s)<=0){ 
                s.running=false; 
                s.status='paused'; 
                localStorage.setItem(STORAGE_KEY, JSON.stringify(seats));
                renderAdminGrid(); 
            } 
        });
        updateStats();
    }, 200);
})();
</script>
</body>
</html>
