<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与己造物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: white; color: #333; padding: 20px; text-align: center; border-bottom: 1px solid #e0e0e0; }
        .header-title { font-size: 26px; font-weight: bold; letter-spacing: 6px; }
        .header-info { font-size: 12px; color: #999; margin-top: 6px; letter-spacing: 1px; }
        .header-info span { margin: 0 10px; }
        .tabs { display: flex; background: #fafafa; border-bottom: 1px solid #e0e0e0; }
        .tab-button { flex: 1; padding: 14px 20px; border: none; background: none; cursor: pointer; font-size: 15px; font-weight: bold; color: #999; transition: all 0.3s; position: relative; }
        .tab-button:hover { color: #333; background: #f5f5f5; }
        .tab-button.active { color: #333; background: white; }
        .tab-button.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #333; }
        .tab-content { display: none; padding: 25px; min-height: 600px; background: white; }
        .tab-content.active { display: block; }
        .reservation-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .form-section { background: #fafafa; padding: 25px; border-radius: 12px; border: 1px solid #e0e0e0; }
        .form-title { font-size: 20px; color: #333; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: #666; font-weight: bold; font-size: 13px; }
        .form-group label .optional { color: #999; font-weight: normal; font-size: 11px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; color: #333; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #333; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .custom-remark-input { margin-top: 6px; display: none; }
        .custom-remark-input.show { display: block; }
        .btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.3s; background: white; color: #333; }
        .btn:hover { background: #f5f5f5; border-color: #333; }
        .btn-primary { background: #333; color: white; border-color: #333; }
        .btn-primary:hover { background: #555; border-color: #555; }
        .btn-danger { color: #e74c3c; border-color: #e74c3c; }
        .btn-danger:hover { background: #e74c3c; color: white; }
        .btn-warning { color: #f39c12; border-color: #f39c12; }
        .btn-success { color: #27ae60; border-color: #27ae60; }
        .btn-info { color: #2980b9; border-color: #2980b9; }
        .btn-dark { background: #333; color: white; border-color: #333; }
        .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 4px; }
        .btn-sm { padding: 5px 10px; font-size: 10px; border-radius: 4px; }
        .btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .reservation-list { background: #fafafa; padding: 20px; border-radius: 12px; overflow-y: auto; max-height: 600px; border: 1px solid #e0e0e0; }
        .reservation-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .reservation-date-group { margin-bottom: 20px; }
        .date-header { background: white; color: #333; padding: 10px 16px; border-radius: 6px; margin-bottom: 12px; font-weight: bold; font-size: 14px; border: 1px solid #e0e0e0; }
        .reservation-item { background: white; padding: 14px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e0e0; font-size: 13px; }
        .reservation-info div { margin-bottom: 4px; color: #666; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #f0f0f0; color: #333; }
        .badge-meituan { background: #FFD100; color: #333; }
        .badge-douyin { background: #000; color: #fff; }
        .badge-kuaishou { background: #FF4906; color: #fff; }
        .badge-xiaohongshu { background: #FE2C55; color: #fff; }
        .badge-xianxia { background: #27ae60; color: #fff; }
        .badge-custom { background: #3498db; color: #fff; }
        .timer-layout { display: flex; flex-direction: column; gap: 15px; }
        .top-bar { background: #fafafa; padding: 8px 12px; border-radius: 6px; display: flex; gap: 8px; align-items: center; border: 1px solid #e0e0e0; flex-wrap: wrap; }
        .top-bar input { padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; background: white; font-size: 12px; }
        .top-bar input:focus { outline: none; border-color: #333; }
        .search-input { width: 120px; }
        .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 5px 12px; border: 1px solid #ddd; border-radius: 15px; font-size: 12px; cursor: pointer; transition: all 0.3s; background: white; color: #666; }
        .filter-btn:hover { border-color: #333; color: #333; }
        .filter-btn.active { background: #333; color: white; border-color: #333; }
        .filter-count { font-size: 11px; color: #999; margin-left: 2px; }
        .filter-btn.active .filter-count { color: #ddd; }
        .search-clear { cursor: pointer; color: #999; font-size: 14px; margin-left: -25px; z-index: 1; background: none; border: none; display: none; }
        .position-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 10px; max-height: 650px; overflow-y: auto; }
        .position-card { background: white; border-radius: 8px; padding: 10px; border: 1px solid #e0e0e0; position: relative; }
        .position-card.highlight { border-color: #333; box-shadow: 0 0 12px rgba(0,0,0,0.15); }
        .position-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #f0f0f0; }
        .position-name { font-size: 14px; font-weight: bold; color: #333; }
        .status-lights { display: flex; gap: 4px; }
        .status-light { width: 8px; height: 8px; border-radius: 50%; background: #e0e0e0; border: 1px solid #ccc; }
        .light-green.active { background: #27ae60; border-color: #27ae60; box-shadow: 0 0 6px rgba(39,174,96,0.4); }
        .light-yellow.active { background: #f39c12; border-color: #f39c12; box-shadow: 0 0 6px rgba(243,156,18,0.4); }
        .light-red.active { background: #e74c3c; border-color: #e74c3c; box-shadow: 0 0 6px rgba(231,76,60,0.4); animation: blink 1s infinite; }
        .light-blue.active { background: #3498db; border-color: #3498db; box-shadow: 0 0 6px rgba(52,152,219,0.4); }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        .position-start-time { font-size: 11px; color: #999; text-align: center; margin-bottom: 2px; }
        .position-timer-display { font-size: 22px; font-weight: bold; text-align: center; color: #333; font-family: 'Courier New',monospace; margin: 4px 0; padding: 6px; background: #fafafa; border-radius: 5px; border: 1px solid #e0e0e0; }
        .position-info-item { margin-bottom: 5px; }
        .position-info-item label { font-size: 10px; color: #999; display: block; margin-bottom: 2px; }
        .position-remark-input, .position-mode-select, .position-countdown-input { width: 100%; padding: 4px 6px; border: 1px solid #e0e0e0; border-radius: 4px; background: white; font-size: 11px; }
        .position-mode-select:disabled, .position-countdown-input:disabled { background: #f5f5f5; color: #999; cursor: not-allowed; }
        .position-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
        .position-controls .btn { font-size: 10px; padding: 4px 2px; }
        .remark-row { display: flex; gap: 4px; align-items: center; }
        .remark-row input { flex: 1; }
        .remark-row .btn { font-size: 10px; padding: 4px 6px; white-space: nowrap; }
        .delete-position-btn { position: absolute; top: 4px; right: 6px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; z-index: 10; }
        .delete-position-btn:hover { color: #e74c3c; }
        .custom-confirm-overlay { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(3px); }
        .custom-confirm-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); padding: 30px; min-width: 360px; max-width: 90vw; text-align: center; }
        .custom-confirm-icon { font-size: 48px; margin-bottom: 16px; }
        .custom-confirm-message { font-size: 15px; color: #333; margin-bottom: 24px; line-height: 1.6; white-space: pre-line; }
        .custom-confirm-buttons { display: flex; gap: 12px; justify-content: center; }
        .custom-confirm-buttons .btn { min-width: 100px; }
        .payment-options { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin: 20px 0; }
        .payment-option { padding: 12px 8px; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; text-align: center; }
        .payment-option:hover { border-color: #333; background: #fafafa; }
        .payment-option.selected { border-color: #333; background: #f5f5f5; }
        .payment-icon { font-size: 28px; display: block; margin-bottom: 4px; }
        .payment-name { font-weight: bold; font-size: 12px; }
        .no-result { text-align: center; color: #999; padding: 40px; grid-column: 1/-1; }
        @media (max-width:768px) { .reservation-layout { grid-template-columns: 1fr; } .position-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">与己造物</div>
            <div class="header-info">
                <span>🕐 营业时间：9:00 - 22:00</span>
                <span>📞 电话：16653684470</span>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('reservation')">预约管理</button>
            <button class="tab-button" onclick="switchTab('timer')">计时管理</button>
        </div>
        <div id="reservationTab" class="tab-content active">
            <div class="reservation-layout">
                <div class="form-section">
                    <div class="form-title"><span>新增预约</span></div>
                    <div class="form-group"><label>姓名 <span class="optional">(选填)</span></label><input type="text" id="resName" placeholder="请输入顾客姓名（可不填）"></div>
                    <div class="form-group"><label>电话</label><input type="text" id="resPhone" placeholder="请输入联系电话"></div>
                    <div class="form-group"><label>预约时间</label><input type="datetime-local" id="resDateTime"></div>
                    <div class="form-group"><label>位置（选填）</label><select id="resPosition"><option value="不指定">不指定位置</option></select></div>
                    <div class="form-group">
                        <label>备注</label>
                        <select id="resRemark" onchange="toggleCustomRemark()">
                            <option value="美团">美团</option>
                            <option value="快手">快手</option>
                            <option value="抖音">抖音</option>
                            <option value="小红书">小红书</option>
                            <option value="自定义">自定义</option>
                        </select>
                        <input type="text" id="resCustomRemark" class="custom-remark-input" placeholder="请输入自定义备注内容">
                    </div>
                    <div class="btn-group"><button class="btn btn-primary" onclick="addReservation()">添加预约</button><button class="btn" onclick="clearForm()">清空表单</button></div>
                </div>
                <div class="reservation-list">
                    <div class="reservation-list-header"><span style="font-size:16px;font-weight:bold;">预约列表</span><button class="btn btn-xs" onclick="exportReservationsExcel()">导出Excel</button></div>
                    <div id="reservationListContent"><div style="text-align:center;color:#999;padding:50px;">暂无预约记录</div></div>
                </div>
            </div>
        </div>
        <div id="timerTab" class="tab-content">
            <div class="timer-layout">
                <div class="top-bar">
                    <input type="text" id="newPositionName" placeholder="新位置名称" style="width:110px;">
                    <button class="btn btn-info btn-xs" onclick="addNewPosition()">添加</button>
                    <span style="color:#ddd;">|</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索座位..." oninput="onSearch()">
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
                    <span style="color:#ddd;">|</span>
                    <div class="filter-bar" id="filterBar">
                        <button class="filter-btn active" data-filter="all">全部<span class="filter-count" id="countAll"></span></button>
                        <button class="filter-btn" data-filter="空闲">空闲<span class="filter-count" id="countFree"></span></button>
                        <button class="filter-btn" data-filter="使用中">使用中<span class="filter-count" id="countBusy"></span></button>
                        <button class="filter-btn" data-filter="已预约">预约中<span class="filter-count" id="countReserved"></span></button>
                    </div>
                    <span style="color:#ddd;">|</span>
                    <button class="btn btn-dark btn-xs" onclick="closeAllTables()" style="background:#c0392b;border-color:#c0392b;color:white;">一键关店</button>
                    <button class="btn btn-xs" onclick="exportAllExcel()" style="margin-left:auto;">导出</button>
                </div>
                <div class="position-grid" id="positionGrid"></div>
            </div>
        </div>
    </div>

    <div id="paymentConfirmOverlay" class="custom-confirm-overlay">
        <div class="custom-confirm-box">
            <div class="custom-confirm-icon">💳</div>
            <div class="custom-confirm-message" id="paymentConfirmMsg"></div>
            <div class="payment-options" id="paymentConfirmOptions"></div>
            <div class="custom-confirm-buttons"><button class="btn btn-primary" id="paymentConfirmBtn">确认结束</button><button class="btn" onclick="closePaymentConfirm()">取消</button></div>
        </div>
    </div>

    <div id="deleteConfirmOverlay" class="custom-confirm-overlay">
        <div class="custom-confirm-box">
            <div class="custom-confirm-icon">⚠️</div>
            <div class="custom-confirm-message" id="deleteConfirmMsg"></div>
            <div class="custom-confirm-buttons"><button class="btn btn-danger" id="deleteConfirmOkBtn">确认删除</button><button class="btn" onclick="closeDeleteConfirm()">取消</button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        let positions = {};
        let reservations = [];
        let activeTimers = {};
        let timerIntervals = {};
        let selectedPayment = null;
        let endingPosition = null;
        let deleteCallback = null;
        let currentFilter = 'all';
        let searchKeyword = '';
        const STORAGE_KEY = 'yujizaowu_data';

        function getTodayStr() { return new Date().toISOString().split('T')[0]; }
        function getReservationDate(r) { return r.time.split('T')[0]; }
        function isPositionOccupiedToday(posName) {
            if (positions[posName] && (positions[posName].status === '计时中' || positions[posName].status === '已开台' || positions[posName].status === '已暂停')) return true;
            const today = getTodayStr();
            for (const res of reservations) { if (res.position === posName && getReservationDate(res) === today) return true; }
            return false;
        }
        function getFilterStatus(posName) {
            if (positions[posName].status === '计时中' || positions[posName].status === '已开台' || positions[posName].status === '已暂停') return '使用中';
            if (positions[posName].status === '已预约') return '已预约';
            return '空闲';
        }
        function isTimerLocked(posName) { return positions[posName] && positions[posName].locked; }
        function formatStartTime(date) { if (!date) return ''; const d = new Date(date); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 开始`; }
        function formatTime(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

        function toggleCustomRemark() {
            const select = document.getElementById('resRemark');
            const customInput = document.getElementById('resCustomRemark');
            if (select.value === '自定义') { customInput.classList.add('show');
                customInput.focus(); } else { customInput.classList.remove('show');
                customInput.value = ''; }
        }
        function getBadgeClass(remark) {
            const map = { '美团': 'badge-meituan', '抖音': 'badge-douyin', '快手': 'badge-kuaishou', '小红书': 'badge-xiaohongshu', '线下': 'badge-xianxia' };
            return map[remark] || 'badge-custom';
        }

        function onSearch() { const kw = document.getElementById('searchInput').value.trim();
            searchKeyword = kw;
            document.getElementById('searchClear').style.display = kw ? 'inline' : 'none';
            renderPositionGrid(); }
        function clearSearch() { document.getElementById('searchInput').value = '';
            searchKeyword = '';
            document.getElementById('searchClear').style.display = 'none';
            renderPositionGrid(); }
        function showDeleteConfirm(msg, cb) { document.getElementById('deleteConfirmMsg').textContent = msg;
            document.getElementById('deleteConfirmOverlay').style.display = 'block';
            deleteCallback = cb; }
        function closeDeleteConfirm() { document.getElementById('deleteConfirmOverlay').style.display = 'none';
            deleteCallback = null; }

        function showPaymentConfirm(posName) {
            endingPosition = posName;
            selectedPayment = null;
            document.getElementById('paymentConfirmMsg').textContent = `${posName} - 请选择支付方式`;
            const opts = document.getElementById('paymentConfirmOptions');
            const methods = ['抖音', '快手', '美团', '微信', '支付宝'];
            const icons = { '抖音': '🎵', '快手': '📱', '美团': '🟡', '微信': '💚', '支付宝': '💙' };
            opts.innerHTML = methods.map(m => `<div class="payment-option" data-method="${m}"><span class="payment-icon">${icons[m]}</span><span class="payment-name">${m}</span></div>`).join('');
            opts.querySelectorAll('.payment-option').forEach(opt => { opt.addEventListener('click', function() { opts.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedPayment = this.dataset.method; }); });
            document.getElementById('paymentConfirmOverlay').style.display = 'block';
        }
        function closePaymentConfirm() { document.getElementById('paymentConfirmOverlay').style.display = 'none';
            endingPosition = null;
            selectedPayment = null; }

        function saveAllData() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ reservations, positions, activeTimers })); }
        function loadAllData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    reservations = data.reservations || [];
                    if (data.positions) { positions = {}; for (const k in data.positions) positions[k] = { status: data.positions[k].status || '空闲', reservation: data.positions[k].reservation || null, remark: data.positions[k].remark || '', countdownMinutes: data.positions[k].countdownMinutes || 60, timerMode: data.positions[k].timerMode || '正计时', startTime: data.positions[k].startTime || null, locked: data.positions[k].locked || false }; }
                    if (data.activeTimers) { activeTimers = {}; for (const k in data.activeTimers) { const t = data.activeTimers[k];
                            activeTimers[k] = t.running ? { ...t, running: false, paused: false, elapsed: t.elapsed || 0, locked: t.locked || false } : { ...t, running: false, paused: false, locked: t.locked || false }; } }
                    updatePositionStatuses();
                } catch (e) { for (let i = 1; i <= 36; i++) positions[`座位${i}`] = { status: '空闲', reservation: null, remark: '', countdownMinutes: 60, timerMode: '正计时', startTime: null, locked: false }; }
            }
        }
        function saveCompletionRecord(r) { let a = []; const s = localStorage.getItem('yujizaowu_completion'); if (s) a = JSON.parse(s);
            a.push(r);
            localStorage.setItem('yujizaowu_completion', JSON.stringify(a)); }

        // 备注自动保存（失焦时触发）
        function autoSaveRemark(posName) {
            const ri = document.getElementById(`remark_${posName}`);
            if (ri) {
                const v = ri.value.trim();
                if (activeTimers[posName]) activeTimers[posName].remark = v;
                positions[posName].remark = v;
                saveAllData();
            }
        }

        // 删除备注按钮
        function deleteRemark(posName) {
            const ri = document.getElementById(`remark_${posName}`);
            if (ri) { ri.value = ''; if (activeTimers[posName]) activeTimers[posName].remark = '';
                positions[posName].remark = '';
                saveAllData();
                alert('备注已清空！'); }
        }

        function openTable(posName) {
            if (isPositionOccupiedToday(posName)) { alert('已被占用！'); return; }
            positions[posName].remark = document.getElementById(`remark_${posName}`)?.value.trim() || '';
            positions[posName].countdownMinutes = parseInt(document.getElementById(`countdown_${posName}`)?.value) || 60;
            positions[posName].timerMode = document.getElementById(`mode_${posName}`)?.value || '正计时';
            positions[posName].status = '已开台';
            positions[posName].startTime = null;
            positions[posName].locked = false;
            activeTimers[posName] = { remark: positions[posName].remark, elapsed: 0, mode: positions[posName].timerMode, countdownSeconds: positions[posName].countdownMinutes * 60, running: false, paused: false, startTime: null, locked: false };
            renderPositionGrid();
            updateFilterCounts();
            saveAllData();
        }
        function startTimer(posName) {
            if (!activeTimers[posName]) { alert('请先开台！'); return; }
            if (activeTimers[posName].running) { alert('已在计时中！'); return; }
            const now = new Date().toISOString();
            positions[posName].status = '计时中';
            positions[posName].startTime = now;
            positions[posName].locked = true;
            activeTimers[posName].running = true;
            activeTimers[posName].paused = false;
            activeTimers[posName].startTime = now;
            activeTimers[posName].locked = true;
            activeTimers[posName].elapsed = activeTimers[posName].mode === '倒计时' ? activeTimers[posName].countdownSeconds : 0;
            startTimerInterval(posName);
            renderPositionGrid();
            updateFilterCounts();
            saveAllData();
        }
        function startTimerInterval(posName) {
            if (timerIntervals[posName]) clearInterval(timerIntervals[posName]);
            timerIntervals[posName] = setInterval(() => {
                const timer = activeTimers[posName];
                if (!timer || !timer.running || timer.paused) return;
                if (timer.mode === '正计时') timer.elapsed++;
                else { timer.elapsed--; if (timer.elapsed <= 0) { timer.elapsed = 0;
                        timer.running = false;
                        clearInterval(timerIntervals[posName]);
                        alert(`${posName}倒计时结束！`); } }
                updateSingleTimerDisplay(posName);
            }, 1000);
        }
        function pauseTimer(posName) {
            if (!activeTimers[posName]) { alert('未开台！'); return; }
            activeTimers[posName].paused = !activeTimers[posName].paused;
            positions[posName].status = activeTimers[posName].paused ? '已暂停' : '计时中';
            if (!activeTimers[posName].paused) { positions[posName].startTime = new Date().toISOString();
                activeTimers[posName].startTime = positions[posName].startTime; }
            renderPositionGrid();
            updateFilterCounts();
            saveAllData();
        }
        function endTimer(posName) { if (!activeTimers[posName]) { alert('未开台！'); return; }
            showPaymentConfirm(posName); }
        function updateSingleTimerDisplay(posName) { const d = document.getElementById(`timer_${posName}`); if (d && activeTimers[posName]) d.textContent = formatTime(Math.abs(activeTimers[posName].elapsed)); }
        function updateAllTimers() { for (const k in activeTimers) updateSingleTimerDisplay(k); }

        function closeAllTables() {
            const bp = []; for (const k in positions) { if (positions[k].status === '计时中' || positions[k].status === '已开台' || positions[k].status === '已暂停') bp.push(k); } if (!bp.length) { alert('没有正在使用的座位！'); return; }
            showDeleteConfirm(`确定一键关店？\n将结束 ${bp.length} 个座位`, function() { bp.forEach(k => { if (timerIntervals[k]) { clearInterval(timerIntervals[k]);
                        delete timerIntervals[k]; } if (activeTimers[k]) { saveCompletionRecord({ position: k, time: new Date().toISOString(), duration: formatTime(Math.abs(activeTimers[k].elapsed)), remark: activeTimers[k].remark || '一键关店', payment: '一键关店', mode: activeTimers[k].mode });
                        delete activeTimers[k]; }
                    positions[k].status = '空闲';
                    positions[k].reservation = null;
                    positions[k].remark = '';
                    positions[k].startTime = null;
                    positions[k].locked = false; });
                updatePositionStatuses();
                renderPositionGrid();
                updateFilterCounts();
                saveAllData();
                alert(`一键关店完成！关闭 ${bp.length} 个座位`); });
        }

        function init() {
            loadAllData();
            if (!Object.keys(positions).length) { for (let i = 1; i <= 36; i++) positions[`座位${i}`] = { status: '空闲', reservation: null, remark: '', countdownMinutes: 60, timerMode: '正计时', startTime: null, locked: false }; }
            document.getElementById('resDateTime').value = new Date().toISOString().slice(0, 16);
            updatePositionStatuses();
            updatePositionSelects();
            renderPositionGrid();
            refreshReservationList();
            updateFilterCounts();
            setInterval(updateAllTimers, 1000);
            window.addEventListener('beforeunload', saveAllData);
            setInterval(saveAllData, 5000);
            document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', function() { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderPositionGrid(); }); });
            document.getElementById('deleteConfirmOkBtn').addEventListener('click', function() { if (deleteCallback) { deleteCallback();
                    deleteCallback = null; } document.getElementById('deleteConfirmOverlay').style.display = 'none'; });
            document.getElementById('paymentConfirmBtn').addEventListener('click', function() {
                if (!selectedPayment) { alert('请选择支付方式！'); return; }
                const p = endingPosition;
                if (timerIntervals[p]) { clearInterval(timerIntervals[p]);
                    delete timerIntervals[p]; }
                const elapsed = activeTimers[p] ? activeTimers[p].elapsed : 0;
                if (activeTimers[p]) { saveCompletionRecord({ position: p, time: new Date().toISOString(), duration: formatTime(Math.abs(elapsed)), remark: activeTimers[p].remark, payment: selectedPayment, mode: activeTimers[p].mode });
                    delete activeTimers[p]; }
                positions[p].status = '空闲';
                positions[p].reservation = null;
                positions[p].remark = '';
                positions[p].startTime = null;
                positions[p].locked = false;
                closePaymentConfirm();
                updatePositionStatuses();
                renderPositionGrid();
                updateFilterCounts();
                saveAllData();
                alert(`${p}已结束！`);
            });
        }
        function updatePositionStatuses() { const today = getTodayStr(); for (const k in positions) { if (positions[k].status === '计时中' || positions[k].status === '已开台' || positions[k].status === '已暂停') continue; let f = false; for (const r of reservations) { if (r.position === k && getReservationDate(r) === today) { f = true;
                        positions[k].status = '已预约';
                        positions[k].reservation = r; break; } } if (!f) { positions[k].status = '空闲';
                    positions[k].reservation = null; } } }
        function switchTab(t) { document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); if (t === 'reservation') { document.querySelectorAll('.tab-button')[0].classList.add('active');
                document.getElementById('reservationTab').classList.add('active');
                refreshReservationList(); } else { document.querySelectorAll('.tab-button')[1].classList.add('active');
                document.getElementById('timerTab').classList.add('active');
                updatePositionSelects();
                renderPositionGrid();
                updateFilterCounts(); } }
        function addNewPosition() { const n = document.getElementById('newPositionName').value.trim(); if (!n) { alert('请输入名称！'); return; } if (positions[n]) { alert('已存在！'); return; }
            positions[n] = { status: '空闲', reservation: null, remark: '', countdownMinutes: 60, timerMode: '正计时', startTime: null, locked: false };
            document.getElementById('newPositionName').value = '';
            updatePositionSelects();
            renderPositionGrid();
            updateFilterCounts();
            saveAllData(); }
        function deletePosition(posName) { if (activeTimers[posName]) { alert('使用中！'); return; } if (isPositionOccupiedToday(posName)) { alert('今天已被占用！'); return; } for (const r of reservations) { if (r.position === posName && getReservationDate(r) >= getTodayStr()) { alert('有未来预约！'); return; } }
            showDeleteConfirm(`确定删除"${posName}"？`, function() { delete positions[posName];
                updatePositionSelects();
                renderPositionGrid();
                updateFilterCounts();
                saveAllData(); }); }
        function updatePositionSelects() { const s = document.getElementById('resPosition'); const names = Object.keys(positions).sort((a, b) => { const na = parseInt(a.replace('座位', '')),
                nb = parseInt(b.replace('座位', '')); if (!isNaN(na) && !isNaN(nb)) return na - nb; return a.localeCompare(b, 'zh'); });
            s.innerHTML = '<option value="不指定">不指定位置</option>';
            names.forEach(n => { const o = document.createElement('option');
                o.value = n;
                o.textContent = n;
                s.appendChild(o); }); }
        function addReservation() { const name = document.getElementById('resName').value.trim() || '未填写'; const phone = document.getElementById('resPhone').value.trim(); const dt = document.getElementById('resDateTime').value;
            const pos = document.getElementById('resPosition').value; const remarkSelect = document.getElementById('resRemark').value; const customRemark = document.getElementById('resCustomRemark').value.trim(); const remark = remarkSelect === '自定义' ? (customRemark || '自定义') : remarkSelect; if (!phone) { alert('电话不能为空！'); return; } if (!dt) { alert('请选择时间！'); return; } const resDate = dt.split('T')[0]; if (pos !== '不指定') { if (!positions[pos]) { alert('位置不存在！'); return; } for (const r of reservations) { if (r.position === pos && getReservationDate(r) === resDate) { alert(`${pos}在${resDate}已被预约！`); return; } } if (resDate === getTodayStr() && isPositionOccupiedToday(pos)) { alert(`${pos}今天已被占用！`); return; } }
            reservations.push({ id: Date.now(), name, phone, time: dt, position: pos, remark, status: '已预约' });
            updatePositionStatuses();
            refreshReservationList();
            updatePositionSelects();
            renderPositionGrid();
            updateFilterCounts();
            saveAllData();
            alert('预约成功！');
            clearForm(); }
        function clearForm() { document.getElementById('resName').value = '';
            document.getElementById('resPhone').value = '';
            document.getElementById('resPosition').value = '不指定';
            document.getElementById('resRemark').value = '美团';
            document.getElementById('resCustomRemark').value = '';
            document.getElementById('resCustomRemark').classList.remove('show');
            document.getElementById('resDateTime').value = new Date().toISOString().slice(0, 16); }
        function deleteReservation(id) { const r = reservations.find(x => x.id === id); const msg = r ? `确定删除此预约？\n\n👤 ${r.name}\n📞 ${r.phone}\n📅 ${r.time}\n📍 ${r.position}` : '确定删除？';
            showDeleteConfirm(msg, function() { reservations = reservations.filter(x => x.id !== id);
                updatePositionStatuses();
                refreshReservationList();
                renderPositionGrid();
                updateFilterCounts();
                saveAllData(); }); }
        function refreshReservationList() { const c = document.getElementById('reservationListContent'); if (!reservations.length) { c.innerHTML = '<div style="text-align:center;color:#999;padding:50px;">暂无预约记录</div>'; return; } const g = {};
            reservations.sort((a, b) => new Date(a.time) - new Date(b.time));
            reservations.forEach(r => { const d = getReservationDate(r); if (!g[d]) g[d] = [];
                g[d].push(r); }); let h = ''; for (const d in g) { h += `<div class="reservation-date-group"><div class="date-header">📅 ${d} (${g[d].length}个)</div>`;
                g[d].forEach(r => { const t = r.time.split('T')[1] || '';
                    h += `<div class="reservation-item"><div class="reservation-info"><div>⏰ <strong>${t}</strong></div><div>👤 <strong>${r.name}</strong> | 📞 ${r.phone}</div><div>📍 ${r.position} | <span class="badge ${getBadgeClass(r.remark)}">${r.remark}</span></div></div><button class="btn btn-danger btn-xs" onclick="event.stopPropagation();deleteReservation(${r.id})">删除</button></div>`; });
                h += '</div>'; }
            c.innerHTML = h; }
        function updateModeInputs(posName) { const ms = document.getElementById(`mode_${posName}`),
                ci = document.getElementById(`countdown_${posName}`); if (ms && ci) { const locked = isTimerLocked(posName);
                ms.disabled = locked;
                ci.disabled = locked || ms.value !== '倒计时';
                ci.style.background = ci.disabled ? '#f5f5f5' : 'white';
                ci.style.color = ci.disabled ? '#ccc' : '#333'; } }
        function updateFilterCounts() { let free = 0,
                busy = 0,
                reserved = 0; for (const k in positions) { const fs = getFilterStatus(k); if (fs === '空闲') free++; else if (fs === '使用中') busy++; else reserved++; }
            document.getElementById('countAll').textContent = `(${free+busy+reserved})`;
            document.getElementById('countFree').textContent = `(${free})`;
            document.getElementById('countBusy').textContent = `(${busy})`;
            document.getElementById('countReserved').textContent = `(${reserved})`; }
        function renderPositionGrid() {
            const g = document.getElementById('positionGrid');
            let h = '',
                count = 0;
            const names = Object.keys(positions).sort((a, b) => { const na = parseInt(a.replace('座位', '')),
                    nb = parseInt(b.replace('座位', '')); if (!isNaN(na) && !isNaN(nb)) return na - nb; return a.localeCompare(b, 'zh'); });
            names.forEach(posName => {
                const fs = getFilterStatus(posName);
                if (currentFilter === '空闲' && fs !== '空闲') return;
                if (currentFilter === '使用中' && fs !== '使用中') return;
                if (currentFilter === '已预约' && fs !== '已预约') return;
                if (searchKeyword && !posName.includes(searchKeyword)) return;
                count++;
                const d = positions[posName],
                    s = d.status;
                const ga = s === '空闲' ? 'active' : '',
                    ya = s === '已开台' ? 'active' : '',
                    ra = s === '计时中' ? 'active' : '',
                    ba = s === '已暂停' ? 'active' : '';
                const st = { '空闲': '空闲', '已开台': '已开台', '计时中': '计时中', '已暂停': '已暂停', '已预约': '已预约' } [s] || '空闲';
                const tv = activeTimers[posName] ? formatTime(Math.abs(activeTimers[posName].elapsed)) : '00:00:00';
                const rv = activeTimers[posName] ? activeTimers[posName].remark : (d.remark || '');
                const cv = d.countdownMinutes || 60,
                    mv = d.timerMode || '正计时';
                const locked = isTimerLocked(posName) || s === '已开台';
                const hl = searchKeyword && posName.includes(searchKeyword) ? ' highlight' : '';
                const stStr = (activeTimers[posName] && activeTimers[posName].startTime) ? formatStartTime(activeTimers[posName].startTime) : (d.startTime ? formatStartTime(d.startTime) : '');
                h += `<div class="position-card${hl}"><button class="delete-position-btn" onclick="event.stopPropagation();deletePosition('${posName}')">×</button><div class="position-header"><span class="position-name">${posName}</span><div class="status-lights"><div class="status-light light-green ${ga}"></div><div class="status-light light-yellow ${ya}"></div><div class="status-light light-red ${ra}"></div><div class="status-light light-blue ${ba}"></div></div></div><div style="font-size:10px;color:#999;margin-bottom:4px;">${st}</div>${stStr?`<div class="position-start-time">${stStr}</div>`:''}<div class="position-timer-display" id="timer_${posName}">${tv}</div><div class="position-info-item"><label>备注</label><div class="remark-row"><input class="position-remark-input" id="remark_${posName}" value="${rv.replace(/"/g,'&quot;')}" onblur="autoSaveRemark('${posName}')"><button class="btn btn-danger btn-xs" onclick="event.stopPropagation();deleteRemark('${posName}')">删除</button></div></div><div class="position-info-item"><label>计时模式</label><select class="position-mode-select" id="mode_${posName}" onchange="updateModeInputs('${posName}')" ${locked?'disabled':''}><option value="正计时" ${mv==='正计时'?'selected':''}>正计时</option><option value="倒计时" ${mv==='倒计时'?'selected':''}>倒计时</option></select></div><div class="position-info-item"><label>倒计时(分钟)</label><input type="number" class="position-countdown-input" id="countdown_${posName}" value="${cv}" min="1" ${locked?'disabled':(mv==='正计时'?'disabled':'')}></div><div class="position-controls"><button class="btn btn-success btn-sm" onclick="event.stopPropagation();openTable('${posName}')">开台</button><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();startTimer('${posName}')">开始</button><button class="btn btn-warning btn-sm" onclick="event.stopPropagation();pauseTimer('${posName}')">暂停</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();endTimer('${posName}')">结束</button></div></div>`;
            });
            if (count === 0) h = '<div class="no-result">未找到匹配的座位</div>';
            g.innerHTML = h;
        }
        function exportReservationsExcel() { if (!reservations.length) { alert('无数据！'); return; } const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['预约时间','姓名','电话','位置','备注','状态'], ...reservations.map(r => [r.time, r.name, r.phone, r.position, r.remark, r.status])]), '预约记录');
            XLSX.writeFile(wb, `与己造物_预约_${getTodayStr()}.xlsx`); }
        function exportAllExcel() { const wb = XLSX.utils.book_new(); if (reservations.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['预约时间','姓名','电话','位置','备注','状态'], ...reservations.map(r => [r.time, r.name, r.phone, r.position, r.remark, r.status])]), '预约记录'); const s = localStorage.getItem('yujizaowu_completion'); if (s) { const a = JSON.parse(s); if (a.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['结束时间','位置','计时时长','备注','支付方式'], ...a.map(r => [new Date(r.time).toLocaleString(), r.position, r.duration, r.remark, r.payment])]), '完成记录'); } if (!wb.SheetNames.length) { alert('无数据！'); return; }
            XLSX.writeFile(wb, `与己造物_全部_${getTodayStr()}.xlsx`); }

        window.onload = init;
    </script>
</body>
</html>
