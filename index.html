<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>与己造物 · 手工店计时</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, 'Microsoft YaHei', 'PingFang SC', Roboto, sans-serif; background: #f7f5f2; color: #2e241f; padding: 12px; min-height: 100vh; }
        .app { max-width: 1800px; margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .shop-name { font-size: 1.4rem; font-weight: 400; letter-spacing: 3px; color: #3b2b24; border-left: 4px solid #b28b6f; padding-left: 14px; cursor: pointer; }
        .shop-name small { font-size: 0.85rem; color: #7f6a5c; margin-left: 6px; }
        .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .btn { background: #e3d9d1; border: 1px solid #b8a69a; color: #2e241f; padding: 7px 12px; border-radius: 24px; font-size: 0.8rem; cursor: pointer; font-weight: 500; user-select: none; transition: all 0.15s; white-space: nowrap; }
        .btn:hover { background: #cdbcaf; }
        .btn-primary { background: #5e4b3c; border-color: #3f3228; color: #fdf6ef; }
        .btn-success { background: #4a7c59; border-color: #3a6347; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; background: #ddd; border-color: #ccc; color: #999; pointer-events: none; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 1px solid #d6c9bf; background: #fefcf9; border-radius: 24px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; }
        .tab-btn.active { background: #5e4b3c; color: #fdf6ef; border-color: #3f3228; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
        .stat-card { background: #fefcf9; border-radius: 20px; padding: 8px 18px; border: 1px solid #e2d6cd; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.85rem; }
        .stat-card.active { background: #5e4b3c; color: #fdf6ef; }
        .stat-number { font-size: 1.4rem; font-weight: 600; min-width: 35px; }
        .batch-bar { display: flex; gap: 6px; align-items: center; margin-left: 10px; flex-wrap: wrap; }
        .batch-bar .btn { font-size: 0.7rem; padding: 4px 10px; }
        .seats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .seat-card { background: #fefcf9; border-radius: 14px; padding: 12px; border: 1px solid #e2d6cd; position: relative; cursor: pointer; user-select: none; }
        .seat-card.selected { border-color: #5e4b3c; background: #f5f0ea; box-shadow: 0 0 8px rgba(94,75,60,0.2); }
        .seat-card.hidden { display: none; }
        .seat-header { display: flex; justify-content: space-between; margin-bottom: 6px; padding-right: 20px; }
        .seat-name { font-weight: 700; font-size: 1rem; }
        .seat-status { font-size: 0.6rem; padding: 2px 6px; border-radius: 20px; background: #ede6df; }
        .status-active { background: #cbd9c0; }
        .status-paused { background: #f3e1c2; }
        .status-idle { background: #e5dfd9; }
        .start-time-label { font-size: 0.6rem; color: #6b5d4e; text-align: center; margin-bottom: 3px; padding: 3px 0; background: #fdf5e6; border-radius: 10px; font-weight: 500; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 1.4rem; text-align: center; margin: 6px 0; background: #f3ede7; padding: 5px 0; border-radius: 10px; }
        .mode-badge { font-size: 0.6rem; background: #cfc1b6; display: inline-block; padding: 2px 8px; border-radius: 20px; margin: 0 auto 5px; text-align: center; }
        .seat-actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
        .seat-actions .btn { flex: 1 0 35px; padding: 4px 2px; font-size: 0.6rem; }
        .delete-seat-btn { position: absolute; top: 6px; right: 6px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 0.9rem; z-index: 5; padding: 2px 6px; border-radius: 50%; }
        .delete-seat-btn:hover { color: #e74c3c; background: #fdf5e6; }
        .notes-selector-wrapper { margin-top: 6px; border-top: 1px dashed #d6c9bf; padding-top: 6px; }
        .remark-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .remark-row select { flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid #d6c9bf; border-radius: 16px; font-size: 0.65rem; background: #fffbf8; }
        .remark-row input { flex: 2; min-width: 100px; padding: 5px 8px; border: 1px solid #d6c9bf; border-radius: 16px; font-size: 0.65rem; background: #fffbf8; }
        .save-note-btn { flex: 0 0 auto; padding: 4px 8px; font-size: 0.6rem; background: #27ae60; border: 1px solid #219a52; color: #fff; border-radius: 12px; cursor: pointer; }
        .current-note-display { margin-top: 4px; font-size: 0.55rem; color: #5e4b3c; padding: 2px 5px; background: #f4ede6; border-radius: 10px; }
        .toast-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3b2b24; color: #f0e4da; padding: 8px 20px; border-radius: 40px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 9999; }
        .toast-message.show { opacity: 1; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(2px); }
        .modal-overlay.hidden { display: none !important; }
        .modal { background: #fefcf9; border-radius: 24px; padding: 20px; max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 16px; color: #3b2b24; font-size: 1.1rem; }
        .modal-input-group { margin-bottom: 14px; }
        .modal-input-group label { display: block; margin-bottom: 5px; color: #5f4e43; font-size: 0.8rem; }
        .modal-input-group input, .modal-input-group select { width: 100%; padding: 10px 12px; border: 1px solid #d6c9bf; border-radius: 20px; font-size: 0.9rem; background: #fffbf8; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .records-list { margin: 14px 0; max-height: 280px; overflow-y: auto; }
        .record-item { padding: 7px 10px; border-bottom: 1px solid #e2d6cd; font-size: 0.75rem; }
        .payment-methods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 14px 0; }
        .payment-option { padding: 12px 8px; border: 2px solid #d6c9bf; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fffbf8; }
        .payment-option.selected { border-color: #5e4b3c; background: #5e4b3c; color: #fdf6ef; }
        .payment-option .payment-icon { font-size: 1.4rem; margin-bottom: 4px; }
        .payment-option .payment-name { font-size: 0.7rem; font-weight: 500; }
        .transfer-btn { background: #8b6f5c !important; border-color: #6b5343 !important; color: #fff !important; }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
    <div id="toast" class="toast-message"></div>
    <div class="header">
        <div class="shop-name" id="shopNameDisplay" title="点击修改店名"><span id="shopNameText">与己造物</span><small>· 手作时光</small></div>
        <div class="admin-actions">
            <button class="btn btn-sm" id="addSeatBtn">+ 添加座位</button>
            <button class="btn btn-sm btn-primary" id="resetAllIdleBtn">全部空闲</button>
            <button class="btn btn-sm btn-success" id="viewRecordsBtn">记录</button>
            <button class="btn btn-sm btn-success" id="exportRecordsBtn">导出</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="timer">⏱️ 计时管理</button>
        <button class="tab-btn" data-tab="reservation">📋 预约管理</button>
    </div>
    <div class="tab-content active" id="tabTimer">
        <div class="stats-bar">
            <div class="stat-card active" data-filter="all"><span class="stat-number" id="statAll">0</span><span>全部</span></div>
            <div class="stat-card" data-filter="active"><span class="stat-number" id="statActive">0</span><span>使用中</span></div>
            <div class="stat-card" data-filter="idle"><span class="stat-number" id="statIdle">0</span><span>空闲</span></div>
            <div class="batch-bar">
                <button class="btn btn-sm" id="selectAllBtn">全选</button>
                <button class="btn btn-sm" id="deselectAllBtn">取消</button>
                <button class="btn btn-sm btn-success" id="batchOpenBtn">批量开台</button>
                <button class="btn btn-sm btn-primary" id="batchStartBtn">批量开始</button>
                <button class="btn btn-sm" id="batchEndBtn">批量结束</button>
                <button class="btn btn-sm" id="batchNoteBtn">批量备注</button>
            </div>
        </div>
        <div id="seatsContainer" class="seats-grid"></div>
    </div>
    <div id="paymentModal" class="modal-overlay hidden">
        <div class="modal"><h3>💰 选择收款方式</h3><div id="paymentSeatInfo" style="margin-bottom:12px;"></div><div class="payment-methods" id="paymentOptionsContainer"></div><div class="modal-actions"><button class="btn" id="cancelPaymentBtn">取消</button><button class="btn btn-primary" id="confirmPaymentBtn" disabled>确认结束</button></div></div>
    </div>
    <div id="batchNoteModal" class="modal-overlay hidden">
        <div class="modal"><h3>📋 批量备注</h3><div id="batchNoteInfo" style="margin-bottom:12px;"></div><div class="modal-input-group"><div class="remark-row"><select id="batchNoteSelect"><option value="抖音">抖音</option><option value="快手">快手</option><option value="美团">美团</option><option value="小红书">小红书</option></select><input type="text" id="batchNoteInput" placeholder="自定义备注"></div></div><div class="modal-actions"><button class="btn" id="cancelBatchNoteBtn">取消</button><button class="btn btn-primary" id="confirmBatchNoteBtn">确认</button></div></div>
    </div>
    <div id="customTimeModal" class="modal-overlay hidden">
        <div class="modal"><h3>⏱️ 设置倒计时</h3><div class="modal-input-group"><div style="display:flex;gap:4px;align-items:center;"><input type="number" id="customHoursInput" min="0" value="1" style="width:55px;"><span>时</span><input type="number" id="customMinutesInput" min="0" max="59" value="0" style="width:55px;"><span>分</span><input type="number" id="customSecondsInput" min="0" max="59" value="0" style="width:55px;"><span>秒</span></div><div style="margin-top:8px;font-size:0.7rem;color:#999;">总秒数：<span id="totalSecondsDisplay">3600</span> 秒</div></div><div class="modal-actions"><button class="btn" id="cancelCustomBtn">取消</button><button class="btn btn-primary" id="confirmCustomBtn">确定</button></div></div>
    </div>
    <div id="transferModal" class="modal-overlay hidden">
        <div class="modal"><h3>🔄 转桌</h3><div id="transferInfo" style="margin-bottom:12px;"></div><div class="modal-input-group"><select id="transferTargetSelect"></select></div><div class="modal-actions"><button class="btn" id="cancelTransferBtn">取消</button><button class="btn btn-primary" id="confirmTransferBtn">确认</button></div></div>
    </div>
    <div id="recordsModal" class="modal-overlay hidden">
        <div class="modal" style="max-width:500px;"><h3>📊 使用记录</h3><div style="display:flex;gap:8px;margin:16px 0;"><input type="date" id="recordDateInput" style="flex:1;padding:8px;border-radius:20px;border:1px solid #d6c9bf;"><button class="btn btn-sm btn-primary" id="loadRecordsBtn">查看</button></div><div class="records-list" id="recordsList"></div><div class="modal-actions"><button class="btn btn-sm btn-success" id="exportDayRecordsBtn">导出Excel</button><button class="btn btn-sm" id="closeRecordsBtn">关闭</button></div></div>
    </div>
    <div id="shopNameModal" class="modal-overlay hidden">
        <div class="modal"><h3>✏️ 修改店名</h3><div class="modal-input-group"><label>店名</label><input type="text" id="shopNameInput" placeholder="请输入店名"></div><div class="modal-actions"><button class="btn" id="cancelShopNameBtn">取消</button><button class="btn btn-primary" id="saveShopNameBtn">保存</button></div></div>
    </div>
</div>
<script>
(function(){
    const SKEY='yzw_v32',RKEY='yzw_rec32',NAMEKEY='yzw_shopname';
    const PMS=[{name:'抖音团购',icon:'🎵'},{name:'快手团购',icon:'📱'},{name:'美团团购',icon:'🍔'},{name:'支付宝',icon:'💙'},{name:'微信',icon:'💚'}];
    const NOTES=['','抖音','美团','快手','小红书'];
    let seats=[],records=[],displayTimer=null,saveTimer=null,selectedSeats=new Set(),shopName='与己造物';
    let pendingEndId=null,pendingTransferId=null,pendingCustomId=null,selPay=null,curFilter='all',isBatch=false;
    const $=id=>document.getElementById(id);
    function toast(m,d=1500){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),d);}
    function mkSeat(id,name){return{id,name:name||(id+'号桌'),status:'idle',mode:'countup',cdInit:3600,acc:0,run:false,ts:null,startStr:'',note:'',cnote:''};}
    function elapsed(s){let b=s.acc||0;if(s.run&&s.ts)b+=(Date.now()-s.ts)/1000;return b;}
    function dispTime(s){const e=elapsed(s);return s.mode==='countdown'?Math.max(0,s.cdInit-e):e;}
    function fmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;}
    function pause(s){if(s.run&&s.ts){s.acc+=(Date.now()-s.ts)/1000;s.run=false;s.ts=null;}}
    function startStr(d){return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 开始计时`;}
    function locked(s){return s.run||s.status==='paused';}
    function save(){localStorage.setItem(SKEY,JSON.stringify(seats));}
    function saveRec(){localStorage.setItem(RKEY,JSON.stringify(records));}
    function saveName(){localStorage.setItem(NAMEKEY,shopName);$('shopNameText').textContent=shopName;document.title=shopName+' · 手工店计时';}
    function resetSeat(s){s.status='idle';s.acc=0;s.run=false;s.ts=null;s.startStr='';s.note='';s.cnote='';s.mode='countup';s.cdInit=3600;}

    function refreshUI(){
        let h='';
        seats.forEach(s=>{
            const lk=locked(s);
            const sc=s.status==='active'?(s.run?'status-active':'status-paused'):(s.status==='paused'?'status-paused':'status-idle');
            const st=s.status==='idle'?'空闲':(s.run?'计时中':'暂停');
            const dn=s.cnote||s.note||'';
            const opts=NOTES.map(o=>`<option value="${o}" ${s.note===o?'selected':''}>${o||'无备注'}</option>`).join('');
            const sh=(s.run||s.status==='paused')&&s.startStr?`<div class="start-time-label">🕐 ${s.startStr}</div>`:'';
            const dis=lk?'disabled':'';
            const sel=selectedSeats.has(s.id)?' selected':'';
            h+=`<div class="seat-card${sel}" data-sid="${s.id}">
                <button class="delete-seat-btn" data-act="del" data-id="${s.id}">×</button>
                <div class="seat-header"><span class="seat-name">${s.name}</span><span class="seat-status ${sc}">${st}</span></div>
                <div class="mode-badge">${s.mode==='countdown'?'倒计时':'正计时'}</div>${sh}
                <div class="timer-display" id="t-${s.id}">${fmt(dispTime(s))}</div>
                <div class="seat-actions">
                    <button class="btn btn-sm" data-act="start" data-id="${s.id}">开始</button>
                    <button class="btn btn-sm" data-act="pause" data-id="${s.id}">暂停</button>
                    <button class="btn btn-sm" data-act="end" data-id="${s.id}">结束</button>
                </div>
                <div class="seat-actions">
                    <button class="btn btn-sm" data-act="open" data-id="${s.id}" ${dis}>开台</button>
                    <button class="btn btn-sm" data-act="toggle" data-id="${s.id}" ${dis}>切换</button>
                    <button class="btn btn-sm btn-primary" data-act="cdown" data-id="${s.id}" ${dis}>倒计时</button>
                </div>
                <div class="seat-actions">
                    <button class="btn btn-sm transfer-btn" data-act="transfer" data-id="${s.id}" ${!lk?'disabled':''}>🔄 转桌</button>
                </div>
                <div class="notes-selector-wrapper">
                    <div class="remark-row">
                        <select data-act="noteSel" data-id="${s.id}">${opts}</select>
                        <input type="text" data-act="noteInp" data-id="${s.id}" placeholder="自定义备注" value="${(s.cnote||'').replace(/"/g,'&quot;')}">
                        <button class="save-note-btn" data-act="noteSave" data-id="${s.id}">保存</button>
                    </div>
                    ${dn?`<div class="current-note-display">📋 ${dn}</div>`:''}
                </div>
            </div>`;
        });
        $('seatsContainer').innerHTML=h;
        document.querySelectorAll('.seat-card').forEach(card=>{
            const s=seats.find(x=>x.id===parseInt(card.dataset.sid));
            if(!s)return;
            card.classList.toggle('hidden',curFilter==='active'?!(s.status==='active'||s.status==='paused'):curFilter==='idle'?s.status!=='idle':false);
        });
        updateStats();
    }

    function refreshDisplays(){seats.forEach(s=>{const el=document.getElementById('t-'+s.id);if(el)el.textContent=fmt(dispTime(s));if(s.mode==='countdown'&&s.run&&dispTime(s)<=0){pause(s);s.status='paused';refreshUI();}});}
    function updateStats(){$('statAll').textContent=seats.length;$('statActive').textContent=seats.filter(s=>s.status==='active'||s.status==='paused').length;$('statIdle').textContent=seats.filter(s=>s.status==='idle').length;}

    function openTable(id){const s=seats.find(x=>x.id===id);if(!s||locked(s))return;pause(s);s.status='active';s.acc=0;s.run=false;s.startStr='';save();refreshUI();}
    function startTimer(id){const s=seats.find(x=>x.id===id);if(!s||s.status==='idle'||s.run)return;s.run=true;s.ts=Date.now();s.startStr=startStr(new Date());s.status='active';save();refreshUI();}
    function pauseTimer(id){const s=seats.find(x=>x.id===id);if(!s)return;pause(s);s.status='paused';save();refreshUI();}
    function endWithPay(id,method){const s=seats.find(x=>x.id===id);if(!s)return;pause(s);records.push({id:Date.now(),name:s.name,dur:fmt(s.acc),note:s.cnote||s.note||'',pay:method,time:new Date().toISOString()});resetSeat(s);save();saveRec();refreshUI();}
    function toggleMode(id){const s=seats.find(x=>x.id===id);if(!s||locked(s))return;pause(s);s.mode=s.mode==='countup'?'countdown':'countup';s.acc=0;s.startStr='';save();refreshUI();}
    function setCD(id,sec){const s=seats.find(x=>x.id===id);if(!s||locked(s))return;pause(s);s.cdInit=sec;s.mode='countdown';s.acc=0;s.startStr='';save();refreshUI();}
    function addSeat(){const mid=seats.reduce((m,s)=>Math.max(m,s.id),0);const name=prompt('请输入座位名称：',(mid+1)+'号桌');if(!name)return;seats.push(mkSeat(mid+1,name));save();refreshUI();}
    function delSeat(id){const s=seats.find(x=>x.id===id);if(!s||s.status!=='idle'){toast('⚠️ 请先结束');return;}if(!confirm('删除？'))return;seats=seats.filter(x=>x.id!==id);save();refreshUI();}
    function transfer(id){const s=seats.find(x=>x.id===id);if(!s||!locked(s)){toast('⚠️ 只有计时中/暂停可转');return;}pendingTransferId=id;$('transferInfo').textContent=`${s.name} · ${fmt(dispTime(s))}`;const sel=$('transferTargetSelect');sel.innerHTML=seats.filter(x=>x.id!==id&&x.status==='idle').map(x=>`<option value="${x.id}">${x.name}</option>`).join('');if(!sel.options.length){toast('⚠️ 无空闲座位');return;}$('transferModal').classList.remove('hidden');}
    function confirmTransfer(){if(!pendingTransferId)return;const ss=seats.find(x=>x.id===pendingTransferId);const tid=parseInt($('transferTargetSelect').value);const ts=seats.find(x=>x.id===tid);if(!ss||!ts||ts.status!=='idle')return;const d={status:ss.status,mode:ss.mode,cdInit:ss.cdInit,acc:ss.acc,run:ss.run,ts:ss.ts,startStr:ss.startStr,note:ss.note,cnote:ss.cnote};resetSeat(ss);Object.assign(ts,d);ts.id=tid;save();$('transferModal').classList.add('hidden');pendingTransferId=null;refreshUI();toast('✅ 转桌成功');}
    function noteSel(id,v){const s=seats.find(x=>x.id===id);if(!s)return;s.note=v;if(v!=='')s.cnote='';save();}
    function saveNote(id){const s=seats.find(x=>x.id===id);if(!s)return;const inp=document.querySelector(`[data-act="noteInp"][data-id="${id}"]`);const sel=document.querySelector(`[data-act="noteSel"][data-id="${id}"]`);if(inp&&sel){s.note=sel.value;s.cnote=inp.value.trim();save();refreshUI();toast('✅ 已保存');}}
    function togSel(id){if(selectedSeats.has(id))selectedSeats.delete(id);else selectedSeats.add(id);const card=document.querySelector(`.seat-card[data-sid="${id}"]`);if(card)card.classList.toggle('selected',selectedSeats.has(id));}

    function batchOpen(){if(!selectedSeats.size){toast('⚠️ 请先选择');return;}let c=0;selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s&&s.status==='idle'){s.status='active';s.acc=0;s.run=false;s.startStr='';c++;}});selectedSeats.clear();save();refreshUI();toast(`✅ 批量开台 ${c} 个`);}
    function batchStart(){if(!selectedSeats.size){toast('⚠️ 请先选择');return;}let c=0;selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s&&s.status!=='idle'&&!s.run){s.run=true;s.ts=Date.now();s.startStr=startStr(new Date());s.status='active';c++;}});selectedSeats.clear();save();refreshUI();toast(`✅ 批量开始 ${c} 个`);}
    function batchEnd(){if(!selectedSeats.size){toast('⚠️ 请先选择');return;}isBatch=true;$('paymentSeatInfo').textContent=`批量结束 ${selectedSeats.size} 个座位`;selPay=null;renderPayOpts();$('confirmPaymentBtn').disabled=true;$('paymentModal').classList.remove('hidden');}
    function batchNote(){if(!selectedSeats.size){toast('⚠️ 请先选择');return;}$('batchNoteInfo').textContent=`${selectedSeats.size} 个座位`;$('batchNoteModal').classList.remove('hidden');}
    function execBatchEnd(pay){const ids=[...selectedSeats];ids.forEach(id=>{const s=seats.find(x=>x.id===id);if(s&&locked(s)){pause(s);records.push({id:Date.now()+Math.random(),name:s.name,dur:fmt(s.acc),note:s.cnote||s.note||'',pay:pay,time:new Date().toISOString()});resetSeat(s);}});selectedSeats.clear();save();saveRec();refreshUI();toast(`✅ 批量结束 ${ids.length} 个`);}

    function renderPayOpts(){
        const c=$('paymentOptionsContainer');c.innerHTML=PMS.map(m=>`<div class="payment-option" data-p="${m.name}"><div class="payment-icon">${m.icon}</div><div class="payment-name">${m.name}</div></div>`).join('');
        c.querySelectorAll('.payment-option').forEach(o=>o.onclick=function(){c.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');selPay=this.dataset.p;$('confirmPaymentBtn').disabled=false;});
    }

    function showRecords(dateStr){
        const date=dateStr||new Date().toISOString().split('T')[0];
        $('recordDateInput').value=date;
        const dayRecords=records.filter(r=>r.time.startsWith(date));
        $('recordsList').innerHTML=dayRecords.length?dayRecords.map(r=>`<div class="record-item"><strong>${r.name}</strong> · ${r.dur} · ${r.pay||''}<br><span style="color:#999;">${new Date(r.time).toLocaleTimeString()} · ${r.note||''}</span></div>`).join(''):'<div style="text-align:center;padding:20px;color:#999;">暂无记录</div>';
    }

    function exportExcel(dateStr){
        const date=dateStr||new Date().toISOString().split('T')[0];
        const data=[['座位','时长','收款方式','备注','时间']];
        records.filter(r=>r.time.startsWith(date)).forEach(r=>data.push([r.name,r.dur,r.pay||'',r.note||'',new Date(r.time).toLocaleString()]));
        if(data.length===1){toast('⚠️ 无数据可导出');return;}
        const wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'记录');
        XLSX.writeFile(wb,`${shopName}_记录_${date}.xlsx`);
        toast('✅ 导出成功');
    }

    function init(){
        shopName=localStorage.getItem(NAMEKEY)||'与己造物';
        $('shopNameText').textContent=shopName;
        document.title=shopName+' · 手工店计时';
        try{const p=JSON.parse(localStorage.getItem(SKEY));if(Array.isArray(p)&&p.length)seats=p;else throw 0;}catch(e){seats=Array.from({length:12},(_,i)=>mkSeat(i+1));save();}
        const now=Date.now();seats.forEach(s=>{if(s.run&&s.ts){s.acc+=(now-s.ts)/1000;s.ts=now;s.status='active';}});
        try{records=JSON.parse(localStorage.getItem(RKEY))||[];}catch(e){records=[];}
        refreshUI();renderPayOpts();
        if(displayTimer)clearInterval(displayTimer);displayTimer=setInterval(refreshDisplays,1000);
        if(saveTimer)clearInterval(saveTimer);saveTimer=setInterval(save,3000);
    }

    function setup(){
        $('seatsContainer').addEventListener('click',function(e){
            const btn=e.target.closest('[data-act]');
            const card=e.target.closest('.seat-card');
            if(card && !btn){const id=parseInt(card.dataset.sid);togSel(id);return;}
            if(!btn)return;
            e.stopPropagation();
            const act=btn.dataset.act,id=parseInt(btn.dataset.id);
            switch(act){
                case 'start':startTimer(id);break;
                case 'pause':pauseTimer(id);break;
                case 'end':isBatch=false;pendingEndId=id;const s=seats.find(x=>x.id===id);$('paymentSeatInfo').textContent=s?`${s.name} · ${fmt(dispTime(s))}`:'';selPay=null;renderPayOpts();$('confirmPaymentBtn').disabled=true;$('paymentModal').classList.remove('hidden');break;
                case 'open':openTable(id);break;
                case 'toggle':toggleMode(id);break;
                case 'cdown':pendingCustomId=id;$('customHoursInput').value='1';$('customMinutesInput').value='0';$('customSecondsInput').value='0';updateTotal();$('customTimeModal').classList.remove('hidden');break;
                case 'transfer':transfer(id);break;
                case 'del':delSeat(id);break;
                case 'noteSel':noteSel(id,btn.value);break;
                case 'noteSave':saveNote(id);break;
            }
        });
        $('confirmPaymentBtn').onclick=()=>{if(!selPay){toast('⚠️ 请选择收款方式');return;}if(isBatch){execBatchEnd(selPay);}else{endWithPay(pendingEndId,selPay);}$('paymentModal').classList.add('hidden');};
        $('cancelPaymentBtn').onclick=()=>$('paymentModal').classList.add('hidden');
        $('confirmTransferBtn').onclick=confirmTransfer;$('cancelTransferBtn').onclick=()=>{$('transferModal').classList.add('hidden');};
        function updateTotal(){const h=parseInt($('customHoursInput').value)||0,m=parseInt($('customMinutesInput').value)||0,s=parseInt($('customSecondsInput').value)||0;$('totalSecondsDisplay').textContent=h*3600+m*60+s;}
        $('customHoursInput').oninput=updateTotal;$('customMinutesInput').oninput=updateTotal;$('customSecondsInput').oninput=updateTotal;
        $('confirmCustomBtn').onclick=()=>{const total=(parseInt($('customHoursInput').value)||0)*3600+(parseInt($('customMinutesInput').value)||0)*60+(parseInt($('customSecondsInput').value)||0);if(total>0&&pendingCustomId){setCD(pendingCustomId,total);$('customTimeModal').classList.add('hidden');}};
        $('cancelCustomBtn').onclick=()=>$('customTimeModal').classList.add('hidden');
        document.querySelectorAll('.stat-card').forEach(c=>c.onclick=()=>{curFilter=c.dataset.filter;document.querySelectorAll('.stat-card').forEach(x=>x.classList.remove('active'));c.classList.add('active');refreshUI();selectedSeats.clear();});
        $('selectAllBtn').onclick=()=>{const v=seats.filter(s=>{if(curFilter==='active')return s.status==='active'||s.status==='paused';if(curFilter==='idle')return s.status==='idle';return true;});v.forEach(s=>selectedSeats.add(s.id));refreshUI();};
        $('deselectAllBtn').onclick=()=>{selectedSeats.clear();refreshUI();};
        $('batchOpenBtn').onclick=batchOpen;$('batchStartBtn').onclick=batchStart;$('batchEndBtn').onclick=batchEnd;$('batchNoteBtn').onclick=batchNote;
        $('confirmBatchNoteBtn').onclick=()=>{const nv=$('batchNoteSelect').value,cv=$('batchNoteInput').value.trim();selectedSeats.forEach(id=>{const s=seats.find(x=>x.id===id);if(s){if(cv){s.cnote=cv;s.note='';}else{s.note=nv;s.cnote='';}}});save();$('batchNoteModal').classList.add('hidden');refreshUI();toast('✅ 已批量备注');};
        $('cancelBatchNoteBtn').onclick=()=>$('batchNoteModal').classList.add('hidden');
        $('addSeatBtn').onclick=addSeat;
        $('resetAllIdleBtn').onclick=()=>{seats.forEach(s=>{pause(s);resetSeat(s);});save();refreshUI();};
        $('viewRecordsBtn').onclick=()=>{showRecords();$('recordsModal').classList.remove('hidden');};
        $('closeRecordsBtn').onclick=()=>$('recordsModal').classList.add('hidden');
        $('loadRecordsBtn').onclick=()=>{if($('recordDateInput').value)showRecords($('recordDateInput').value);};
        $('exportRecordsBtn').onclick=()=>exportExcel(new Date().toISOString().split('T')[0]);
        $('exportDayRecordsBtn').onclick=()=>exportExcel($('recordDateInput').value);
        // 店名修改
        $('shopNameDisplay').onclick=()=>{$('shopNameInput').value=shopName;$('shopNameModal').classList.remove('hidden');};
        $('saveShopNameBtn').onclick=()=>{const n=$('shopNameInput').value.trim();if(n){shopName=n;saveName();}$('shopNameModal').classList.add('hidden');};
        $('cancelShopNameBtn').onclick=()=>$('shopNameModal').classList.add('hidden');
        document.querySelectorAll('.modal-overlay').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden');});
        document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');});
    }

    init();setup();
    window.addEventListener('beforeunload',()=>{save();});
})();
</script>
</body>
</html>
