                    <span class="date-tag"><i class="fas fa-tags"></i> 共 ${pkgs.length} 个套餐</span>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-plus-circle"></i> 添加套餐</div>
                    <div class="form-row">
                        <div class="form-group"><label>套餐名称 <span style="color:#c0392b;">*</span></label><input type="text" id="pkgName" placeholder="如：基础拼豆"></div>
                        <div class="form-group"><label>类型</label><select id="pkgType"><option value="hourly">按时 (倒计时)</option><option value="daily">包天 (正计时)</option></select></div>
                        <div class="form-group" id="durationGroup"><label>时长 (分钟) <span style="color:#c0392b;">*</span></label><input type="number" id="pkgDuration" value="60" min="10"></div>

                        <div class="form-group" style="flex:0 0 100px;"><label>&nbsp;</label><button class="btn btn-primary" onclick="addPackage()"><i class="fas fa-plus"></i> 添加</button></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-list"></i> 套餐列表</div>
            `;
            if (pkgs.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-box-open"></i><p>暂无套餐，请添加</p></div>`;
            } else {
                html += `<div class="table-wrap"><table><thead><tr><th>名称</th><th>类型</th><th>时长</th><th>价格</th><th>座位</th><th>操作</th></tr></thead><tbody>`;
                pkgs.forEach(p => {
                    const typeLabel = p.type === 'daily' ? '包天' : '按时';
                    const durationLabel = p.type === 'daily' ? '—' : p.duration + ' 分钟';
                    const seatLabel = (p.seatCount || 1) === 2 ? '👥 双人' : '1人';
                    html +=
                        `<tr><td><strong>${p.name}</strong></td><td>${typeLabel}</td><td>${durationLabel}</td><td>¥${p.price.toFixed(2)}</td><td>${seatLabel}</td><td><button class="btn btn-danger btn-xs" onclick="deletePackage(${p.id})"><i class="fas fa-trash"></i></button></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            html += `</div>`;
            mainContent.innerHTML = html;
            const pkgType = document.getElementById('pkgType');
            const durationGroup = document.getElementById('durationGroup');
            pkgType.addEventListener('change', function() {
                durationGroup.style.display = this.value === 'daily' ? 'none' : 'block';
            });
            if (pkgType.value === 'daily') durationGroup.style.display = 'none';
        }

        function addPackage() {
            const name = document.getElementById('pkgName').value.trim();
            const type = document.getElementById('pkgType').value;
            let duration = null;
            if (type === 'hourly') {
                const durInput = document.getElementById('pkgDuration');
                duration = parseInt(durInput.value);
                if (isNaN(duration) || duration < 1) {
                    alert('请输入有效的时长（分钟）');
                    durInput.focus();
                    return;
                }
            }
            const price = parseFloat(document.getElementById('pkgPrice').value);
            const seatCount = parseInt(document.getElementById('pkgSeatCount').value) || 1;
            if (!name) {
                alert('请输入套餐名称');
                document.getElementById('pkgName').focus();
                return;
            }
            if (isNaN(price) || price < 0) {
                alert('请输入有效的价格（元）');
                document.getElementById('pkgPrice').focus();
                return;
            }
            data.packages.push({
                id: genId('package'),
                name: name,
                type: type,
                duration: duration,
                price: price,
                seatCount: seatCount,
            });
            saveData();
            renderPackage();
        }

        function deletePackage(id) {
            if (!confirm('确认删除该套餐？')) return;
            data.packages = data.packages.filter(p => p.id !== id);
            saveData();
            renderPackage();
        }

        // ================================================================
        //  预约管理（新增手机号 + 搜索功能）
        // ================================================================
        let appointmentSearchKeyword = '';

        function renderAppointment() {
            const apps = data.appointments;
            const pkgs = data.packages;
            const seats = data.seats;

            // 搜索过滤
            let filteredApps = apps;
            if (appointmentSearchKeyword.trim()) {
                const keyword = appointmentSearchKeyword.trim();
                filteredApps = apps.filter(a => {
                    const phone = a.phone || '';
                    return phone.includes(keyword);
                });
            }

            const today = todayISO();

            let html = `
                <div class="page-header">
                    <h2><i class="fas fa-calendar-check"></i> 预约管理</h2>
                    <span class="date-tag"><i class="fas fa-calendar-day"></i> 今日 ${apps.filter(a=>a.date===today && a.status!=='cancelled').length} 个预约</span>
                </div>
                <!-- 搜索栏 -->
                <div class="search-bar">
                    <i class="fas fa-search" style="color:#b48a7a;"></i>
                    <input type="text" id="appSearchInput" placeholder="🔍 输入手机号/尾号查询..." value="${appointmentSearchKeyword}" oninput="doAppSearch(this.value)">
                    ${appointmentSearchKeyword ? `<button class="search-clear" onclick="clearAppSearch()"><i class="fas fa-times-circle"></i></button>` : ''}
                    <span style="font-size:13px;color:#8a7a6e;margin-left:4px;">共 ${filteredApps.length} 条结果</span>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-plus-circle"></i> 添加预约</div>
                    <div class="form-row">
                        <div class="form-group"><label>顾客姓名 <span style="color:#c0392b;">*</span></label><input type="text" id="appCustomer" placeholder="姓名"></div>
                        <div class="form-group"><label>手机号 <span style="color:#c0392b;">*</span></label><input type="text" id="appPhone" placeholder="手机号"></div>
                        <div class="form-group"><label>日期</label><input type="date" id="appDate" value="${today}"></div>
                        <div class="form-group"><label>时间</label><input type="time" id="appTime" value="14:00"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>套餐</label><select id="appPackage"><option value="">— 无套餐 —</option>${pkgs.map(p => `<option value="${p.id}">${p.name} (${p.type === 'daily' ? '包天' : p.duration+'min'} ¥${p.price}${p.seatCount === 2 ? ' 👥双人' : ''})</option>`).join('')}</select></div>
                        <div class="form-group"><label>选择座位</label><select id="appSeat"><option value="">— 不指定 —</option>${seats.map(s => `<option value="${s.id}">座位 ${s.id} ${s.status === 'idle' ? '（空闲）' : '（占用）'}</option>`).join('')}</select></div>
                        <div class="form-group" style="flex:0 0 120px;"><label>&nbsp;</label><button class="btn btn-primary" onclick="addAppointment()"><i class="fas fa-plus"></i> 添加</button></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-list"></i> 预约列表 ${appointmentSearchKeyword ? `<span style="font-size:14px;font-weight:400;color:#e67e22;">（搜索：${appointmentSearchKeyword}）</span>` : ''}</div>
            `;
            if (filteredApps.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-calendar-plus"></i><p>${appointmentSearchKeyword ? '未找到匹配的预约' : '暂无预约'}</p></div>`;
            } else {
                const sorted = [...filteredApps].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                html +=
                    `<div class="table-wrap"><table><thead><tr><th>顾客</th><th>手机号</th><th>日期</th><th>时间</th><th>套餐</th><th>座位</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
                sorted.forEach(a => {
                    const pkg = pkgs.find(p => p.id === a.packageId);
                    const statusMap = {
                        'pending': '<span class="status-badge status-pending">待确认</span>',
                        'confirmed': '<span class="status-badge status-confirmed">已确认</span>',
                        'completed': '<span class="status-badge status-completed">已完成</span>',
                        'cancelled': '<span class="status-badge status-cancelled">已取消</span>',
                    };
                    const pkgName = pkg ?
                        `${pkg.name} (${pkg.type === 'daily' ? '包天' : pkg.duration+'min'})${pkg.seatCount === 2 ? ' 👥双人' : ''}` :
                        '无套餐';
                    const seatInfo = a.seatId ? `座位 ${a.seatId}` : '未指定';
                    const phoneDisplay = a.phone || '—';
                    // 高亮匹配的手机号
                    let phoneHighlight = phoneDisplay;
                    if (appointmentSearchKeyword.trim() && phoneDisplay.includes(appointmentSearchKeyword.trim())) {
                        const idx = phoneDisplay.indexOf(appointmentSearchKeyword.trim());
                        phoneHighlight = phoneDisplay.slice(0, idx) + '<mark>' + phoneDisplay.slice(idx, idx + appointmentSearchKeyword
                            .trim().length) + '</mark>' + phoneDisplay.slice(idx + appointmentSearchKeyword.trim().length);
                    }
                    html += `<tr class="${appointmentSearchKeyword && (a.phone || '').includes(appointmentSearchKeyword.trim()) ? 'highlight-match' : ''}">
                        <td><strong>${a.customer}</strong></td>
                        <td>${phoneHighlight}</td>
                        <td>${a.date}</td><td>${a.time}</td>
                        <td>${pkgName}</td>
                        <td>${seatInfo}</td>
                        <td>${statusMap[a.status] || statusMap['pending']}</td>
                        <td>
                            <div class="flex gap-8" style="flex-wrap:wrap;">
                                ${a.status === 'pending' ? `<button class="btn btn-success btn-xs" onclick="confirmApp(${a.id})"><i class="fas fa-check"></i> 确认到店</button>` : ''}
                                ${a.status !== 'cancelled' ? `<button class="btn btn-danger btn-xs" onclick="cancelApp(${a.id})"><i class="fas fa-times"></i> 取消预约</button>` : ''}
                                ${a.status === 'confirmed' ? `<button class="btn btn-warning btn-xs" onclick="completeApp(${a.id})"><i class="fas fa-flag-checkered"></i> 完成</button>` : ''}
                                <button class="btn btn-outline btn-xs" onclick="deleteApp(${a.id})"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table></div>`;
            }
            html += `</div>`;
            mainContent.innerHTML = html;
        }

        // ---- 预约搜索函数 ----
        function doAppSearch(value) {
            appointmentSearchKeyword = value.trim();
            renderAppointment();
        }

        function clearAppSearch() {
            appointmentSearchKeyword = '';
            renderAppointment();
        }

        // ---- 预约操作（添加时增加手机号） ----
        function addAppointment() {
            const customer = document.getElementById('appCustomer').value.trim();
            const phone = document.getElementById('appPhone').value.trim();
            const date = document.getElementById('appDate').value;
            const time = document.getElementById('appTime').value;
            const pkgId = parseInt(document.getElementById('appPackage').value) || null;
            const seatId = parseInt(document.getElementById('appSeat').value) || null;
            if (!customer) { alert('请输入顾客姓名'); return; }
            if (!phone) { alert('请输入手机号'); return; }
            if (!date || !time) { alert('请选择日期和时间'); return; }
            if (seatId) {
                const seat = data.seats.find(s => s.id === seatId);
                if (!seat) { alert('座位不存在'); return; }
                if (seat.status !== 'idle') { alert('该座位已被占用，无法预约'); return; }
            }
            data.appointments.push({
                id: genId('appointment'),
                customer,
                phone,
                date,
                time,
                packageId: pkgId,
                seatId: seatId,
                status: 'pending'
            });
            saveData();
            renderAppointment();
        }

        function confirmApp(id) {
            const app = data.appointments.find(a => a.id === id);
            if (app) { app.status = 'confirmed';
                saveData();
                renderAppointment(); }
        }

        function completeApp(id) {
            const app = data.appointments.find(a => a.id === id);
            if (!app || app.status === 'cancelled') { alert('已取消的预约不能完成'); return; }
            app.status = 'completed';
            const pkg = data.packages.find(p => p.id === app.packageId);
            if (pkg) {
                data.revenues.push({
                    id: genId('revenue'),
                    date: todayISO(),
                    amount: pkg.price,
                    type: 'appointment',
                    orderId: app.id,
                    customer: app.customer,
                    note: `预约套餐 · ${app.customer} · ${pkg.name}`
                });
            }
            saveData();
            renderAppointment();
        }

        function cancelApp(id) {
            const app = data.appointments.find(a => a.id === id);
            if (app) { app.status = 'cancelled';
                saveData();
                renderAppointment(); }
        }

        function deleteApp(id) {
            if (!confirm('确认删除？')) return;
            data.appointments = data.appointments.filter(a => a.id !== id);
            saveData();
            renderAppointment();
        }

        // ================================================================
        //  寄存管理（完整）
        // ================================================================
        let depositFilter = 'all';

        function renderDeposit() {
            const deposits = data.deposits || [];
            const today = todayISO();
            deposits.forEach(d => {
                if (d.status === 'collected') return;
                const expiry = d.expiryDate;
                if (expiry < today) {
                    d.status = 'expired';
                } else {
                    const daysLeft = diffDays(today, expiry);
                    if (daysLeft <= 1) d.status = 'warning';
                    else d.status = 'active';
                }
            });
            const total = deposits.length;
            const active = deposits.filter(d => d.status === 'active').length;
            const warning = deposits.filter(d => d.status === 'warning').length;
            const expired = deposits.filter(d => d.status === 'expired').length;
            const collected = deposits.filter(d => d.status === 'collected').length;

            let filtered = deposits;
            if (depositFilter === 'active') filtered = deposits.filter(d => d.status === 'active');
            else if (depositFilter === 'warning') filtered = deposits.filter(d => d.status === 'warning');
            else if (depositFilter === 'expired') filtered = deposits.filter(d => d.status === 'expired');
            else if (depositFilter === 'collected') filtered = deposits.filter(d => d.status === 'collected');

                    <div class="stat-card"><div class="number">${total}</div><div class="label">总寄存</div></div>

                    <div class="stat-card"><div class="number orange">${warning}</div><div class="label">即将到期</div></div>
                    <div class="stat-card"><div class="number red">${expired}</div><div class="label">已到期</div></div>
                    <div class="stat-card"><div class="number" style="color:#2c6b8a;">${collected}</div><div class="label">已取回</div></div>
                </div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-plus-circle"></i> 添加寄存</div>
                    <div class="form-row">
                        <div class="form-group"><label>顾客姓名（选填）</label><input type="text" id="depositCustomer" placeholder="姓名（可选）"></div>

                            <div id="depositImagePreview" style="margin-top:6px;"></div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>寄存日期</label><input type="date" id="depositDate" value="${today}"></div>
                        <div class="form-group"><label>寄存天数 <span style="color:#c0392b;">*</span></label>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="number" id="depositCustomDays" class="deposit-days-input" value="3" min="1" style="width:100px;" onchange="updateExpiryPreview()">
                                <span style="font-size:14px;color:#5a4a3e;">天</span>
                                <span id="expiryPreview" style="font-size:13px;color:#4a7c6f;margin-left:8px;"></span>
                            </div>
                        </div>
                        <div class="form-group"><label>备注</label><input type="text" id="depositNote" placeholder="备注信息（可选）"></div>
                        <div class="form-group" style="flex:0 0 120px;"><label>&nbsp;</label><button class="btn btn-primary" onclick="addDeposit()"><i class="fas fa-save"></i> 寄存</button></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">
                        <i class="fas fa-list"></i> 寄存列表
                        <span style="flex:1;"></span>
                        <div class="flex gap-8" style="font-weight:400;font-size:13px;">
                            <button class="btn-filter ${depositFilter === 'all' ? 'active' : ''}" onclick="setDepositFilter('all')">全部 (${total})</button>
                            <button class="btn-filter ${depositFilter === 'active' ? 'active' : ''}" onclick="setDepositFilter('active')">待取回 (${active})</button>
                            <button class="btn-filter ${depositFilter === 'warning' ? 'active' : ''}" onclick="setDepositFilter('warning')">即将到期 (${warning})</button>
                            <button class="btn-filter ${depositFilter === 'expired' ? 'active' : ''}" onclick="setDepositFilter('expired')">已到期 (${expired})</button>
                            <button class="btn-filter ${depositFilter === 'collected' ? 'active' : ''}" onclick="setDepositFilter('collected')">已取回 (${collected})</button>
                        </div>
                    </div>
            `;
            if (filtered.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-archive"></i><p>暂无寄存记录</p></div>`;
            } else {
                html += `<div class="table-wrap"><table><thead><tr><th>作品</th><th>顾客</th><th>电话</th><th>寄存日期</th><th>到期日期</th><th>状态</th><th>备注</th><th>操作</th></tr></thead><tbody>`;

            data.deposits.push({
                id: genId('deposit'),
                customerName: customerName || '未命名',
                phone: phone,
                image: imageData,
                depositDate: depositDate,

        // ---- 预约记录展开/收起 ----
        function toggleAppDetail(row) {
            const tbody = row.parentElement;
            const detailRows = tbody.querySelectorAll('.appointment-detail-row');
            const icon = row.querySelector('.rotate-icon');
            // 检查当前行是否已展开
            const nextRow = row.nextElementSibling;
            if (nextRow && nextRow.classList.contains('appointment-detail-row') && nextRow.dataset.belongsTo === String(row
                    .rowIndex)) {
                // 收起
                let removeCount = 0;
                let el = row.nextElementSibling;
                while (el && el.classList.contains('appointment-detail-row') && el.dataset.belongsTo === String(row.rowIndex)) {
                    const next = el.nextElementSibling;
                    el.remove();
                    removeCount++;
                    el = next;
                }
                if (icon) icon.classList.remove('open');
                return;
            }

            // 展开：先移除该行下面的已有详情
            let el = row.nextElementSibling;
            while (el && el.classList.contains('appointment-detail-row') && el.dataset.belongsTo === String(row.rowIndex)) {
                const next = el.nextElementSibling;
                el.remove();
                el = next;
            }

            // 插入新详情
            const encoded = row.dataset.detail;
            if (!encoded) return;
            const detailHtml = decodeURIComponent(encoded);
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = `<table><tbody>${detailHtml}</tbody></table>`;
            const newRows = tempDiv.querySelectorAll('tr');
            let insertAfter = row;
            newRows.forEach(tr => {
                tr.dataset.belongsTo = String(row.rowIndex);
                insertAfter.parentElement.insertBefore(tr, insertAfter.nextElementSibling);
                insertAfter = tr;
            });
            if (icon) icon.classList.add('open');
        }

        // ---- 收益相关 ----
        function exportRevenue() {
            if (data.revenues.length === 0) { alert('暂无数据'); return; }
            let csv = '日期,顾客,金额,类型,备注\n';
            data.revenues.forEach(r => {
                csv +=
                    `${r.date},${r.customer || '--'},${r.amount.toFixed(2)},${r.type === 'timer' ? '计时开台' : r.type === 'appointment' ? '预约' : '其他'},${r.note || ''}\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `收益_${todayISO()}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function init() {

                if (seat.status === 'idle') {
                    seat.startTime = null;
                    seat.duration = null;
                    seat.mode = null;
                    seat.price = 0;
                    seat.note = '';
                    seat.verified = false;
                    seat.customer = '';
                    seat.packageId = null;
                    seat.groupId = null;
                    seat.paused = false;
                    seat.pauseStartTime = null;
                    seat.totalPausedSeconds = 0;
                }
            });
            if (data.packages.length === 0) {
                data.packages.push({ id: genId('package'), name: '基础拼豆体验', type: 'hourly', duration: 60, price: 25,
                    seatCount: 1 });
                data.packages.push({ id: genId('package'), name: '进阶创作套餐', type: 'hourly', duration: 90, price: 35,
                    seatCount: 1 });

                    seatCount: 2 });
                data.packages.push({ id: genId('package'), name: '全天畅玩', type: 'daily', duration: null, price: 80,
                    seatCount: 1 });
                data.packages.push({ id: genId('package'), name: '双人全天畅玩', type: 'daily', duration: null, price: 140,
                    seatCount: 2 });
                saveData();
            }
            data.seats.forEach(s => {
                if (!s.mode) s.mode = null;
                if (!s.duration) s.duration = null;
                if (s.groupId === undefined) s.groupId = null;
                if (s.paused === undefined) s.paused = false;
                if (!s.pauseStartTime) s.pauseStartTime = null;
                if (s.totalPausedSeconds === undefined) s.totalPausedSeconds = 0;
            });
            data.packages.forEach(p => { if (p.seatCount === undefined) p.seatCount = 1; });
            // 为旧预约补充 phone 字段
            data.appointments.forEach(a => { if (!a.phone) a.phone = ''; });
            data.deposits.forEach(d => {
                if (d.status === undefined) d.status = 'active';
                if (!d.image) d.image = null;
                if (!d.note) d.note = '';
                if (!d.customerName) d.customerName = '';
                if (!d.phone) d.phone = '';
                if (!d.depositDate) d.depositDate = todayISO();
                if (!d.durationDays) d.durationDays = 3;
                if (!d.expiryDate) d.expiryDate = addDays(todayISO(), 3);
                if (d.collectedAt === undefined) d.collectedAt = null;
            });
            if (data.revenues.length > 50) data.revenues = data.revenues.slice(-50);
            updateShopInfo();
            saveData();
            renderTimer();
        }

        init();
    </script>
</body>
</html>
